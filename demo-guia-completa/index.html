on (diesel, unleaded 95 and AdBlue).","horario":"Open 24 hours, every day (Ministry Geoportal, 24/11/2026).","consejo":"It is on the Can Baltasar industrial estate, next to Av. de la Costa Brava (B-682), as you enter Palafolls. It sells AdBlue. Note: the Galp next door is closed from 22:00 to 06:00.","extra":""},"fr":{"tipo":"Station-service 24 h/24 (gazole, sans-plomb 95 et AdBlue).","horario":"Ouverte 24 h/24, tous les jours (Geoportal du ministère, 24/11/2026).","consejo":"Elle se trouve dans la zone industrielle de Can Baltasar, près de l'Av. de la Costa Brava (B-682), à l'entrée de Palafolls. Elle vend de l'AdBlue. Attention : la Galp voisine est fermée de 22:00 à 06:00.","extra":""},"sources":["https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroMunicipio/1020","https://geoportalgasolineras.es","https://www.openstreetmap.org/node/5863511293"]},{"id":"palafolls-gasolinera-24h-area-la-tordera-c32","town":"Palafolls","cat":"gasolinera_24h","name":"Moeve (rótulo Cepsa) – Àrea de Servei La Tordera (C-32)","lat":41.668119,"lng":2.715849,"address":"C-32, km 129,8, Sant Genís de Palafolls (Palafolls)","tel":"+34 937 65 21 64","web":"https://www.moeve.es/es/cerca-de-ti/gasolineras/barcelona/palafolls-la-tordera","guardia_url":"","season":"Todo el año","es":{"tipo":"Área de servicio 24 h en la autopista C-32.","horario":"Abierta las 24 horas, todos los días. Hay una estación en cada sentido (C-32, km 129,8).","consejo":"Útil si llegas de Barcelona por la C-32: se entra desde la propia autopista. Es más cara que las del pueblo: el 24/11/2026 la gasolina 95 costaba 1,604 €/l aquí y 1,459 €/l en Zona Diesel.","extra":""},"en":{"tipo":"24-hour service area on the C-32 motorway.","horario":"Open 24 hours, every day. There is one station in each direction (C-32, km 129.8).","consejo":"Handy if you are arriving from Barcelona on the C-32: you reach it from the motorway itself. It is dearer than the stations in town: on 24/11/2026 unleaded 95 cost €1.604/l here and €1.459/l at Zona Diesel.","extra":""},"fr":{"tipo":"Aire de service 24 h/24 sur l'autoroute C-32.","horario":"Ouverte 24 h/24, tous les jours. Il y a une station dans chaque sens (C-32, km 129,8).","consejo":"Pratique si vous arrivez de Barcelone par la C-32 : on y accède depuis l'autoroute. Elle est plus chère que celles du village : le 24/11/2026, le sans-plomb 95 coûtait 1,604 €/l ici contre 1,459 €/l chez Zona Diesel.","extra":""},"sources":["https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroMunicipio/1020","https://geoportalgasolineras.es","https://www.openstreetmap.org/node/287008048"]},{"id":"malgrat-de-mar-gasolinera-24h-ballenoil-n2","town":"Malgrat de Mar","cat":"gasolinera_24h","name":"Ballenoil Malgrat N-II (km 674,2)","lat":41.642219,"lng":2.725755,"address":"Carretera N-II, km 674,2, 08380 Malgrat de Mar","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Gasolinera low cost 24 h.","horario":"Abierta las 24 horas, todos los días. Hay una a cada lado de la N-II (Geoportal, 24/11/2026).","consejo":"El 24/11/2026 era la más barata de Malgrat y Palafolls según el Geoportal: gasolina 95 a 1,399 €/l y gasóleo A a 1,629 €/l (los precios cambian a diario). Está en la entrada oeste de Malgrat, viniendo de Santa Susanna.","extra":""},"en":{"tipo":"24-hour budget petrol station.","horario":"Open 24 hours, every day. There is one on each side of the N-II (Geoportal, 24/11/2026).","consejo":"On 24/11/2026 it was the cheapest in Malgrat and Palafolls according to the Geoportal: unleaded 95 at €1.399/l and diesel at €1.629/l (prices change daily). It is at the western entrance to Malgrat, coming from Santa Susanna.","extra":""},"fr":{"tipo":"Station low cost 24 h/24.","horario":"Ouverte 24 h/24, tous les jours. Il y en a une de chaque côté de la N-II (Geoportal, 24/11/2026).","consejo":"Le 24/11/2026, c'était la moins chère de Malgrat et de Palafolls selon le Geoportal : sans-plomb 95 à 1,399 €/l et gazole à 1,629 €/l (les prix changent tous les jours). Elle se trouve à l'entrée ouest de Malgrat, en venant de Santa Susanna.","extra":""},"sources":["https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroMunicipio/975","https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroMunicipio/1020","https://geoportalgasolineras.es","https://www.openstreetmap.org/node/536737181"]},{"id":"malgrat-de-mar-gasolinera-24h-ballenoil-sanllehi","town":"Malgrat de Mar","cat":"gasolinera_24h","name":"Ballenoil Malgrat (Av. Francesc Sanllehí)","lat":41.655836,"lng":2.742784,"address":"Av. de Francesc Sanllehí i Bosch, 11, 08380 Malgrat de Mar","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Gasolinera low cost 24 h.","horario":"Abierta las 24 horas, todos los días (Geoportal, 24/11/2026).","consejo":"Está al norte del casco urbano, a unos 500 m del Mercadona, así que puedes repostar después de la compra.","extra":""},"en":{"tipo":"24-hour budget petrol station.","horario":"Open 24 hours, every day (Geoportal, 24/11/2026).","consejo":"It is north of the town centre, about 500 m from Mercadona, so you can fill up after your shop.","extra":""},"fr":{"tipo":"Station low cost 24 h/24.","horario":"Ouverte 24 h/24, tous les jours (Geoportal, 24/11/2026).","consejo":"Elle se trouve au nord du centre-ville, à environ 500 m du Mercadona : vous pouvez faire le plein après vos courses.","extra":""},"sources":["https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroMunicipio/975","https://www.openstreetmap.org/node/11773170069"]},{"id":"palafolls-mercadillo-dissabte","town":"Palafolls","cat":"mercadillo","name":"Mercado semanal de Palafolls (sábados)","lat":41.668926,"lng":2.75234,"address":"Plaça de les Valls d'Ax / Av. de la Costa Brava, 08389 Palafolls","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Mercadillo semanal pequeño.","horario":"Sábados de 08:00 a 13:00.","consejo":"Es pequeño: unos 7 a 10 puestos de fruta, ropa y poco más. Si buscas un mercado grande, ve al de Malgrat el jueves por la mañana.","extra":"Junto a la Plaça de les Valls d'Ax y la Av. de la Costa Brava, en el centro de Palafolls."},"en":{"tipo":"Small weekly market.","horario":"Saturdays, 08:00 to 13:00.","consejo":"It is small: about 7 to 10 stalls selling fruit, clothes and not much else. For a big market, go to Malgrat's on Thursday morning.","extra":"Next to Plaça de les Valls d'Ax and Av. de la Costa Brava, in the centre of Palafolls."},"fr":{"tipo":"Petit marché hebdomadaire.","horario":"Le samedi de 08:00 à 13:00.","consejo":"Il est petit : environ 7 à 10 étals de fruits, de vêtements et guère plus. Pour un grand marché, allez à celui de Malgrat le jeudi matin.","extra":"Près de la Plaça de les Valls d'Ax et de l'Av. de la Costa Brava, dans le centre de Palafolls."},"sources":["https://mercadillos.org/es/palafolls/mercadillo-palafolls","https://bop.diba.cat/anuncio/ver-pdf/3930895","https://bop.diba.cat/anuncis/antic/022013028488"]},{"id":"malgrat-de-mar-mercadillo-dijous","town":"Malgrat de Mar","cat":"mercadillo","name":"Mercado semanal de los jueves (Malgrat de Mar)","lat":41.644233,"lng":2.740184,"address":"Aparcament del Liceu / Carrer de Ramon Turró, 08380 Malgrat de Mar","tel":"","web":"https://www.turismemalgrat.com/gaudeix-malgrat-de-mar/de-compres/","guardia_url":"","season":"Todo el año","es":{"tipo":"Mercadillo semanal grande (hasta 147 puestos).","horario":"Jueves de 08:00 a 14:00.","consejo":"Hay fruta y verdura, embutidos, quesos, pollo a l'ast y una gran zona de ropa, calzado y complementos. El jueves el mercado ocupa el aparcamiento del Liceu: aparca en la Plaça de Catalunya o ven en tren (la estación está a unos 5 min a pie).","extra":"La alimentación está en el aparcamiento del Liceu, entre el C/ d'en Blanch y el C/ Ramon Turró. La ropa, en el cruce de Balmes, Joan Maragall y Roger de Flor. La ordenanza municipal prevé hasta 124 puestos de ropa y 23 de alimentación."},"en":{"tipo":"Large weekly market (up to 147 stalls).","horario":"Thursdays, 08:00 to 14:00.","consejo":"There is fruit and veg, charcuterie, cheese, pollo a l'ast (spit-roast chicken) and a large area of clothes, shoes and accessories. On Thursdays the market takes over the Liceu car park, so park at Plaça de Catalunya or come by train (the station is about a 5-minute walk).","extra":"Food stalls are in the Liceu car park, between C/ d'en Blanch and C/ Ramon Turró. Clothes are where Balmes, Joan Maragall and Roger de Flor meet. The municipal by-law allows up to 124 clothing stalls and 23 food stalls."},"fr":{"tipo":"Grand marché hebdomadaire (jusqu'à 147 étals).","horario":"Le jeudi de 08:00 à 14:00.","consejo":"On y trouve fruits et légumes, charcuterie, fromages, pollo a l'ast (poulet rôti à la broche) et un grand espace de vêtements, chaussures et accessoires. Le jeudi, le marché occupe le parking du Liceu : garez-vous à la Plaça de Catalunya ou venez en train (la gare est à environ 5 min à pied).","extra":"L'alimentation se trouve sur le parking du Liceu, entre le C/ d'en Blanch et le C/ Ramon Turró. Les vêtements, au croisement de Balmes, Joan Maragall et Roger de Flor. Le règlement municipal prévoit jusqu'à 124 étals de vêtements et 23 d'alimentation."},"sources":["https://www.ajmalgrat.cat/media/repository/documents_oficials/normativa_per_temes/normativa_activitats/ordenanaa7a_reguladora_del_mercat_de_venda_no_sedentaria.pdf","https://www.turismemalgrat.com/gaudeix-malgrat-de-mar/de-compres/","https://mercadillos.org/es/malgrat-de-mar/mercadillo-malgrat-de-mar"]},{"id":"palafolls-bar-cafe-de-palafolls","town":"Palafolls","cat":"bar","name":"El Cafè de Palafolls","lat":41.668333,"lng":2.748346,"address":"Carrer de Francesc Macià, 1, 08389 Palafolls","tel":"+34 937 62 08 55","web":"http://www.cafedepalafolls.com/","guardia_url":"","season":"Todo el año (terraza con actividades en verano)","es":{"tipo":"Cafetería-bar de pueblo en el centro, con tapas y terraza; ambiente familiar.","horario":"De 07:30 a 23:30. Cierra los miércoles. (Horario de Google vía Wanderlog; no figura en su web.)","consejo":"Sirve desayunos, tapas, pizzas, bocadillos y platos combinados. Es un buen sitio para tomar algo tranquilo por la noche en Palafolls, con clientela del pueblo. En verano su web anuncia música en directo en la terraza ('Terrassa Activa'): confirma la programación.","extra":""},"en":{"tipo":"Local café-bar in the centre with tapas and a terrace; family-friendly feel.","horario":"07:30 to 23:30. Closed on Wednesdays. (Google hours via Wanderlog; not shown on its website.)","consejo":"It serves breakfasts, tapas, pizzas, sandwiches and combination plates. A good spot for a quiet evening drink in Palafolls, with a local crowd. In summer its website advertises live music on the terrace ('Terrassa Activa'): check the programme.","extra":""},"fr":{"tipo":"Café-bar de village dans le centre, avec tapas et terrasse ; ambiance familiale.","horario":"De 07:30 à 23:30. Fermé le mercredi. (Horaires Google via Wanderlog ; non indiqués sur son site.)","consejo":"Petits-déjeuners, tapas, pizzas, sandwichs et assiettes combinées. Une bonne adresse pour boire un verre au calme le soir à Palafolls, avec une clientèle locale. En été, son site annonce de la musique live en terrasse (« Terrassa Activa ») : vérifiez la programmation.","extra":""},"sources":["http://www.cafedepalafolls.com/","https://wanderlog.com/place/details/676968/el-café-de-parafolls","https://gastroranking.es/r/el-cafe-de-parafolls_219633/"]},{"id":"malgrat-de-mar-bar-underground","town":"Malgrat de Mar","cat":"bar","name":"Underground Malgrat","lat":41.644003,"lng":2.737412,"address":"Carrer de Mossèn Fèlix Paradeda, 1, 08380 Malgrat de Mar","tel":"+34 681 24 04 78","web":"http://www.undergroundmalgrat.com/","guardia_url":"","season":"Todo el año","es":{"tipo":"Bar-restaurante acogedor: cerveza artesana, cócteles, coques y hamburguesas.","horario":"Lunes de 19:00 a 23:00. Martes a sábado de 13:00 a 16:00 y de 19:00 a 23:00. Domingo cerrado. Abierto todo el año.","consejo":"Buen sitio para cenar algo informal o tomar una cerveza artesana o un cóctel en un local acogedor y con buena música; apto para familias. Reserva el fin de semana (también por WhatsApp). Cierra los domingos.","extra":""},"en":{"tipo":"Cosy bar-restaurant: craft beer, cocktails, coques (Catalan flatbreads) and burgers.","horario":"Monday 19:00 to 23:00. Tuesday to Saturday 13:00 to 16:00 and 19:00 to 23:00. Closed on Sundays. Open all year.","consejo":"A good place for a casual dinner or a craft beer or cocktail in a cosy setting with good music; family-friendly. Book at weekends (WhatsApp also works). Closed on Sundays.","extra":""},"fr":{"tipo":"Bar-restaurant chaleureux : bière artisanale, cocktails, coques (galettes catalanes) et burgers.","horario":"Lundi de 19:00 à 23:00. Du mardi au samedi de 13:00 à 16:00 et de 19:00 à 23:00. Fermé le dimanche. Ouvert toute l'année.","consejo":"Idéal pour un dîner décontracté ou une bière artisanale ou un cocktail dans un cadre chaleureux, avec de la bonne musique ; adapté aux familles. Réservez le week-end (possible aussi par WhatsApp). Fermé le dimanche.","extra":""},"sources":["http://www.undergroundmalgrat.com/","https://gastroranking.es/r/underground_185340/"]},{"id":"palafolls-comer-casa-oms","town":"Palafolls","cat":"comer","name":"Casa Oms","lat":41.663308,"lng":2.752754,"address":"Ctra. de Palafolls a Malgrat s/n, 08389 Palafolls","tel":"+34 937 62 00 49","web":"http://www.casaoms.com/","guardia_url":"","season":"Todo el año","es":{"tipo":"Cocina mediterránea de producto en una masía histórica. Solo mediodía (y desayunos el fin de semana).","horario":"Lunes, martes, jueves y viernes de 13:00 a 16:00. Sábado y domingo de 08:30 a 11:00 (desayuno de tenedor) y de 13:00 a 16:00. Cerrado los miércoles.","consejo":"No abre por la noche. Las reservas son solo por teléfono (93 762 00 49): reserva con antelación el fin de semana. El fin de semana prueba el 'esmorzar de forquilla' (desayuno de tenedor).","extra":"Masía gótica reformada en estilo modernista y catalogada como Bé Cultural d'Interès Local."},"en":{"tipo":"Mediterranean, produce-led cooking in a historic masia (Catalan farmhouse). Lunch only (plus breakfasts at weekends).","horario":"Monday, Tuesday, Thursday and Friday 13:00 to 16:00. Saturday and Sunday 08:30 to 11:00 (hearty 'fork' breakfast) and 13:00 to 16:00. Closed on Wednesdays.","consejo":"Not open in the evening. Bookings by phone only (93 762 00 49): book ahead at weekends. At the weekend, try the 'esmorzar de forquilla', a hearty Catalan cooked breakfast.","extra":"A Gothic masia remodelled in Modernista style, listed as a Bé Cultural d'Interès Local (local heritage asset)."},"fr":{"tipo":"Cuisine méditerranéenne de produits dans une masia (ferme catalane) historique. Midi uniquement (et petits-déjeuners le week-end).","horario":"Lundi, mardi, jeudi et vendredi de 13:00 à 16:00. Samedi et dimanche de 08:30 à 11:00 (petit-déjeuner « à la fourchette ») et de 13:00 à 16:00. Fermé le mercredi.","consejo":"Pas de service le soir. Réservations uniquement par téléphone (93 762 00 49) : réservez à l'avance le week-end. Le week-end, goûtez l'« esmorzar de forquilla », un copieux petit-déjeuner salé catalan.","extra":"Masia gothique remaniée dans le style moderniste, classée Bé Cultural d'Interès Local (patrimoine local)."},"sources":["http://www.casaoms.com/","https://gastroranking.es/r/casa-oms_21900/","https://patrimonicultural.diba.cat/node/92691"]},{"id":"palafolls-comer-ca-l-estevenet","town":"Palafolls","cat":"comer","name":"Ca l'Estevenet","lat":41.669139,"lng":2.749291,"address":"Carrer Major, 38, 08389 Palafolls","tel":"+34 937 62 01 08","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Cocina catalana casera y a la brasa, con clientela del pueblo.","horario":"No publicado. Llama antes de ir (93 762 01 08): una reseña de octubre de 2026 avisa de que puede cerrar por vacaciones sin que se indique en internet.","consejo":"Para comer casero y a buen precio, sobre todo entre semana con el menú del día: canelones, carnes a la brasa, arroces y paella. Está en el Carrer Major, en el centro. Las reseñas son algo irregulares: el menú del domingo recibe más críticas.","extra":""},"en":{"tipo":"Home-style Catalan cooking and chargrilled meats, with a local crowd.","horario":"Not published. Ring before you go (93 762 01 08): an October 2026 review warns that it may close for holidays without this showing online.","consejo":"For good-value home cooking, especially the weekday set menu: cannelloni, chargrilled meats, rice dishes and paella. It is on Carrer Major, in the centre. Reviews are a little mixed: the Sunday menu gets more criticism.","extra":""},"fr":{"tipo":"Cuisine catalane maison et grillades, avec une clientèle locale.","horario":"Non publiés. Appelez avant d'y aller (93 762 01 08) : un avis d'octobre 2026 signale qu'il peut fermer pour congés sans que ce soit indiqué en ligne.","consejo":"Pour manger fait maison à bon prix, surtout en semaine avec le menu du jour : cannellonis, viandes à la braise, riz et paella. Il se trouve dans le Carrer Major, dans le centre. Les avis sont un peu inégaux : le menu du dimanche est plus critiqué.","extra":""},"sources":["https://gastroranking.es/r/ca-lestevenet_106309/","https://gastroranking.es/restaurantes/barcelona/palafolls/","https://www.openstreetmap.org/node/11489001232"]},{"id":"malgrat-de-mar-comer-la-torreta","town":"Malgrat de Mar","cat":"comer","name":"Restaurant La Torreta","lat":41.651349,"lng":2.739648,"address":"Av. de la Costa Brava, 79, 08380 Malgrat de Mar","tel":"+34 937 61 05 46","web":"https://restaurantlatorreta.com","guardia_url":"","season":"Todo el año","es":{"tipo":"Restaurante mediterráneo en pleno Parc Francesc Macià.","horario":"Mediodías de lunes a domingo, de 13:00 a 16:00. Noches de jueves a domingo, de 20:00 a 23:00. Cerrado el 24 y el 25 de diciembre de 2026.","consejo":"Menú diario a 19,50 €, menú festivo a 26 € y menú infantil a 12 €. Pide mesa en la terraza o en el primer piso por las vistas al parque. Reserva con al menos 1 h de antelación (web o teléfono). Algunas reseñas avisan de que el aparcamiento es pequeño: ven con margen.","extra":"Menú de noche a 22 €. El 7 de diciembre de 2026 también abre por la noche."},"en":{"tipo":"Mediterranean restaurant in the heart of Parc Francesc Macià.","horario":"Lunch Monday to Sunday, 13:00 to 16:00. Dinner Thursday to Sunday, 20:00 to 23:00. Closed on 24 and 25 December 2026.","consejo":"Daily set menu €19.50, holiday menu €26 and children's menu €12. Ask for a table on the terrace or the first floor for views over the park. Book at least 1 hour ahead (online or by phone). Some reviews mention the car park is small, so allow extra time.","extra":"Evening menu €22. On 7 December 2026 it is also open in the evening."},"fr":{"tipo":"Restaurant méditerranéen au cœur du Parc Francesc Macià.","horario":"Le midi du lundi au dimanche, de 13:00 à 16:00. Le soir du jeudi au dimanche, de 20:00 à 23:00. Fermé les 24 et 25 décembre 2026.","consejo":"Menu du jour à 19,50 €, menu des jours fériés à 26 € et menu enfant à 12 €. Demandez une table en terrasse ou au premier étage pour la vue sur le parc. Réservez au moins 1 h à l'avance (en ligne ou par téléphone). Certains avis signalent que le parking est petit : prévoyez de la marge.","extra":"Menu du soir à 22 €. Le 7 décembre 2026, il ouvre aussi le soir."},"sources":["https://restaurantlatorreta.com","https://gastroranking.es/r/la-torreta-3_28127/","https://www.openstreetmap.org/node/2326711190"]},{"id":"malgrat-de-mar-comer-antonio","town":"Malgrat de Mar","cat":"comer","name":"Bar Restaurante Antonio","lat":41.639568,"lng":2.734615,"address":"Passeig Marítim, 24 (C.C. Sant Roc, local 16), 08380 Malgrat de Mar","tel":"+34 937 65 42 53","web":"http://www.antoniorestaurant.com/","guardia_url":"","season":"Todo el año","es":{"tipo":"Restaurante mediterráneo de arroces y pescado frito en el paseo marítimo.","horario":"Abierto todo el año. En invierno: lunes, jueves y domingo de 13:00 a 16:00; viernes y sábado de 13:00 a 16:00 y de 20:00 a 23:00; cerrado martes y miércoles.","consejo":"Su especialidad son las paellas y los arroces (las reseñas destacan la paella de marisco). Reserva por teléfono (93 765 42 53), sobre todo si quieres terraza. Está dentro del pequeño Centre Comercial Sant Roc (local 16).","extra":"Unos 20–30 € por persona (Gastroranking). Clientela sobre todo familiar."},"en":{"tipo":"Mediterranean restaurant serving rice dishes and fried fish on the seafront promenade.","horario":"Open all year. Winter: Monday, Thursday and Sunday 13:00 to 16:00; Friday and Saturday 13:00 to 16:00 and 20:00 to 23:00; closed Tuesday and Wednesday.","consejo":"Its speciality is paella and other rice dishes (reviews praise the seafood paella). Book by phone (93 765 42 53), especially if you want a terrace table. It is inside the small Centre Comercial Sant Roc (unit 16).","extra":"About €20–30 per person (Gastroranking). Mostly a family crowd."},"fr":{"tipo":"Restaurant méditerranéen de riz et de friture de poisson sur le front de mer.","horario":"Ouvert toute l'année. En hiver : lundi, jeudi et dimanche de 13:00 à 16:00 ; vendredi et samedi de 13:00 à 16:00 et de 20:00 à 23:00 ; fermé mardi et mercredi.","consejo":"Sa spécialité : la paella et les plats de riz (les avis saluent la paella aux fruits de mer). Réservez par téléphone (93 765 42 53), surtout pour une table en terrasse. Il se trouve dans le petit Centre Comercial Sant Roc (local 16).","extra":"Environ 20–30 € par personne (Gastroranking). Clientèle surtout familiale."},"sources":["http://www.antoniorestaurant.com/","https://gastroranking.es/r/bar-restaurante-antonio-3_28124/","https://www.openstreetmap.org/node/2326754914"]},{"id":"malgrat-de-mar-comer-la-bota-bodega","town":"Malgrat de Mar","cat":"comer","name":"La Bota Bodega","lat":41.644211,"lng":2.740721,"address":"Carrer d'en Blanch, 22, 08380 Malgrat de Mar","tel":"+34 937 61 03 42","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Bodega y brasería a la leña con clientela local.","horario":"No publicado. Llama antes de ir (93 761 03 42).","consejo":"Pollo a la brasa, conejo, costillas y cochinillo hechos a la leña. Va mucha gente del pueblo: reserva el fin de semana. Está junto al aparcamiento del Liceu, así que puedes combinarlo con el mercado del jueves.","extra":""},"en":{"tipo":"Wood-fired bodega and grill with a local crowd.","horario":"Not published. Ring before you go (93 761 03 42).","consejo":"Wood-fired chargrilled chicken, rabbit, ribs and suckling pig. Lots of locals eat here, so book at weekends. It is next to the Liceu car park, so you can combine it with the Thursday market.","extra":""},"fr":{"tipo":"Bodega et grill au feu de bois, clientèle locale.","horario":"Non publiés. Appelez avant d'y aller (93 761 03 42).","consejo":"Poulet à la braise, lapin, travers de porc et cochon de lait cuits au feu de bois. Beaucoup d'habitants y viennent : réservez le week-end. Il se trouve à côté du parking du Liceu, idéal à combiner avec le marché du jeudi.","extra":""},"sources":["https://gastroranking.es/r/la-bota-bodega_28125/"]},{"id":"palafolls-iconico-castell-de-palafolls","town":"Palafolls","cat":"iconico","name":"Castell de Palafolls","lat":41.678792,"lng":2.73528,"address":"Camí del Castell, 08389 Palafolls","tel":"","web":"https://www.castelldepalafolls.cat/","guardia_url":"","season":"Todo el año, solo en las fechas de visita anunciadas (con reserva)","es":{"tipo":"Castillo medieval (siglos X–XIV), Bé Cultural d'Interès Nacional, sobre un cerro de 161 m que domina el valle bajo de la Tordera.","horario":"Solo con visita guiada y reserva previa en castelldepalafolls.cat, en las fechas que anuncia el Ajuntament (en otoño de 2026: fines de semana de octubre y el 15 de noviembre). Máximo 4 entradas por reserva; los menores de 8 años no necesitan entrada.","consejo":"Reabrió en 2026 tras la restauración y las plazas se agotan en minutos: apúntate a la lista de espera de la web. Desde el nuevo mirador de 360° de la torre del homenaje se ve el delta de la Tordera. Llega 15 min antes y lleva calzado cerrado: algunas zonas siguen en excavación.","extra":"El aparcamiento y el punto de acogida figuran como 'por confirmar' en la web oficial: revísalo al reservar."},"en":{"tipo":"Medieval castle (10th–14th centuries), a Bé Cultural d'Interès Nacional (national heritage site), on a 161 m hill overlooking the lower Tordera valley.","horario":"Guided visits only, booked in advance at castelldepalafolls.cat, on dates announced by the Ajuntament (autumn 2026: weekends in October and 15 November). Maximum 4 tickets per booking; children under 8 do not need a ticket.","consejo":"It reopened in 2026 after restoration and places sell out in minutes, so join the waiting list on the website. The new 360° viewpoint on the keep looks out over the Tordera delta. Arrive 15 minutes early and wear closed shoes: some areas are still being excavated.","extra":"Parking and the visitor meeting point are still listed as 'to be confirmed' on the official website: check when you book."},"fr":{"tipo":"Château médiéval (Xe–XIVe siècles), Bé Cultural d'Interès Nacional (monument historique), sur une colline de 161 m dominant la basse vallée de la Tordera.","horario":"Uniquement en visite guidée sur réservation sur castelldepalafolls.cat, aux dates annoncées par l'Ajuntament (automne 2026 : week-ends d'octobre et 15 novembre). 4 billets maximum par réservation ; les moins de 8 ans n'ont pas besoin de billet.","consejo":"Il a rouvert en 2026 après sa restauration et les places partent en quelques minutes : inscrivez-vous sur la liste d'attente du site. Le nouveau belvédère à 360° du donjon offre une vue sur le delta de la Tordera. Arrivez 15 min en avance et portez des chaussures fermées : certaines zones sont encore en fouilles.","extra":"Le parking et le point d'accueil sont encore indiqués « à confirmer » sur le site officiel : vérifiez au moment de réserver."},"sources":["https://www.castelldepalafolls.cat/","https://www.tickettailor.com/events/ajuntamentdepalafolls/2442160","https://patrimonicultural.diba.cat/node/92660","https://www.openstreetmap.org/way/102354386"]},{"id":"malgrat-de-mar-iconico-torre-del-castell","town":"Malgrat de Mar","cat":"iconico","name":"Torre del Castell y Parc del Castell","lat":41.647999,"lng":2.740193,"address":"Parc del Castell, 08380 Malgrat de Mar","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Torre de vigía de origen medieval, rehecha en el siglo XVI, con mirador en lo alto del parque.","horario":"Parque municipal de entrada libre. Horario no publicado.","consejo":"Desde la explanada y el mirador metálico de la torre se ven los castillos de Palafolls y Blanes y la costa. Está en pleno centro: sube a pie desde la zona de la iglesia de Sant Nicolau.","extra":""},"en":{"tipo":"Watchtower of medieval origin, rebuilt in the 16th century, with a viewpoint at the top of the park.","horario":"Municipal park, free entry. Opening hours not published.","consejo":"From the esplanade and the tower's metal viewing platform you can see the castles of Palafolls and Blanes and the coast. It is right in the centre: walk up from the area around the church of Sant Nicolau.","extra":""},"fr":{"tipo":"Tour de guet d'origine médiévale, reconstruite au XVIe siècle, avec un belvédère en haut du parc.","horario":"Parc municipal en accès libre. Horaires non publiés.","consejo":"Depuis l'esplanade et la plateforme métallique de la tour, on voit les châteaux de Palafolls et de Blanes ainsi que la côte. Elle est en plein centre : montez à pied depuis les abords de l'église de Sant Nicolau.","extra":""},"sources":["https://patrimonicultural.diba.cat/node/51158","https://ca.wikipedia.org/wiki/Torre_del_Castell_(Malgrat_de_Mar)","https://www.openstreetmap.org/way/866234991"]},{"id":"malgrat-de-mar-atardecer-desembocadura-tordera","town":"Malgrat de Mar","cat":"atardecer","name":"Desembocadura de la Tordera (Platja de la Punta de la Tordera)","lat":41.648742,"lng":2.772142,"address":"Platja de la Punta de la Tordera, 08380 Malgrat de Mar","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Delta y playa natural en el extremo este de Malgrat, sin edificios (espacio protegido, red Natura 2000).","horario":"Acceso libre todo el año. A finales de noviembre el sol se pone hacia las 17:20.","consejo":"Es un punto llano, no un mirador: desde la playa, mira hacia el suroeste, a lo largo de la costa. En otoño e invierno el sol se pone sobre esa línea de costa; en verano se pone más al noroeste, tierra adentro, siguiendo el río. Llega a pie por la playa o por el camino del Delta (5 km, llano), que sale del pueblo o de los campings del paseo. Las dunas y la laguna están protegidas: no las pises. Lleva prismáticos (garzas y martín pescador) y linterna para volver.","extra":""},"en":{"tipo":"Natural delta and beach at the eastern end of Malgrat, with no buildings (protected area, Natura 2000 network).","horario":"Free access all year. In late November the sun sets at around 17:20.","consejo":"It is a flat spot, not a viewpoint: from the beach, look south-west along the coast. In autumn and winter the sun sets over that coastline; in summer it sets further north-west, inland, up the river. Walk there along the beach or on the Delta path (5 km, flat), which starts from the town or from the campsites on the seafront. The dunes and lagoon are protected, so keep off them. Bring binoculars (herons and kingfishers) and a torch for the walk back.","extra":""},"fr":{"tipo":"Delta et plage naturelle à l'extrémité est de Malgrat, sans constructions (espace protégé, réseau Natura 2000).","horario":"Accès libre toute l'année. Fin novembre, le soleil se couche vers 17:20.","consejo":"C'est un lieu plat, pas un belvédère : depuis la plage, regardez vers le sud-ouest, le long de la côte. En automne et en hiver, le soleil se couche sur cette ligne de côte ; en été, il se couche plus au nord-ouest, vers l'intérieur des terres, dans l'axe du fleuve. Venez à pied par la plage ou par le chemin du Delta (5 km, plat), qui part du village ou des campings du front de mer. Les dunes et la lagune sont protégées : n'y marchez pas. Apportez des jumelles (hérons et martins-pêcheurs) et une lampe pour le retour.","extra":""},"sources":["https://femturisme.cat/rutes/un-passeig-pels-antics-camins-de-malgrat-de-mar","https://www.openstreetmap.org/way/702224528"]},{"id":"palafolls-ruta-castell-des-de-font-del-ferro","town":"Palafolls","cat":"ruta","name":"Ruta circular al Castell de Palafolls desde el Institut Font del Ferro","lat":41.671793,"lng":2.745418,"address":"Institut Font del Ferro, Carrer del Camí de la Ciutadella, 08389 Palafolls","tel":"","web":"https://www.castelldepalafolls.cat/","guardia_url":"","season":"Todo el año","es":{"tipo":"Paseo por pista forestal señalizada hasta el castillo.","horario":"Camino por pista forestal, mejor con luz de día. El recinto del castillo solo se visita con reserva previa (castelldepalafolls.cat).","consejo":"Desde el instituto, toma la pista de la izquierda señalizada hacia una casa rural y 'la Ciutadella', y después sigue las indicaciones por pista forestal. Lleva agua y calzado cerrado. Si quieres entrar en el castillo y subir a la torre del homenaje, haz coincidir el paseo con una visita reservada: sin reserva no se puede entrar.","extra":"3,7 km · circular · dificultad baja · la fuente no da el tiempo (calcula 1–1,5 h, estimado)."},"en":{"tipo":"Walk along a signposted forest track up to the castle.","horario":"Forest track, best walked in daylight. The castle grounds can only be visited with an advance booking (castelldepalafolls.cat).","consejo":"From the school, take the track on the left signposted to a rural guesthouse and 'la Ciutadella', then follow the signs along the forest track. Take water and closed shoes. If you want to go inside the castle and climb the keep, time your walk with a booked visit: you cannot get in without a booking.","extra":"3.7 km · circular · easy · the source gives no time (allow 1–1.5 h, estimated)."},"fr":{"tipo":"Promenade sur une piste forestière balisée jusqu'au château.","horario":"Piste forestière, de préférence de jour. L'enceinte du château ne se visite que sur réservation (castelldepalafolls.cat).","consejo":"Depuis le lycée, prenez la piste de gauche indiquant une maison d'hôtes rurale et « la Ciutadella », puis suivez les panneaux le long de la piste forestière. Emportez de l'eau et des chaussures fermées. Pour entrer dans le château et monter au donjon, faites coïncider la balade avec une visite réservée : sans réservation, on ne peut pas entrer.","extra":"3,7 km · boucle · facile · la source n'indique pas de durée (comptez 1 h–1 h 30, estimation)."},"sources":["https://www.escapadaambnens.com/activitat/622/el-castell-de-palafolls/","https://www.castelldepalafolls.cat/","https://ca.wikiloc.com/rutes-senderisme/castell-de-palafolls-3562731"]},{"id":"malgrat-de-mar-ruta-cami-de-santa-rita","town":"Malgrat de Mar","cat":"ruta","name":"Camí de Santa Rita (Parc Francesc Macià – Ermita de Santa Rita)","lat":41.650388,"lng":2.739149,"address":"Parc de Francesc Macià, 08380 Malgrat de Mar","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Paseo corto señalizado entre pinos hasta una pequeña ermita.","horario":"Acceso libre.","consejo":"El camino sale del centro del pueblo y cruza el Parc Francesc Macià (más de 40.000 m², con esculturas gigantes y zonas de pícnic) antes de subir a la ermita de Santa Rita. El desnivel máximo es de 50 m, apto para familias. Si quieres algo más exigente, está el Camí de les Mines de Can Palomeres (6 km). Puedes acabar comiendo en La Torreta, dentro del mismo parque.","extra":"Unos 2,5 km · desnivel máximo 50 m · fácil · la fuente no da el tiempo (unos 45 min a paso tranquilo, estimado)."},"en":{"tipo":"Short signposted walk through the pines to a small hermitage.","horario":"Free access.","consejo":"The path starts in the town centre and crosses Parc Francesc Macià (over 40,000 m², with giant sculptures and picnic areas) before climbing to the Ermita de Santa Rita. The maximum climb is 50 m, so it suits families. For something more demanding, try the Camí de les Mines de Can Palomeres (6 km). You can finish with a meal at La Torreta, inside the same park.","extra":"About 2.5 km · max. climb 50 m · easy · the source gives no time (about 45 min at a gentle pace, estimated)."},"fr":{"tipo":"Courte promenade balisée dans les pins jusqu'à un petit ermitage.","horario":"Accès libre.","consejo":"Le chemin part du centre du village et traverse le Parc Francesc Macià (plus de 40 000 m², avec des sculptures géantes et des aires de pique-nique) avant de monter à l'ermitage de Santa Rita. Le dénivelé maximal est de 50 m : idéal en famille. Pour plus d'effort, il y a le Camí de les Mines de Can Palomeres (6 km), plus exigeant. Vous pouvez finir par un repas à La Torreta, dans le même parc.","extra":"Environ 2,5 km · dénivelé max. 50 m · facile · la source n'indique pas de durée (environ 45 min à allure tranquille, estimation)."},"sources":["https://femturisme.cat/rutes/un-passeig-pels-antics-camins-de-malgrat-de-mar","https://www.openstreetmap.org/way/205118535","https://restaurantlatorreta.com"]},{"id":"malgrat-de-mar-urgencias-cap-malgrat","town":"Malgrat de Mar","cat":"urgencias","name":"CAP Dr. Josep Torné (Malgrat de Mar) – atención continuada","lat":41.646822,"lng":2.736589,"address":"Av. de la Costa Brava s/n, 08380 Malgrat de Mar","tel":"+34 93 761 95 00 / Emergencias: 112","web":"https://salutms.cat/cap-dr-josep-torne-malgrat-de-mar/","guardia_url":"","season":"Todo el año (24 h solo en verano)","es":{"tipo":"Centro de salud (CAP) con atención continuada para urgencias leves.","horario":"De septiembre a junio: todos los días de 08:00 a 20:00. En verano (de junio a septiembre): atención continuada las 24 horas.","consejo":"Ven aquí para urgencias leves. Fuera de este horario, ve a urgencias del Hospital de Blanes o del de Calella (24 h, todo el año). Para emergencias graves, llama al 112; para consultas sanitarias, al 061 (24 h).","extra":""},"en":{"tipo":"Health centre (CAP) with continuous care for minor emergencies.","horario":"September to June: every day, 08:00 to 20:00. Summer (June to September): continuous care 24 hours a day.","consejo":"Come here for minor emergencies. Outside these hours, go to A&E at Hospital de Blanes or Hospital de Calella (24 h, all year). For serious emergencies call 112; for health advice call 061 (24 h).","extra":""},"fr":{"tipo":"Centre de santé (CAP) avec soins continus pour les urgences légères.","horario":"De septembre à juin : tous les jours de 08:00 à 20:00. En été (de juin à septembre) : soins continus 24 h/24.","consejo":"Venez ici pour les urgences légères. En dehors de ces horaires, allez aux urgences de l'Hospital de Blanes ou de celui de Calella (24 h/24, toute l'année). Pour une urgence grave, appelez le 112 ; pour un conseil médical, le 061 (24 h/24).","extra":""},"sources":["https://salutms.cat/cap-dr-josep-torne-malgrat-de-mar/","https://salutms.cat/ciutadania/informacio/anar-a-urgencies-8/","https://www.openstreetmap.org/way/589848672"]},{"id":"malgrat-de-mar-tren-estacio-malgrat","town":"Malgrat de Mar","cat":"tren","name":"Estación de Malgrat de Mar (Rodalies R1)","lat":41.641532,"lng":2.741404,"address":"Estació de Malgrat de Mar, 08380 Malgrat de Mar","tel":"","web":"https://rodalies.gencat.cat/ca/sobre-rodalies/linies-i-estacions/servei_rodalia_barcelona/r1/","guardia_url":"","season":"Todo el año","es":{"tipo":"Estación de Rodalies, línea R1.","horario":"Hacia Barcelona, de 06:07 a 21:57, laborables y domingos (horario consultado para el 25 y el 29/11/2026).","consejo":"El último tren a Barcelona sale a las 21:57. La estación está junto a la playa y tiene aparcamiento disuasorio. Es zona tarifaria 5H.","extra":"Destinos directos: Blanes (4 min), Barcelona-Pl. Catalunya (unos 1 h 16 min) y Barcelona-Sants (unos 1 h 21 min). Frecuencia: cada 30 min hacia Barcelona y hacia Blanes; hacia Blanes hay trenes hasta las 00:18. También para aquí la línea RG1 (hacia Girona y Figueres)."},"en":{"tipo":"Rodalies (commuter rail) station, line R1.","horario":"To Barcelona, 06:07 to 21:57, weekdays and Sundays (timetable checked for 25 and 29/11/2026).","consejo":"The last train to Barcelona leaves at 21:57. The station is right by the beach and has a park-and-ride car park. It is in fare zone 5H.","extra":"Direct services: Blanes (4 min), Barcelona-Pl. Catalunya (about 1 h 16 min) and Barcelona-Sants (about 1 h 21 min). Frequency: every 30 min towards Barcelona and towards Blanes; trains to Blanes run until 00:18. The RG1 line (towards Girona and Figueres) also stops here."},"fr":{"tipo":"Gare Rodalies (trains de banlieue), ligne R1.","horario":"Vers Barcelone, de 06:07 à 21:57, en semaine et le dimanche (horaires consultés pour les 25 et 29/11/2026).","consejo":"Le dernier train pour Barcelone part à 21:57. La gare est juste à côté de la plage et dispose d'un parking relais. Elle est en zone tarifaire 5H.","extra":"Liaisons directes : Blanes (4 min), Barcelona-Pl. Catalunya (environ 1 h 16) et Barcelona-Sants (environ 1 h 21). Fréquence : toutes les 30 min vers Barcelone et vers Blanes ; trains vers Blanes jusqu'à 00:18. La ligne RG1 (vers Girona et Figueres) dessert aussi la gare."},"sources":["https://horarios.renfe.com/cer/hjcer310.jsp?nucleo=50&i=s&cp=NO&o=79605&d=78805&df=20261125&ho=00&hd=26&TXTInfo=","https://horarios.renfe.com/cer/hjcer310.jsp?nucleo=50&i=s&cp=NO&o=79605&d=78805&df=20261129&ho=00&hd=26&TXTInfo=","https://horarios.renfe.com/cer/hjcer310.jsp?nucleo=50&i=s&cp=NO&o=79605&d=71801&df=20261125&ho=00&hd=26&TXTInfo=","https://horarios.renfe.com/cer/hjcer310.jsp?nucleo=50&i=s&cp=NO&o=79605&d=79606&df=20261125&ho=00&hd=26&TXTInfo="]},{"id":"cc-outlet-social-palafolls","town":"Palafolls","cat":"centro_comercial","name":"Outlet Social Palafolls (For&From: Massimo Dutti, Bershka, Oysho…)","lat":41.667738,"lng":2.748879,"address":"Av. Costa Brava 4-9 y C/ Major 7-12, 08389 Palafolls","tel":"+34 931 155 060","web":"https://www.fundaciomoli.org/projectes/palafollscomprasocial/punts-de-venda/","guardia_url":"","season":"Todo el año (tiendas de calle). Horario no publicado.","es":{"tipo":"Outlet social de marcas en tiendas de calle, en el centro del pueblo. Lo gestiona la Fundació El Molí d'en Puigvert: Massimo Dutti, Bershka y Oysho For&From, Yerse, Lola Casademunt, Textura, Jack & Jones y Red Point. En 2025 se sumaron Munich y Gisela.","horario":"No hay horario publicado. Llama antes, sobre todo en domingo o festivo: Massimo Dutti 937 657 546, Oysho 937 652 019, Bershka 937 657 720.","consejo":"Massimo Dutti, Oysho, Yerse y Textura están en Av. Costa Brava 4-9. Bershka y Lola Casademunt están en el C/ Major 7-12, que es semipeatonal. Aparca en las calles de alrededor y recórrelo a pie: todo queda a pocos minutos andando.","extra":"Jack & Jones y Red Point están en C/ Ramon Turró 31 y 54. La fundación anunció la reforma y ampliación de Bershka en 2026. El 80% de la plantilla son personas con enfermedad mental grave. Unos 8-10 min en coche desde el centro de Malgrat o de Blanes."},"en":{"tipo":"Social outlet of brand-name shops on ordinary streets in the town centre, run by the Fundació El Molí d'en Puigvert: Massimo Dutti, Bershka and Oysho For&From, Yerse, Lola Casademunt, Textura, Jack & Jones and Red Point. Munich and Gisela joined in 2025.","horario":"No published opening hours. Ring ahead, especially on a Sunday or bank holiday: Massimo Dutti 937 657 546, Oysho 937 652 019, Bershka 937 657 720.","consejo":"Massimo Dutti, Oysho, Yerse and Textura are on Av. Costa Brava 4-9. Bershka and Lola Casademunt are on C/ Major 7-12, a semi-pedestrianised street. Park in the surrounding streets and walk round: everything is a few minutes apart on foot.","extra":"Jack & Jones and Red Point are at C/ Ramon Turró 31 and 54. The foundation announced a refurbishment and enlargement of the Bershka shop in 2026. 80% of the staff are people with severe mental illness. About 8-10 min by car from the centre of Malgrat or Blanes."},"fr":{"tipo":"Outlet solidaire de marques dans des boutiques de rue, au centre du village, géré par la Fundació El Molí d'en Puigvert : Massimo Dutti, Bershka et Oysho For&From, Yerse, Lola Casademunt, Textura, Jack & Jones et Red Point. Munich et Gisela s'y sont ajoutés en 2025.","horario":"Aucun horaire publié. Appelez avant, surtout le dimanche ou un jour férié : Massimo Dutti 937 657 546, Oysho 937 652 019, Bershka 937 657 720.","consejo":"Massimo Dutti, Oysho, Yerse et Textura se trouvent Av. Costa Brava 4-9. Bershka et Lola Casademunt sont C/ Major 7-12, une rue semi-piétonne. Garez-vous dans les rues voisines et faites le tour à pied : tout est à quelques minutes de marche.","extra":"Jack & Jones et Red Point sont C/ Ramon Turró 31 et 54. La fondation a annoncé la rénovation et l'agrandissement de la boutique Bershka en 2026. 80 % du personnel sont des personnes atteintes d'une maladie mentale sévère. Environ 8-10 min en voiture depuis le centre de Malgrat ou de Blanes."},"sources":["https://www.fundaciomoli.org/projectes/palafollscomprasocial/punts-de-venda/","https://www.fundaciomoli.org/projectes/palafollscomprasocial/","https://es.ara.cat/misc/munich-gisela-incorporan-outlet-social-palafolls_1_5577180.html","https://discapnet.es/noticia/outlet-social-abre-palafolls-tienda-textura-emplea-personas-vulnerables"]},{"id":"cc-mataro-parc","town":"Mataró","cat":"centro_comercial","name":"Mataró Parc","lat":41.555087,"lng":2.435066,"address":"C/ Estrasburg 5, 08304 Mataró","tel":"+34 937 988 298","web":"https://mataro-parc.com/","guardia_url":"","season":"Todo el año. Horario ampliado del 1/6 al 30/9.","es":{"tipo":"Gran centro comercial de 70.000 m²: más de 80 tiendas (moda, hogar, deporte, informática), un gran supermercado, cine de 12 salas y una veintena de locales de restauración y ocio.","horario":"Tiendas: lunes a sábado de 9:00 a 21:00 (del 1/6 al 30/9, de 9:30 a 22:00). Restauración hasta las 23:30. En domingo solo abren restauración y ocio, salvo los domingos y festivos de apertura autorizada: C&A del centro anuncia 29/11, 6/12, 8/12 y 13/12/2026, de 9:00 a 21:00.","consejo":"Parking gratuito y cubierto. Desde la costa por la C-32, sal por 'Mataró Oeste'. No vayas a comprar un domingo normal: las tiendas solo abren los días de apertura especial.","extra":"Unos 20-25 min en coche desde Calella (25 km) y unos 35 min desde Blanes (40 km). En transporte público: tren R1 hasta Mataró y bus urbano (líneas 1 a 5, según la web del centro)."},"en":{"tipo":"Large 70,000 m² shopping centre: over 80 shops (fashion, homeware, sport, computing), a large supermarket, a 12-screen cinema and around twenty places to eat or for leisure.","horario":"Shops: Monday to Saturday 9:00-21:00 (1/6 to 30/9, 9:30-22:00). Restaurants until 23:30. On Sundays only restaurants and leisure open, except on authorised Sunday and bank holiday openings: C&A in the centre lists 29/11, 6/12, 8/12 and 13/12/2026, 9:00-21:00.","consejo":"Free covered car park. From the coast on the C-32, take the 'Mataró Oeste' exit. Don't go shopping on an ordinary Sunday: the shops only open on special opening days.","extra":"About 20-25 min by car from Calella (25 km) and about 35 min from Blanes (40 km). By public transport: R1 train to Mataró, then a town bus (lines 1 to 5, according to the centre's website)."},"fr":{"tipo":"Grand centre commercial de 70 000 m² : plus de 80 boutiques (mode, maison, sport, informatique), un grand supermarché, un cinéma de 12 salles et une vingtaine d'adresses de restauration et de loisirs.","horario":"Boutiques : du lundi au samedi de 9:00 à 21:00 (du 1/6 au 30/9, de 9:30 à 22:00). Restauration jusqu'à 23:30. Le dimanche, seuls la restauration et les loisirs ouvrent, sauf les dimanches et jours fériés d'ouverture autorisée : le C&A du centre annonce les 29/11, 6/12, 8/12 et 13/12/2026, de 9:00 à 21:00.","consejo":"Parking gratuit et couvert. Depuis la côte par la C-32, prenez la sortie « Mataró Oeste ». N'y allez pas faire du shopping un dimanche ordinaire : les boutiques n'ouvrent que les jours d'ouverture exceptionnelle.","extra":"Environ 20-25 min en voiture depuis Calella (25 km) et environ 35 min depuis Blanes (40 km). En transports en commun : train R1 jusqu'à Mataró, puis bus urbain (lignes 1 à 5, selon le site du centre)."},"sources":["https://mataro-parc.com/horario-comercial/","https://mataro-parc.com/contacto/","https://mataro-parc.com/servicios/","https://visitmataro.cat/en/where-to-shop"]},{"id":"cc-la-roca-village","town":"La Roca del Vallès","cat":"centro_comercial","name":"La Roca Village","lat":41.610756,"lng":2.34386,"address":"La Roca Village s/n, Santa Agnès de Malanyanes, 08430 La Roca del Vallès","tel":"","web":"https://www.thebicestercollection.com/la-roca-village/es/horario","guardia_url":"","season":"Todo el año, excepto 25-26/12, 1/1, 6/1 y 1/5.","es":{"tipo":"Outlet de marcas al aire libre, con boutiques de moda y lujo con descuento, restaurantes y cafeterías.","horario":"Del 23/11 al 13/12/2026 abre todos los días (domingos y 8/12 incluidos) de 10:00 a 21:00. Viernes 27/11 de 9:00 a 22:00 y jueves 3/12 de 10:00 a 22:00. Los restaurantes abren 30 min antes. Cerrado el 25 y 26/12, el 1 y 6/1 y el 1/5. El 31/12, de 10:00 a 19:00. A partir del 14/12, consulta la web.","consejo":"Parking gratuito, con puntos de recarga para coche eléctrico. Abre domingos y festivos: buen plan para un día de lluvia. Desde la costa es mejor ir en coche. El bus Shopping Express sale de Barcelona (Estació del Nord) y conviene comprar el billete antes porque las plazas son limitadas.","extra":"Unos 30-35 min en coche desde Calella (39 km) y unos 45 min desde Blanes (54 km)."},"en":{"tipo":"Open-air designer outlet village, with discounted fashion and luxury boutiques, restaurants and cafés.","horario":"From 23/11 to 13/12/2026 it opens every day (Sundays and 8/12 included), 10:00-21:00. Friday 27/11, 9:00-22:00, and Thursday 3/12, 10:00-22:00. Restaurants open 30 min earlier. Closed 25 and 26/12, 1 and 6/1 and 1/5. On 31/12, 10:00-19:00. From 14/12, check the website.","consejo":"Free car park with electric-car charging points. Open on Sundays and bank holidays: a good rainy-day plan. From the coast, driving is best. The Shopping Express coach leaves from Barcelona (Estació del Nord) and it's worth buying your ticket in advance, as seats are limited.","extra":"About 30-35 min by car from Calella (39 km) and about 45 min from Blanes (54 km)."},"fr":{"tipo":"Village outlet de marques en plein air, avec des boutiques de mode et de luxe à prix réduits, des restaurants et des cafés.","horario":"Du 23/11 au 13/12/2026, ouvert tous les jours (dimanches et 8/12 compris) de 10:00 à 21:00. Vendredi 27/11 de 9:00 à 22:00 et jeudi 3/12 de 10:00 à 22:00. Les restaurants ouvrent 30 min plus tôt. Fermé les 25 et 26/12, les 1 et 6/1 et le 1/5. Le 31/12, de 10:00 à 19:00. À partir du 14/12, consultez le site.","consejo":"Parking gratuit avec bornes de recharge pour voitures électriques. Ouvert le dimanche et les jours fériés : bon plan pour un jour de pluie. Depuis la côte, mieux vaut y aller en voiture. La navette Shopping Express part de Barcelone (Estació del Nord) et il vaut mieux acheter son billet à l'avance, les places étant limitées.","extra":"Environ 30-35 min en voiture depuis Calella (39 km) et environ 45 min depuis Blanes (54 km)."},"sources":["https://www.thebicestercollection.com/la-roca-village/es/horario","https://www.thebicestercollection.com/la-roca-village/ca/horari","https://www.thebicestercollection.com/la-roca-village/es/visita/como-llegar","https://www.thebicestercollection.com/la-roca-village/es/como-llegar/shopping-express/"]},{"id":"bar-sala-mozart-cafe-jazz-calella","town":"Calella","cat":"bar","name":"Sala Mozart (Cafè Jazz de Calella)","lat":41.61418,"lng":2.660329,"address":"Carrer de l'Església, 91, 08370 Calella","tel":"","web":"https://www.calellabarcelona.com/en/plan/things-to-do/cafe-jazz-calella","guardia_url":"","season":"Cafè Jazz: febrero–marzo. Escena Calella: de otoño a primavera","es":{"tipo":"Sala histórica de espectáculos con café. En febrero y marzo acoge el Cafè Jazz: jazz en directo y gratis los viernes","horario":"Cafè Jazz: viernes a las 22:00, solo en febrero y marzo (en 2026, del 6 de febrero al 27 de marzo; las fechas de 2027 aún no se han publicado). Escena Calella programa teatro, música y danza de otoño a primavera, sobre todo los sábados","consejo":"El Cafè Jazz es gratis. Las entradas de Escena Calella se compran en entrapolis.com o en la taquilla (miércoles de 17:00 a 19:00 en semanas con función, y una hora antes). Casi todo el teatro es en catalán: la música y la danza son la apuesta segura","extra":"El Cafè Jazz también se celebra en el restaurante Can Tivill y en Macanudo (C/ Sant Joan, 79). En noviembre no hay Cafè Jazz"},"en":{"tipo":"Historic performance hall with a café. In February and March it hosts Cafè Jazz: free live jazz on Friday nights","horario":"Cafè Jazz: Fridays at 22:00, February and March only (in 2026, 6 February to 27 March; 2027 dates not yet published). Escena Calella runs theatre, music and dance from autumn to spring, mostly on Saturdays","consejo":"Cafè Jazz is free. Escena Calella tickets are sold at entrapolis.com or at the box office (Wednesdays 17:00–19:00 in weeks with a show, and one hour before curtain). Most plays are in Catalan, so music and dance are the safe bet","extra":"Cafè Jazz also takes place at Can Tivill restaurant and at Macanudo (C/ Sant Joan, 79). There is no Cafè Jazz in November"},"fr":{"tipo":"Salle de spectacle historique avec café. En février et mars, elle accueille le Cafè Jazz : jazz en live et gratuit le vendredi soir","horario":"Cafè Jazz : le vendredi à 22:00, uniquement en février et mars (en 2026, du 6 février au 27 mars ; les dates 2027 ne sont pas encore publiées). Escena Calella propose théâtre, musique et danse de l'automne au printemps, surtout le samedi","consejo":"Le Cafè Jazz est gratuit. Les billets d'Escena Calella sont en vente sur entrapolis.com ou au guichet (le mercredi de 17:00 à 19:00 les semaines de spectacle, et une heure avant). Le théâtre est presque toujours en catalan : misez plutôt sur la musique et la danse","extra":"Le Cafè Jazz a aussi lieu au restaurant Can Tivill et chez Macanudo (C/ Sant Joan, 79). Pas de Cafè Jazz en novembre"},"sources":["https://www.calellabarcelona.com/en/plan/things-to-do/cafe-jazz-calella","https://calellabarcelona.com/en/plan/whats-on-in-calella/cafe-jazz","https://calellabarcelona.com/en/plan/things-to-do/cultural-cycle-escena-calella","https://www.radiocalellatv.cat/wp-content/uploads/2025/11/EscenaCalella.pdf"]},{"id":"bar-bahari-club-calella","town":"Calella","cat":"bar","name":"Bahari Club","lat":41.61025,"lng":2.652731,"address":"Platja de Garbí s/n, 08370 Calella","tel":"+34 606 60 83 33","web":"https://www.bahariclub.com/","guardia_url":"","season":"Abierto todo el año según Tripaligner; el horario de invierno no está publicado","es":{"tipo":"Chiringuito-restaurante en la playa de Garbí, con cócteles y música en directo; ambiente agradable","horario":"Gastroranking indica todos los días de 10:30 a 18:00 y otra ficha da hasta las 23:45. Hay reseñas hasta el 24/10/2026. En temporada baja, llama antes","consejo":"Para bajar a la playa se cruza el paso subterráneo del Passeig de les Roques, 18. Puedes reservar online desde bahariclub.com","extra":"Turismo de Calella lo incluye entre sus chiringuitos con la etiqueta de música en directo"},"en":{"tipo":"Beach bar and restaurant on Garbí beach, with cocktails and live music; pleasant, easy-going vibe","horario":"Gastroranking lists daily 10:30–18:00, while another listing gives hours until 23:45. Reviews run up to 24/10/2026. In low season, ring ahead","consejo":"To reach the beach, take the underpass at Passeig de les Roques, 18. You can book online via bahariclub.com","extra":"Calella's tourist office lists it among its beach bars, tagged for live music"},"fr":{"tipo":"Paillote-restaurant sur la plage de Garbí, avec cocktails et musique live ; ambiance agréable","horario":"Gastroranking indique tous les jours de 10:30 à 18:00, une autre fiche jusqu'à 23:45. Des avis datent encore du 24/10/2026. En basse saison, appelez avant","consejo":"Pour descendre à la plage, empruntez le passage souterrain du Passeig de les Roques, 18. Réservation en ligne sur bahariclub.com","extra":"L'office de tourisme de Calella le classe parmi ses paillotes, avec la mention musique live"},"sources":["https://www.calellabarcelona.com/en/plan/where-to-eat/beach-bars/bahari-club/","https://www.bahariclub.com/","https://gastroranking.es/r/bahari-club_122433/","https://tripaligner.com/countries/spain-39/destinations/mataro-3869/places/bahari-club-10497606"]},{"id":"super-mercadona-tordera","town":"Tordera","cat":"super_tarde","name":"Mercadona Tordera","lat":41.694568,"lng":2.723366,"address":"Passatge del Pla de Vall, s/n (Fibracolor), 08490 Tordera","tel":"938 87 83 32","web":"https://www.mercadona.es","guardia_url":"","season":"Todo el año","es":{"tipo":"Supermercado grande con aparcamiento propio","horario":"Lunes a sábado de 09:00 a 21:00 según RadarSuper (datos del directorio de Mercadona, 23/11/2026); OSM indica 21:30. Domingo cerrado","consejo":"Tiene aparcamiento propio para clientes. Como cierra los domingos, haz la compra el sábado; en festivos, llama antes (938 87 83 32)","extra":"Está en el barrio de Fibracolor, junto al Carrer de Caterina Albert"},"en":{"tipo":"Large supermarket with its own car park","horario":"Monday to Saturday 09:00–21:00 according to RadarSuper (data from Mercadona's directory, 23/11/2026); OSM says 21:30. Closed on Sundays","consejo":"There is a customer car park. It shuts on Sundays, so do your shopping on Saturday; on bank holidays, ring first (938 87 83 32)","extra":"In the Fibracolor area, next to Carrer de Caterina Albert"},"fr":{"tipo":"Grand supermarché avec parking","horario":"Du lundi au samedi de 09:00 à 21:00 selon RadarSuper (données de l'annuaire de Mercadona, 23/11/2026) ; OSM indique 21:30. Fermé le dimanche","consejo":"Parking réservé aux clients. Fermé le dimanche : faites vos courses le samedi ; les jours fériés, appelez avant (938 87 83 32)","extra":"Dans le quartier de Fibracolor, à côté du Carrer de Caterina Albert"},"sources":["https://radarsuper.com/m/barcelona/tordera/mercadona-c-sector-pla-de-vall-s-n","https://www.alimarket.es/alimentacion/establecimiento/1063951-2026-2574623/mercadona","https://nominatim.openstreetmap.org/lookup?osm_ids=W678571339&format=json","https://euroweeklynews.com/2026/09/02/mercadona-brings-in-new-closing-time-as-summer-hours-end/"]}]/*POIS_END*/;

function km(a, b){ const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r; const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLng/2)**2; return 12742 * Math.asin(Math.sqrt(h)); }
const hasLoc = p => typeof p.lat === 'number' && typeof p.lng === 'number';
const fmtDist = d => d < 1 ? Math.max(50, Math.round(d * 20) * 50) + ' m' : (d < 10 ? d.toFixed(1) : Math.round(d)).toString().replace('.', st.lang === 'en' ? '.' : ',') + ' km';
/* Navegación de un toque: con coordenadas, destino exacto; sin ellas, búsqueda por nombre y dirección */
function navUrls(p){
  if (hasLoc(p)) { const q = p.lat.toFixed(6) + ',' + p.lng.toFixed(6);
    return {g:'https://www.google.com/maps/dir/?api=1&destination=' + q, a:'https://maps.apple.com/?daddr=' + q + '&dirflg=d', w:'https://waze.com/ul?ll=' + q + '&navigate=yes'}; }
  const s = encodeURIComponent([p.name, p.address, p.town].filter(Boolean).join(', '));
  return {g:'https://www.google.com/maps/search/?api=1&query=' + s, a:'https://maps.apple.com/?q=' + s, w:'https://waze.com/ul?q=' + s + '&navigate=yes'};
}
let leafletP = null;
function loadLeaflet(){
  if (window.L && window.L.map) return Promise.resolve(window.L);
  if (leafletP) return leafletP;
  const css = ['https://unpkg.com/leaflet@1.9.4/dist/leaflet.css', 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css'];
  const js = ['https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js', 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'];
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = css[0]; l.onerror = () => { l.onerror = null; l.href = css[1]; }; document.head.appendChild(l);
  leafletP = new Promise((res, rej) => {
    const next = () => { if (window.L && window.L.map) return res(window.L); const u = js.shift(); if (!u) return rej(new Error('leaflet'));
      const s = document.createElement('script'); s.src = u; s.async = true; s.onload = next; s.onerror = next; document.head.appendChild(s); };
    next();
  }).then(Lf => loadCluster().then(() => Lf)).catch(e => { leafletP = null; throw e; });
  return leafletP;
}
/* Agrupación de pines (opcional): si no carga, el mapa funciona igual con pines sueltos */
function loadCluster(){
  if (window.L && window.L.markerClusterGroup) return Promise.resolve(true);
  ['MarkerCluster.css', 'MarkerCluster.Default.css'].forEach(f => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://unpkg.com/leaflet.markercluster@1.5.3/dist/' + f; document.head.appendChild(l); });
  const js = ['https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js', 'https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js'];
  return new Promise(res => { const next = () => { if (window.L.markerClusterGroup) return res(true); const u = js.shift(); if (!u) return res(false);
    const s = document.createElement('script'); s.src = u; s.async = true; s.onload = next; s.onerror = next; document.head.appendChild(s); }; next(); });
}
/* Fondo: ICGC (como la guía) y, si no carga ninguna tesela, OpenStreetMap */
function baseLayer(Lf, map, onFail){
  const icgc = Lf.tileLayer('https://geoserveis.icgc.cat/servei/catalunya/mapa-base/wmts/estandard/MON3857NW/{z}/{x}/{y}.png', {maxZoom:19, maxNativeZoom:18, attribution:'© <a href="https://www.icgc.cat/" target="_blank" rel="noopener">ICGC</a> CC BY 4.0 · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'});
  const osm = Lf.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'});
  let ok = false, errs = 0;
  icgc.on('tileload', () => { ok = true; });
  icgc.on('tileerror', () => { if (ok || ++errs < 4 || !map.hasLayer(icgc)) return; map.removeLayer(icgc); osm.addTo(map); });
  let ok2 = false, errs2 = 0; osm.on('tileload', () => { ok2 = true; }); osm.on('tileerror', () => { if (!ok2 && ++errs2 >= 4 && onFail) onFail(); });
  icgc.addTo(map);
}
function newMap(Lf, el){
  const touch = window.matchMedia('(pointer: coarse)').matches;
  const map = Lf.map(el, {zoomControl:true, scrollWheelZoom:false, tap:false, dragging:true, maxZoom:19, zoomSnap:.5});
  if (touch) map.dragging.enable();
  map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  return map;
}

function btnTel(tel, label){ return `<a class="btn sm" href="${esc(telHref(tel))}">${svg('phone')}<span>${esc(label)}</span></a>`; }
function checklist(head, keys){ return `<div class="check"><b>${esc(head)}</b><ul>${keys.map(k => `<li>${esc(t(k))}</li>`).join('')}</ul></div>`; }

function arrivalResults(){

  loadLeaflet().then(Lf => {
    const h = home(); mini = newMap(Lf, $('miniMap')); mini.setView([h.lat, h.lng], 15);
    baseLayer(Lf, mini); miniHome = Lf.marker([h.lat, h.lng], {icon:homeIcon(Lf), keyboard:false}).addTo(mini);
    $('miniMsg').remove();
  }).catch(() => { $('miniMsg').textContent = t('mapErr'); });
}

/* ==================================================================== 5 · EXPLORA LA COSTA */
const poiText = (p, k) => (p[st.lang] && p[st.lang][k]) || (p.es && p.es[k]) || '';
function withDist(){ const h = home(); return POIS.map(p => Object.assign({}, p, {d: hasLoc(p) ? km(h, p) : (p.town === town().n ? 1.5 : 99)})); }
/* Los centros comerciales son de comarca: salen siempre, también en «Cerca de ti», ordenados por distancia */
function inScope(p){ return st.scope === 'all' || p.d <= NEAR_KM || p.town === town().n || p.cat === 'centro_comercial'; }
function inFilter(p){ return st.filter === 'all' || (CATS[p.cat] && CATS[p.cat].f === st.filter); }
function visiblePois(){
  return withDist().filter(p => inScope(p) && inFilter(p)).sort((a, b) => {
    if (st.filter === 'urg') { const o = CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat); if (o) return o; }
    return a.d - b.d;
  });
}
function poiCard(p, inSheet){
  const k = CATS[p.cat] || {c:'#3E4A57', i:'pin'}, u = navUrls(p), first = isApple ? ['a','g','w'] : ['g','a','w'];
  const lbl = {g:t('gmaps'), a:t('amaps'), w:t('waze')}, ico = {g:'google', a:'apple', w:'waze'};
  const horario = poiText(p, 'horario'), extra = poiText(p, 'extra');
  const host = s => { try { return new URL(s).hostname.replace(/^www\./, ''); } catch(e) { return s; } };
  const srcs = (p.sources || []).slice(0, 2).map(s => /^https?:/.test(s) ? `<a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(host(s))}</a>` : esc(s)).join(' · ');
  return `<article class="poi${st.active === p.id && !inSheet ? ' on' : ''}" ${inSheet ? '' : `id="poi-${esc(p.id)}"`} style="--c:${k.c}">
    <div class="poi-h"><span class="poi-ic">${svg(k.i)}</span><div><h4>${esc(p.name)}</h4>
      <div class="poi-meta"><span class="cat">${esc(t('c_' + p.cat))}</span><span>${esc(p.town)}${p.d < 90 ? ' · ' + fmtDist(p.d) : ''}</span>${p.season && !/todo el año|all year|toute l/i.test(p.season) ? `<span class="season">${esc(t('season'))}: ${esc(p.season)}</span>` : ''}</div></div></div>
    <dl class="poi-dl"><div><dt>${esc(t('lTipo'))}</dt><dd>${esc(poiText(p, 'tipo'))}</dd></div>${horario ? `<div><dt>${esc(t('lHorario'))}</dt><dd>${esc(horario)}</dd></div>` : ''}${extra ? `<div><dt>${esc(t('lExtra'))}</dt><dd>${esc(extra)}</dd></div>` : ''}</dl>
    ${p.cat === 'farmacia' && p.guardia_url ? `<div class="poi-guard"><span class="small">${esc(t('guardiaNote'))}</span><a class="btn pri sm" href="${esc(p.guardia_url)}" target="_blank" rel="noopener noreferrer">${svg('cross')}${esc(t('guardiaBtn'))}</a></div>` : ''}
    <p class="poi-tip">${svg('bulb')}<span><b>${esc(t('lConsejo'))}${colon()}</b>${esc(poiText(p, 'consejo'))}</span></p>
    <div class="poi-go">${first.map(x => `<a href="${esc(u[x])}" target="_blank" rel="noopener noreferrer">${svg(ico[x])}<span>${esc(lbl[x])}</span></a>`).join('')}</div>
    <div class="poi-acts">${p.tel ? `<a class="btn" href="${esc(telHref(p.tel))}">${svg('phone')}${esc(t('call'))}</a>` : ''}${p.web ? `<a class="btn" href="${esc(p.web)}" target="_blank" rel="noopener noreferrer">${svg('globe')}${esc(t('web'))}</a>` : ''}<button type="button" class="btn" data-copy="${esc(p.id)}">${svg('copy')}${esc(t('copy'))}</button>${!inSheet && hasLoc(p) ? `<button type="button" class="btn" data-show="${esc(p.id)}">${svg('map')}${esc(t('onMap'))}</button>` : ''}</div>
    <p class="poi-src">${hasLoc(p) ? '' : esc(t('approx')) + ' · '}${srcs ? esc(t('src')) + colon() + ' ' + srcs + ' · ' : ''}${esc(t('checked', {d:fmtDate(CHECKED)}))}</p>
  </article>`;
}
/* Ficha copiable con el formato de «notas de insider» (sirve para Google My Maps, WhatsApp o notas) */
const colon = () => st.lang === 'fr' ? ' :' : ':';
function insiderText(p){
  const k = CATS[p.cat] || {e:'📍'}, h = poiText(p, 'horario'), x = poiText(p, 'extra'), c = colon();
  return [`${k.e} ${p.name}`, '', `* ${t('lTipo')}${c} ${poiText(p, 'tipo')}`, h ? `* ${t('lHorario')}${c} ${h}` : '', x ? `* ${t('lExtra')}${c} ${x}` : '', p.tel ? `* ${t('call')}${c} ${p.tel}` : '',
    p.cat === 'farmacia' && p.guardia_url ? `* ${t('guardiaBtn')}${c} ${p.guardia_url}` : '', `* ${t('lConsejo')}${c} ${poiText(p, 'consejo')}`].filter((l, i) => l || i === 1).join('\n');
}
function renderFilters(){
  const base = withDist().filter(inScope);
  $('xScope').setAttribute('aria-label', t('hExplora'));
  $('xScope').querySelectorAll('button').forEach(b => { b.innerHTML = b.dataset.scope === 'near' ? `${esc(t('near'))}<small>${esc(town().n)} · ${NEAR_KM} km</small>` : `${esc(t('allc'))}<small>Blanes → Alella</small>`; b.setAttribute('aria-pressed', String(st.scope === b.dataset.scope)); });
  $('xFilters').setAttribute('aria-label', t('hExplora'));
  $('xFilters').innerHTML = FILTERS.map(f => { const n = f.k === 'all' ? base.length : base.filter(p => CATS[p.cat] && CATS[p.cat].f === f.k).length;
    return `<button type="button" class="x-chip${f.k === 'urg' ? ' urg' : ''}" data-f="${f.k}" aria-pressed="${st.filter === f.k}" style="--c:${f.c}"${!n && f.k !== st.filter ? ' disabled' : ''}><span class="ic">${svg(f.i)}</span>${esc(t('f_' + f.k))} <span class="cnt">${n}</span></button>`; }).join('');
}
function renderList(){
  const v = visiblePois();
  if (!POIS.length) { $('xCount').textContent = t('noData'); $('xList').innerHTML = ''; return v; }
  $('xCount').textContent = (v.length === 1 ? t('n1') : t('n', {n:v.length})) + ' · ' + t('byDist');
  const shown = v.slice(0, st.limit);
  $('xList').innerHTML = shown.map(p => `<li>${poiCard(p)}</li>`).join('')
    + (v.length > st.limit ? `<li class="x-more"><button type="button" class="btn" data-more="1">${esc(t('more', {n:Math.min(12, v.length - st.limit)}))}</button></li>` : '')
    + (!v.length ? `<li class="empty">${svg('compass')}<p>${esc(t('none'))}</p>${st.scope === 'near' ? `<button type="button" class="btn sm" data-scope-all="1">${esc(t('seeAll'))}</button>` : ''}</li>` : '');
  return v;
}
let xmap = null, Lfx = null, markers = {}, homeMk = null, layer = null;
function drawMarkers(v, fit){
  if (!xmap) return;
  if (!layer) layer = Lfx.markerClusterGroup ? Lfx.markerClusterGroup({showCoverageOnHover:false, maxClusterRadius:38, spiderfyOnMaxZoom:true, disableClusteringAtZoom:16,
      iconCreateFunction:c => Lfx.divIcon({className:'mkc', html:`<span>${c.getChildCount()}</span>`, iconSize:[40, 40], iconAnchor:[20, 20]})}).addTo(xmap) : Lfx.layerGroup().addTo(xmap);
  layer.clearLayers(); markers = {};
  const pts = [], list = [];
  v.filter(hasLoc).forEach(p => {
    const k = CATS[p.cat] || {c:'#3E4A57', i:'pin'};
    const m = Lfx.marker([p.lat, p.lng], {title:p.name, alt:p.name, keyboard:true, riseOnHover:true,
      icon:Lfx.divIcon({className:'mk' + (st.active === p.id ? ' on' : ''), html:`<span style="--c:${k.c}">${svg(k.i)}</span>`, iconSize:[34, 34], iconAnchor:[17, 17]})});
    m.on('click', () => openSheet(p.id, false)); markers[p.id] = m; pts.push([p.lat, p.lng]); list.push(m);
  });
  if (layer.addLayers) layer.addLayers(list); else list.forEach(m => layer.addLayer(m));
  const h = home();
  if (homeMk) homeMk.setLatLng([h.lat, h.lng]); else homeMk = Lfx.marker([h.lat, h.lng], {icon:homeIcon(Lfx), title:t('home'), zIndexOffset:1000}).addTo(xmap);
  homeMk.bindTooltip(t('home'));
  if (fit) { pts.push([h.lat, h.lng]); if (pts.length > 1) xmap.fitBounds(pts, {padding:[36, 36], maxZoom:15}); else xmap.setView([h.lat, h.lng], 14); }
}
function setActive(id){
  st.active = id;
  Object.entries(markers).forEach(([k, m]) => { const el = m.getElement(); if (el) el.classList.toggle('on', k === id); if (k === id) m.setZIndexOffset(800); else m.setZIndexOffset(0); });
  document.querySelectorAll('.x-list .poi').forEach(el => el.classList.toggle('on', el.id === 'poi-' + id));
}
function openSheet(id, scrollMap){
  const p = withDist().find(x => x.id === id); if (!p) return;
  setActive(id);
  const sh = $('sheet');
  sh.innerHTML = `<button type="button" class="sheet-x" data-close="1" aria-label="${esc(t('close'))}">×</button>` + poiCard(p, true);
  sh.classList.add('on'); sh.setAttribute('aria-label', p.name);
  focusOn(p);
  if (scrollMap) $('xMapBox').scrollIntoView({behavior:reduced() ? 'auto' : 'smooth', block:'start'});
}
/* Centra el pin en la parte visible del mapa (encima de la ficha). Zoom 16: a ese nivel los pines ya no se agrupan.
   Si el mapa aún no ha cargado, initExplore lo hace al terminar. */
function focusOn(p){
  if (!xmap || !hasLoc(p)) return;
  const sh = $('sheet'), z = Math.max(xmap.getZoom(), 16), h = xmap.getSize().y, free = Math.max(60, h - sh.offsetHeight - 8);
  const pt = xmap.project([p.lat, p.lng], z).add([0, h / 2 - free / 2]);
  xmap.once('moveend', () => setActive(p.id));
  xmap.setView(xmap.unproject(pt, z), z, {animate:false});
}
function closeSheet(){ $('sheet').classList.remove('on'); setActive(null); }
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function renderExplore(fit){
  renderFilters();
  const v = renderList();
  $('xFit').innerHTML = svg('fit') + esc(t('fit')); $('xMap').setAttribute('aria-label', t('hExplora'));
  $('xKml').innerHTML = svg('download') + esc(t('kml')); $('xCopyAll').innerHTML = svg('copy') + esc(t('copyAll'));
  $('xKml').disabled = $('xCopyAll').disabled = !v.length;
  $('xChecked').textContent = t('checked', {d:fmtDate(CHECKED)});
  if (!xmap && !$('xMapMsg').dataset.started) $('xMapMsg').textContent = t('xLoad');
  drawMarkers(v, fit !== false);
  if ($('sheet').classList.contains('on')) { const id = st.active; if (v.some(p => p.id === id)) openSheet(id, false); else closeSheet(); }
}
function initExplore(){
  $('xMapMsg').dataset.started = '1'; $('xMapMsg').textContent = t('xLoad');
  loadLeaflet().then(Lf => {
    Lfx = Lf; xmap = newMap(Lf, $('xMap'));
    baseLayer(Lf, xmap, () => { $('xMapMsg').textContent = t('xErr'); });
    $('xMapMsg').textContent = '';
    xmap.on('click', closeSheet);
    drawMarkers(visiblePois(), true);
    if (st.active && $('sheet').classList.contains('on')) { const p = POIS.find(x => x.id === st.active); if (p) focusOn(p); }
    if ('ResizeObserver' in window) new ResizeObserver(() => xmap.invalidateSize({animate:false})).observe($('xMapBox'));
  }).catch(() => { $('xMapMsg').textContent = t('xErr'); });
}

/* ==================================================================== COPIAR Y EXPORTAR */
let toastT = null;
function toast(msg){ $('toast').textContent = msg; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 2200); }
function copyText(txt, ok){
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let done = false; try { done = document.execCommand('copy'); } catch(e) {} ta.remove(); toast(done ? ok : t('copyFail')); };
  try { navigator.clipboard.writeText(txt).then(() => toast(ok), fallback); } catch(e) { fallback(); }
}
function kml(){
  const v = visiblePois(), x = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const groups = {}; v.forEach(p => (groups[p.cat] = groups[p.cat] || []).push(p));
  const body = Object.entries(groups).map(([c, list]) => `<Folder><name>${x(t('c_' + c))}</name>${list.map(p => {
    const loc = hasLoc(p) ? `<Point><coordinates>${p.lng},${p.lat},0</coordinates></Point>` : '';
    return `<Placemark><name>${x(p.name)}</name><description><![CDATA[${insiderText(p).replace(/\n/g, '<br>')}]]></description>${p.address ? `<address>${x(p.address + ', ' + p.town)}</address>` : ''}${loc}</Placemark>`; }).join('')}</Folder>`).join('');
  const doc = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${x(t('hExplora') + ' · ' + (st.scope === 'near' ? town().n : 'Maresme'))}</name>${body}</Document></kml>`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([doc], {type:'application/vnd.google-earth.kml+xml'}));
  a.download = 'explora-costa-' + (st.scope === 'near' ? st.stay.town : 'maresme') + '-' + st.lang + '.kml'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

/* ==================================================================== NAVEGACIÓN ACTIVA */
let navIO = null;
function activeNav(){
  const links = [...document.querySelectorAll('#gnavIn a')];
  if (navIO) navIO.disconnect();
  if (!('IntersectionObserver' in window)) return;
  navIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => { const on = a.getAttribute('href') === '#' + e.target.id; a.classList.toggle('on', on); if (on) a.scrollIntoView({block:'nearest', inline:'nearest'}); }); }), {rootMargin:'-35% 0px -60% 0px'});
  links.forEach(a => { const s = document.getElementById(a.getAttribute('href').slice(1)); if (s) navIO.observe(s); });
}

/* ==================================================================== EVENTOS */
function renderAll(){ renderShell(); renderArrival(); renderCheckin(); renderRoute(); renderExplore(); }
document.addEventListener('change', e => {
  const x = e.target;
  if (x.name === 'airport' || x.name === 'mode') {
    const first = !st[x.name]; st[x.name] = x.value; renderArrival();
    if (first && window.innerWidth < 980) { const go = $(x.name === 'airport' && !st.mode ? 'stB' : 'stC'); go.scrollIntoView({behavior:reduced() ? 'auto' : 'smooth', block:'start'}); }
    document.getElementById(x.name + '-' + x.value)?.focus({preventScroll:true});
  }
  if (x.id === 'demoStay') { st.stay = STAYS.find(s => s.id === x.value) || STAYS[0]; st.limit = 12; save(); closeSheet(); renderAll(); }
});
document.addEventListener('click', e => {
  const q = s => e.target.closest(s);
  let el;
  if ((el = q('#langs button'))) { st.lang = el.dataset.l; save(); renderAll(); return; }
  if (q('#reset')) { st.airport = null; st.mode = null; renderArrival(); $('stA').scrollIntoView({block:'start'}); return; }
  if ((el = q('[data-filter]'))) { st.filter = el.dataset.filter; st.limit = 12; closeSheet(); renderExplore(); return; }
  if ((el = q('[data-f]'))) { st.filter = el.dataset.f; st.limit = 12; closeSheet(); renderExplore(); el = document.querySelector(`[data-f="${st.filter}"]`); if (el) { el.focus({preventScroll:true}); el.scrollIntoView({block:'nearest', inline:'center'}); } return; }
  if ((el = q('[data-scope]'))) { st.scope = el.dataset.scope; st.limit = 12; closeSheet(); renderExplore(); return; }
  if (q('[data-scope-all]')) { st.scope = 'all'; renderExplore(); return; }
  if (q('[data-more]')) { st.limit += 12; renderList(); return; }
  if ((el = q('[data-show]'))) { openSheet(el.dataset.show, true); return; }
  if (q('[data-close]')) { closeSheet(); return; }
  if ((el = q('[data-copy]'))) { const p = POIS.find(x => x.id === el.dataset.copy); if (p) copyText(insiderText(p), t('copied')); return; }
  if (q('#xCopyAll')) { copyText(visiblePois().map(insiderText).join('\n\n———\n\n'), t('copiedAll')); return; }
  if (q('#xKml')) { kml(); return; }
  if (q('#xFit')) { closeSheet(); drawMarkers(visiblePois(), true); return; }
  if (q('#pkOpen')) { const f = document.createElement('iframe'); f.src = 'parkings-maresme.html'; f.title = t('pkT'); f.setAttribute('referrerpolicy', 'no-referrer'); $('pkPh').replaceWith(f); f.focus(); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('sheet').classList.contains('on')) closeSheet(); });

renderAll();
whenNear($('miniMap'), initMini);
whenNear($('xMapBox'), initExplore);
})();
</script>
