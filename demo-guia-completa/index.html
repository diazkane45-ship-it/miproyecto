<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía para huéspedes · demo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12324A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Demo aislada · guía privada completa (llegada → check-in → ruta → parkings → explora la costa → contacto).
   Tokens y componentes copiados de la guía real (sitio/guia.php) y de la demo «Cómo llegar», sin tocarlas.
   Mobile-first: una columna; a partir de 980 px la sección «Explora» pone lista y mapa lado a lado. */
:root{
  --bg:#FFFDF9; --surface:#FFFFFF; --sand:#F1E8DA; --sand-2:#E6DACA; --line:#E6DED2;
  --ink:#172530; --ink-2:#55616A; --navy:#12324A; --on-navy:#FFFFFF;
  --accent:#0D7377; --accent-hover:#0A5D60; --on-accent:#FFFFFF; --accent-soft:#DDEFEE;
  --danger:#A8231B; --danger-soft:#FBE7E5;
  --demo:#8A4F0E; --demo-soft:#FBEBD2; --demo-line:#D9A867;
  --warn:#8A4F0E; --warn-soft:#FBEBD2;
  --taxi:#F5C400; --taxi-ink:#1F1A00;
  --shadow:0 1px 2px rgba(18,50,74,.06),0 8px 24px rgba(18,50,74,.08);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A22; --surface:#15232D; --sand:#1C2C37; --sand-2:#253846; --line:#2A3C49;
  --ink:#ECE6DC; --ink-2:#AEB8C0; --navy:#E9E1D3; --on-navy:#0F1A22;
  --accent:#4FBDB6; --accent-hover:#76CFC9; --on-accent:#04201F; --accent-soft:#163A3B;
  --danger:#F09A92; --danger-soft:#3A1B19;
  --demo:#EBB872; --demo-soft:#2E2414; --demo-line:#7A5A2A;
  --warn:#EBB872; --warn-soft:#2E2414;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1.0625rem;line-height:1.5;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--navy);margin:0;line-height:1.12;letter-spacing:-.012em;font-weight:650;text-wrap:balance}
h2{font-size:clamp(1.5rem,5vw,2.1rem)}h3{font-size:1.2rem}h4{font-size:1.1rem}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{width:1.2em;height:1.2em;flex:none}
button{font:inherit}
.g-in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:.92rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}html{scroll-behavior:auto}}

/* ---- banda de demo (fuera de la guía) */
.demo-bar{background:var(--demo-soft);border-bottom:1px solid var(--demo-line);color:var(--demo);font-size:.9rem}
.demo-bar .g-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:8px}
.demo-bar b{letter-spacing:.06em;text-transform:uppercase;font-size:.78rem}
.demo-bar label{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-weight:600;flex:1 1 300px;min-width:0;max-width:560px}
.demo-bar select{flex:1 1 200px;min-width:0;width:100%;font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--demo-line);border-radius:10px;padding:6px 10px;min-height:40px}
.demo-bar .note{flex:1 1 240px;min-width:0}

/* ---- portada */
.g-hero{position:relative;min-height:min(64vw,400px);display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden;background:linear-gradient(135deg,#12324A 0%,#0D7377 100%)}
.g-hero::before{content:"";position:absolute;inset:auto -10% -40% -10%;height:70%;background:radial-gradient(60% 60% at 50% 100%,rgba(255,255,255,.16),transparent 70%)}
.g-hero-top,.g-hero-txt{position:relative;z-index:1;max-width:980px;width:100%;margin:0 auto;padding:14px 16px}
.g-hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.g-brand{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-family:var(--font-display);font-weight:700;font-size:.88rem;background:rgba(255,255,255,.94);color:#12324A;padding:6px 12px 6px 8px;border-radius:999px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.g-brand svg{width:26px;height:26px}
.g-langs{display:flex;gap:2px;background:rgba(255,255,255,.94);padding:3px;border-radius:999px;flex:none}
.g-langs button{min-width:38px;min-height:36px;border:0;border-radius:999px;background:transparent;color:#12324A;font-weight:700;font-size:.85rem;cursor:pointer}
.g-langs button[aria-pressed="true"]{background:#12324A;color:#fff}
.g-hero-txt{padding-bottom:22px}
.g-eyebrow{margin:0 0 6px;font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#CFEDEB}
.g-welcome{margin:0 0 2px;font-size:1rem;opacity:.9}
.g-hero h1{color:#fff;font-size:clamp(1.7rem,6vw,2.6rem);text-shadow:0 1px 12px rgba(0,0,0,.25)}

/* ---- accesos rápidos */
.g-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:16px}
@media (min-width:620px){.g-tiles{grid-template-columns:repeat(3,1fr)}}
.g-tile{display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--navy);font-weight:650;text-decoration:none;font-family:var(--font-display);line-height:1.15}
.g-tile svg{width:1.5em;height:1.5em;color:var(--accent)}
.g-tile .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sand);color:var(--ink-2);font:700 .78rem var(--font-body);margin-left:auto;flex:none}
.g-tile-sos{background:var(--danger-soft);border-color:var(--danger-soft);color:var(--danger)}.g-tile-sos svg{color:var(--danger)}
.g-quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:12px;padding-bottom:4px}
.g-quick::-webkit-scrollbar{display:none}
.g-chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--navy);font-weight:700;text-decoration:none}

/* ---- navegación por apartados */
.g-nav{position:sticky;top:0;z-index:900;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:10px}
.g-nav .g-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.g-nav .g-in::-webkit-scrollbar{display:none}
.g-nav a{flex:none;display:inline-flex;align-items:center;gap:6px;padding:14px 10px 12px;font-weight:700;font-size:.95rem;color:var(--ink-2);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px}
.g-nav a .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sand);font-size:.75rem}
.g-nav a.on{color:var(--accent);border-color:var(--accent)}
.g-nav a.on .n{background:var(--accent);color:var(--on-accent)}

/* ---- cuerpo y piezas comunes */
.g-body{display:grid;gap:40px;padding-top:24px;padding-bottom:56px}
.g-sec{display:grid;gap:14px;scroll-margin-top:62px;min-width:0}
.g-sec-h{display:grid;gap:6px}
.g-sec-h .step{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.g-sec-h p{color:var(--ink-2);max-width:62ch}
.g-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;box-shadow:0 1px 2px rgba(18,50,74,.04);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--navy);font-weight:700;text-decoration:none;cursor:pointer;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--navy)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.sm{min-height:42px;padding:8px 13px;font-size:.95rem}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.test{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--demo);background:var(--demo-soft);border:1px solid var(--demo-line);border-radius:999px;padding:1px 8px;vertical-align:2px;white-space:nowrap}
.warn{background:var(--warn-soft);border:1px solid var(--demo-line);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:.96rem;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.warn svg{width:20px;height:20px;color:var(--warn);margin-top:2px}

/* ---- 1 · llegada (de la demo «Cómo llegar») */
.steps{display:grid;gap:22px}
.stp{display:grid;gap:10px;scroll-margin-top:70px}
.stp-h{display:flex;align-items:baseline;gap:10px}
.stp-n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sand);color:var(--navy);font-weight:700;font-size:.9rem;flex:none}
.stp.done .stp-n{background:var(--accent);color:var(--on-accent)}
.stp-h h3{font-size:1.15rem}
.cards{display:grid;gap:10px}
@media (min-width:620px){.cards{grid-template-columns:1fr 1fr}}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;min-height:84px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.opt input:focus-visible + label{outline:3px solid var(--accent);outline-offset:2px}
.opt input:checked + label{border-color:var(--accent);box-shadow:var(--shadow);background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.opt input:disabled + label{opacity:.5;cursor:not-allowed}
.opt .ico{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--sand);color:var(--navy)}
.opt input:checked + label .ico{background:var(--accent);color:var(--on-accent)}
.opt .ico svg{width:26px;height:26px}
.opt .t{display:grid;gap:2px;min-width:0}
.opt .t b{font-family:var(--font-display);font-weight:650;font-size:1.1rem;color:var(--navy)}
.opt .t small{color:var(--ink-2);font-size:.93rem}
.opt .code{font-family:var(--font-display);font-weight:750;letter-spacing:.06em;color:var(--ink-2)}
.opt .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.opt input:checked + label .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt .tick svg{width:15px;height:15px}
.locked{font-size:.95rem;color:var(--ink-2);background:var(--sand);border-radius:12px;padding:10px 14px}
.panel{display:grid;gap:12px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:22px 18px;text-align:center;color:var(--ink-2);display:grid;gap:6px;justify-items:center}
.empty svg{width:36px;height:36px;color:var(--sand-2)}
.prov{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.prov-h{display:flex;align-items:flex-start;gap:12px}
.prov-h .ico{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);flex:none}
.prov-h .ico svg{width:24px;height:24px}
.prov-h .ico.taxi{background:var(--taxi);color:var(--taxi-ink)}
.prov-h div{display:grid;gap:2px;min-width:0}
.prov-h h4{font-size:1.15rem}
.prov-h small{color:var(--ink-2);font-size:.92rem}
.prov ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.facts{display:grid;gap:8px}
.fact{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.98rem}
.fact svg{width:20px;height:20px;color:var(--accent);margin-top:2px}
.fact .src{display:block;color:var(--ink-2);font-size:.85rem}
.tel{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy)}
.check{background:var(--sand);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.check b{font-size:.92rem;color:var(--navy)}
.pillrow{display:flex;flex-wrap:wrap;gap:8px}
.app{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--navy);font-weight:700;text-decoration:none}
.app svg{width:16px;height:16px;color:var(--ink-2)}
.swatch{display:inline-flex;vertical-align:-3px;margin-right:6px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.swatch i{display:block;width:14px;height:16px}.swatch i:first-child{background:#111}.swatch i:last-child{background:var(--taxi)}
.group-h{display:grid;gap:4px;margin-top:6px}
.badge{justify-self:start;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--sand);border-radius:999px;padding:3px 10px}
.contact{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.contact-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 10px}
.contact-h b{font-family:var(--font-display);font-weight:650;font-size:1.08rem;color:var(--navy)}
.contact-h small{color:var(--ink-2)}
.trans{font-size:.92rem;color:var(--ink-2);border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:auto 1fr;gap:10px;margin:0}
.trans svg{width:18px;height:18px;margin-top:2px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;justify-self:start}

/* ---- 2 · check-in */
.ci{display:grid;gap:0;padding:0;overflow:hidden}
.ci-times{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.ci-times div{padding:16px 18px;display:grid;gap:2px}
.ci-times div+div{border-left:1px solid var(--line)}
.ci-times .lbl{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.ci-times b{font-family:var(--font-display);font-size:1.45rem;color:var(--navy);font-weight:650;font-variant-numeric:tabular-nums}
.ci-list{list-style:none;margin:0;padding:6px 18px 4px;display:grid}
.ci-list li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci-list li:last-child{border-bottom:0}
.ci-list .ico{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.ci-list .ico svg{width:22px;height:22px}
.ci-list b{display:block;color:var(--navy);font-family:var(--font-display);font-weight:650;font-size:1.05rem}
.ci-foot{padding:4px 18px 18px;display:grid;gap:8px}

/* ---- 3 · ruta hasta la vivienda */
.route{padding:0;overflow:hidden;gap:0}
.minimap{height:240px;background:var(--sand);position:relative}
.minimap .msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);font-size:.95rem;padding:16px;text-align:center}
.route-body{padding:16px 18px 18px;display:grid;gap:12px}
.navgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.navgrid .btn{min-height:52px;padding:8px 6px;font-size:.95rem;flex-direction:column;gap:2px}
.navgrid .btn svg{width:22px;height:22px}
.navgrid .btn.pri{grid-column:1/-1;flex-direction:row;font-size:1.02rem}
.laststeps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.laststeps li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.laststeps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--on-navy);font-weight:700;font-size:.9rem}
.laststeps .ph{grid-column:2;display:grid;place-items:center;height:96px;border-radius:12px;background:repeating-linear-gradient(135deg,var(--sand) 0 10px,var(--sand-2) 10px 20px);color:var(--ink-2);font-size:.88rem;font-weight:600}

/* ---- 4 · parkings */
.pk{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--sand)}
.pk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.pk-h small{display:block;color:var(--ink-2);font-size:.9rem}
.pk-ph{display:grid;place-items:center;padding:28px 12px}
.pk iframe{display:block;width:100%;height:min(78vh,620px);border:0;background:#e8edf2}

/* ---- 5 · explora la costa */
.x-top{display:grid;gap:10px}
.x-scope{display:grid;grid-template-columns:1fr 1fr;background:var(--sand);border-radius:14px;padding:4px;gap:4px}
.x-scope button{min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--ink-2);font-weight:700;cursor:pointer;padding:6px 8px;line-height:1.15}
.x-scope button small{display:block;font-weight:600;font-size:.8rem;opacity:.8;margin-top:1px}
.x-scope button[aria-pressed="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(18,50,74,.15)}
.x-filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 6px;margin:0 -16px;scroll-snap-type:x proximity}
.x-filters::-webkit-scrollbar{display:none}
@media (min-width:980px){.x-filters{flex-wrap:wrap;overflow:visible;margin:0;padding:0}}
.x-chip{flex:none;scroll-snap-align:start;display:inline-flex;align-items:center;gap:7px;min-height:46px;padding:6px 14px 6px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:700;font-size:.95rem;cursor:pointer;white-space:nowrap}
.x-chip .ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c,var(--navy));color:#fff}
.x-chip .ic svg{width:17px;height:17px}
.x-chip .cnt{font-weight:600;color:var(--ink-2);font-size:.85rem}
.x-chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.x-chip[aria-pressed="true"] .cnt{color:inherit;opacity:.8}
.x-chip:disabled{opacity:.45;cursor:default}
.x-chip.urg:not([aria-pressed="true"]){border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.x-count{font-size:.95rem;color:var(--ink-2)}
.x-grid{display:grid;gap:14px}
@media (min-width:980px){.x-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}.x-mapcol{position:sticky;top:64px;order:2}}
.x-mapbox{scroll-margin-top:60px;position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--sand);height:min(56vh,460px);min-height:300px}
@media (min-width:980px){.x-mapbox{height:calc(100vh - 90px);max-height:720px}}
.x-map{position:absolute;inset:0}
.x-mapmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);padding:16px;text-align:center;z-index:400}
.x-mapmsg:empty{display:none}
.x-fit{position:absolute;right:10px;top:10px;z-index:600;min-height:44px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--navy);font-weight:700;cursor:pointer;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px}
.x-fit svg{width:18px;height:18px}

tínez et Gómez). Celle de garde n'ouvre que le samedi après-midi et le dimanche ou jour férié le matin. En dehors de ces heures, cherchez sur Farmaguia la pharmacie ouverte la plus proche ; la mairie renvoie aussi aux pharmacies de garde d'El Masnou.","extra":""},"sources":["https://alella.cat/document.php?id=5062","https://www.cofb.org/ca/que-oferim/ciutadans/farmacies-obertes/","https://www.openstreetmap.org/node/6327748337"]},{"id":"sant-cebria-de-vallalta-super-tarde-sorli","town":"Sant Cebrià de Vallalta","cat":"super_tarde","name":"Supermercats Sorli Sant Cebrià de Vallalta","lat":41.618598,"lng":2.604894,"address":"Carrer del Baix Montseny, 1, 08396 Sant Cebrià de Vallalta","tel":"937 631 771","web":"https://www.sorli.com/ca/stores/sant-cebria-vallalta/","guardia_url":"","season":"Todo el año","es":{"tipo":"Supermercado / compra grande.","horario":"Lunes a sábado de 09:00 a 21:00, sin cierre a mediodía. Domingo: Sorli no indica apertura.","consejo":"Tiene aparcamiento para clientes. Va bien para la compra del primer día.","extra":""},"en":{"tipo":"Supermarket / big shop.","horario":"Monday to Saturday 09:00–21:00, no lunchtime closing. Sunday: Sorli lists no opening hours.","consejo":"It has a customer car park. Handy for your first-day shop.","extra":""},"fr":{"tipo":"Supermarché / grosses courses.","horario":"Du lundi au samedi de 09:00 à 21:00, sans fermeture à midi. Dimanche : Sorli n'indique pas d'ouverture.","consejo":"Parking réservé aux clients. Pratique pour les courses du premier jour.","extra":""},"sources":["https://www.sorli.com/ca/wp-json/wp/v2/stores?search=Cebri","https://www.openstreetmap.org/node/9951349354"]},{"id":"alella-super-tarde-sorli","town":"Alella","cat":"super_tarde","name":"Supermercats Sorli Alella","lat":41.490732,"lng":2.295558,"address":"Carrer de la Riera Principal, 16, 08328 Alella","tel":"935 610 604","web":"https://www.sorli.com/ca/stores/alella/","guardia_url":"","season":"Todo el año","es":{"tipo":"Supermercado / compra grande.","horario":"Lunes a sábado de 09:00 a 21:00. Domingo de 10:00 a 14:00.","consejo":"También abre el domingo por la mañana. Tiene aparcamiento para clientes. Está en la Riera Principal, en la parte baja del pueblo.","extra":""},"en":{"tipo":"Supermarket / big shop.","horario":"Monday to Saturday 09:00–21:00. Sunday 10:00–14:00.","consejo":"It also opens on Sunday mornings. It has a customer car park. It is on Riera Principal, in the lower part of the village.","extra":""},"fr":{"tipo":"Supermarché / grosses courses.","horario":"Du lundi au samedi de 09:00 à 21:00. Dimanche de 10:00 à 14:00.","consejo":"Ouvert aussi le dimanche matin. Parking réservé aux clients. Il se trouve sur la Riera Principal, dans la partie basse du village.","extra":""},"sources":["https://www.sorli.com/ca/wp-json/wp/v2/stores?search=Alella","https://www.openstreetmap.org/node/5703756121"]},{"id":"alella-gasolinera-24h-autonetoil","town":"Alella","cat":"gasolinera_24h","name":"Autonetoil Alella","lat":41.488193,"lng":2.297781,"address":"Carrer Riera, 48, 08328 Alella","tel":"","web":"https://geoportalgasolineras.es","guardia_url":"","season":"Todo el año","es":{"tipo":"Gasolinera abierta 24 h.","horario":"Abierta 24 h todos los días (dato del Ministerio para la Transición Ecológica, consultado el 24/11/2026).","consejo":"Está en la parte baja del pueblo, en el carrer Riera, 48. Consulta el precio del día en el Geoportal de Gasolineras antes de ir.","extra":""},"en":{"tipo":"24-hour petrol station.","horario":"Open 24 hours, every day (Spanish Ministry for the Ecological Transition data, checked on 24/11/2026).","consejo":"It is in the lower part of the village, at Carrer Riera, 48. Check today's prices on the Geoportal de Gasolineras before you go.","extra":""},"fr":{"tipo":"Station-service ouverte 24 h/24.","horario":"Ouverte 24 h/24, tous les jours (données du ministère espagnol de la Transition écologique, consultées le 24/11/2026).","consejo":"Elle se trouve dans la partie basse du village, Carrer Riera, 48. Vérifiez le prix du jour sur le Geoportal de Gasolineras avant d'y aller.","extra":""},"sources":["https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroMunicipio/864","https://geoportalgasolineras.es","https://www.openstreetmap.org/way/1026100794"]},{"id":"alella-gasolinera-24h-bp-alella","town":"Alella","cat":"gasolinera_24h","name":"BP Alella","lat":41.484172,"lng":2.302926,"address":"Carretera d'Alella (BP-5002), km 1, 08328 Alella","tel":"","web":"https://geoportalgasolineras.es","guardia_url":"","season":"Todo el año","es":{"tipo":"Gasolinera abierta 24 h.","horario":"Abierta 24 h todos los días (dato del Ministerio para la Transición Ecológica, consultado el 24/11/2026).","consejo":"Está en la carretera d'Alella (BP-5002, km 1), en la parte baja del pueblo, hacia El Masnou. Es la alternativa si en la del carrer Riera hay cola.","extra":""},"en":{"tipo":"24-hour petrol station.","horario":"Open 24 hours, every day (Spanish Ministry for the Ecological Transition data, checked on 24/11/2026).","consejo":"It is on the Alella road (BP-5002, km 1), at the lower end of the village towards El Masnou. A good alternative if there is a queue at the one on Carrer Riera.","extra":""},"fr":{"tipo":"Station-service ouverte 24 h/24.","horario":"Ouverte 24 h/24, tous les jours (données du ministère espagnol de la Transition écologique, consultées le 24/11/2026).","consejo":"Elle se trouve sur la route d'Alella (BP-5002, km 1), en bas du village, vers El Masnou. C'est l'alternative s'il y a la queue à celle du Carrer Riera.","extra":""},"sources":["https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroMunicipio/864","https://geoportalgasolineras.es","https://www.openstreetmap.org/way/971547040"]},{"id":"alella-mercadillo-mercat-municipal","town":"Alella","cat":"mercadillo","name":"Mercat Municipal d'Alella","lat":41.493468,"lng":2.294941,"address":"Plaça de l'Ajuntament, s/n, 08328 Alella","tel":"","web":"https://alella.cat/document.php?id=330","guardia_url":"","season":"Todo el año","es":{"tipo":"Mercado municipal cubierto: producto fresco y barra gastronómica.","horario":"Lunes a sábado de 08:00 a 14:00. Martes y viernes también de 17:00 a 20:00. Domingo de 10:00 a 14:00.","consejo":"Dentro está La DO Tastets d'Alella, una barra gastronómica para picar algo mientras haces la compra. Aparcamiento en zona azul.","extra":"La fiesta más conocida del pueblo es la Festa de la Verema (fiesta de la vendimia), con la Mostra de Vins DO Alella. Fechas en alella.cat/festaverema."},"en":{"tipo":"Covered municipal market: fresh produce and a food counter.","horario":"Monday to Saturday 08:00–14:00. Tuesday and Friday also 17:00–20:00. Sunday 10:00–14:00.","consejo":"Inside you'll find La DO Tastets d'Alella, a food counter for a bite to eat while you shop. Parking in the blue (pay-and-display) zone.","extra":"The village's best-known festival is the Festa de la Verema (grape-harvest festival), with the Mostra de Vins DO Alella wine fair. Dates at alella.cat/festaverema."},"fr":{"tipo":"Marché municipal couvert : produits frais et comptoir gourmand.","horario":"Du lundi au samedi de 08:00 à 14:00. Mardi et vendredi aussi de 17:00 à 20:00. Dimanche de 10:00 à 14:00.","consejo":"À l'intérieur, La DO Tastets d'Alella, un comptoir gourmand pour grignoter quelque chose pendant vos courses. Stationnement en zone bleue (payante).","extra":"La fête la plus connue du village est la Festa de la Verema (fête des vendanges), avec la Mostra de Vins DO Alella. Dates sur alella.cat/festaverema."},"sources":["https://alella.cat/document.php?id=330","https://alella.cat/gastronomia","https://alella.cat/festaverema"]},{"id":"sant-cebria-de-vallalta-bar-casikeno","town":"Sant Cebrià de Vallalta","cat":"bar","name":"CasiKeNo","lat":41.619764,"lng":2.602696,"address":"Carrer de l'Esplanada, 2, 08396 Sant Cebrià de Vallalta","tel":"937 63 26 36","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Bar-cafetería de tapas, ambiente familiar.","horario":"No publicado. Abre desde la hora del desayuno; confirma por teléfono (937 63 26 36).","consejo":"En pleno centro, junto a la Plaça d'Ernest Lluch. Para un desayuno, un vermut, tapas o un bocadillo sin prisas; las reseñas destacan el trato familiar y las raciones generosas. Va bien con niños.","extra":""},"en":{"tipo":"Café-bar serving tapas, family atmosphere.","horario":"Not published. Opens from breakfast time; ring to check (937 63 26 36).","consejo":"Right in the centre, next to Plaça d'Ernest Lluch. Good for breakfast, a vermouth, tapas or a sandwich at a relaxed pace; reviews praise the friendly, family-run service and generous portions. Child-friendly.","extra":""},"fr":{"tipo":"Bar-cafétéria à tapas, ambiance familiale.","horario":"Non publiés. Ouvert dès l'heure du petit-déjeuner ; appelez pour confirmer (937 63 26 36).","consejo":"En plein centre, à côté de la Plaça d'Ernest Lluch. Idéal pour un petit-déjeuner, un vermouth, des tapas ou un sandwich sans se presser ; les avis saluent l'accueil familial et les portions généreuses. Adapté aux enfants.","extra":""},"sources":["https://gastroranking.es/r/casikeno_185495/","https://www.stcebria.cat/turisme/on-menjar","https://www.openstreetmap.org/node/9951349398"]},{"id":"sant-cebria-de-vallalta-bar-can-martri","town":"Sant Cebrià de Vallalta","cat":"bar","name":"Can Martri (bar y asador)","lat":41.62,"lng":2.601208,"address":"Carrer del Centre, 3, 08396 Sant Cebrià de Vallalta","tel":"937 631 115","web":"https://www.canmartri.com/","guardia_url":"","season":"Todo el año","es":{"tipo":"Bar-restaurante familiar: desayunos, tapas y vermut.","horario":"No publicado en su web: llama antes (937 631 115).","consejo":"Negocio familiar desde 1872, ya en la cuarta generación: bar, asador de pollos a la leña, comida para llevar y tienda con embutido de elaboración propia. Por la noche el bar tiene una carta hecha con el food truck Pebre Negre; pregunta qué días. Reserva el fin de semana.","extra":""},"en":{"tipo":"Family-run bar-restaurant: breakfasts, tapas and vermouth.","horario":"Not published on its website: ring ahead (937 631 115).","consejo":"A family business since 1872, now in its fourth generation: bar, wood-fired chicken rotisserie, takeaway food and a shop selling its own cured meats. In the evenings the bar has a menu made with the Pebre Negre food truck; ask which days. Book at weekends.","extra":""},"fr":{"tipo":"Bar-restaurant familial : petits-déjeuners, tapas et vermouth.","horario":"Non publiés sur son site : appelez avant (937 631 115).","consejo":"Entreprise familiale depuis 1872, aujourd'hui à la quatrième génération : bar, rôtisserie de poulets au feu de bois, plats à emporter et boutique de charcuterie maison. Le soir, le bar propose une carte élaborée avec le food truck Pebre Negre ; demandez quels jours. Réservez le week-end.","extra":""},"sources":["https://www.canmartri.com/","https://gastroranking.es/r/can-martri_6003/","https://www.stcebria.cat/turisme/on-menjar"]},{"id":"alella-bar-celler-jordana","town":"Alella","cat":"bar","name":"Celler Jordana","lat":41.4946,"lng":2.29572,"address":"Rambla d'Àngel Guimerà, 60, 08328 Alella","tel":"931 806 678","web":"https://www.cellerjordana.com","guardia_url":"","season":"Todo el año","es":{"tipo":"Wine bar y tienda gourmet.","horario":"Lunes y martes de 18:00 a 23:00. Miércoles y jueves de 10:00 a 14:00 y de 18:00 a 23:00. Viernes de 10:00 a 14:00 y de 18:00 a 00:00. Sábado de 11:00 a 00:00. Domingo cerrado.","consejo":"Antigua tienda de vino a granel convertida en vinoteca con productos gourmet. Macarfi recomienda las ostras, las anchoas, los embutidos y quesos y el bikini de trufa, y destaca su carta de vinos. Para cenar, o para comer el sábado, reserva; para una copa o un vermut puedes ir sin reserva si hay sitio.","extra":""},"en":{"tipo":"Wine bar and delicatessen.","horario":"Monday and Tuesday 18:00–23:00. Wednesday and Thursday 10:00–14:00 and 18:00–23:00. Friday 10:00–14:00 and 18:00–00:00. Saturday 11:00–00:00. Closed on Sunday.","consejo":"A former bulk-wine shop turned into a wine bar with gourmet products. Macarfi recommends the oysters, anchovies, cured meats and cheeses and the truffle toastie (bikini), and praises the wine list. Book for dinner or Saturday lunch; for a glass of wine or a vermouth you can just walk in if there's room.","extra":""},"fr":{"tipo":"Bar à vins et épicerie fine.","horario":"Lundi et mardi de 18:00 à 23:00. Mercredi et jeudi de 10:00 à 14:00 et de 18:00 à 23:00. Vendredi de 10:00 à 14:00 et de 18:00 à 00:00. Samedi de 11:00 à 00:00. Fermé le dimanche.","consejo":"Ancienne boutique de vin en vrac devenue bar à vins avec produits fins. Macarfi recommande les huîtres, les anchois, la charcuterie et les fromages ainsi que le croque à la truffe (bikini), et salue sa carte des vins. Réservez pour le dîner ou le déjeuner du samedi ; pour un verre ou un vermouth, vous pouvez venir sans réservation s'il y a de la place.","extra":""},"sources":["https://www.cellerjordana.com/pages/contact","https://macarfi.com/en/bcn/restaurant-card/celler-jordana","https://alella.cat/gastronomia"]},{"id":"alella-bar-companyia-d-alella","town":"Alella","cat":"bar","name":"Companyia d'Alella, Celler i Taverna","lat":41.493129,"lng":2.293248,"address":"Carrer de la Riera Fosca, 28-30, 08328 Alella","tel":"935 40 03 41","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Taberna-bodega de vermut y tapas en una nave del siglo XIX.","horario":"No publicado: llama antes (935 40 03 41).","consejo":"Ambiente de bodega de toda la vida y muy local. Vermut de la casa, embutidos, quesos y anchoas, con vino DO Alella. Pides en la barra, pagas y te avisan con un buscapersonas. Prueba la Salsa Alella, que recomienda el propio Ajuntament. Reserva el fin de semana.","extra":"En la Riera Principal, 20 tienen además una tienda de vinos, cavas y productos gourmet (93 404 69 46)."},"en":{"tipo":"Vermouth and tapas tavern-bodega in a 19th-century warehouse.","horario":"Not published: ring ahead (935 40 03 41).","consejo":"A proper old-style, very local bodega. House vermouth, cured meats, cheeses and anchovies with DO Alella wine. You order and pay at the bar and get a buzzer that tells you when your food is ready. Try the Salsa Alella, a tip from the Town Council itself. Book at weekends.","extra":"They also have a shop selling wine, cava and gourmet products at Riera Principal, 20 (93 404 69 46)."},"fr":{"tipo":"Taverne-bodega à vermouth et tapas dans un entrepôt du XIXe siècle.","horario":"Non publiés : appelez avant (935 40 03 41).","consejo":"Ambiance de bodega d'autrefois, très locale. Vermouth maison, charcuterie, fromages et anchois avec du vin DO Alella. On commande et on paie au comptoir, puis un bipeur vous prévient quand c'est prêt. Goûtez la Salsa Alella, conseillée par la mairie elle-même. Réservez le week-end.","extra":"Ils ont aussi une boutique de vins, cavas et produits fins au Riera Principal, 20 (93 404 69 46)."},"sources":["https://alella.cat/gastronomia","https://gastroranking.es/r/companya-dalella_24114/"]},{"id":"sant-cebria-de-vallalta-comer-la-vinya","town":"Sant Cebrià de Vallalta","cat":"comer","name":"Restaurant La Vinya","lat":41.617381,"lng":2.604785,"address":"Av. del Maresme, 24, 08396 Sant Cebrià de Vallalta","tel":"937 63 02 42","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Cocina catalana casera.","horario":"No publicado: llama antes (937 63 02 42).","consejo":"Lo más famoso son los caracoles, que muchas reseñas llaman los mejores de la zona. Cocina casera con buena relación calidad-precio. Las cenas del fin de semana se llenan, así que reserva. Hay aparcamiento cerca.","extra":""},"en":{"tipo":"Home-style Catalan cooking.","horario":"Not published: ring ahead (937 63 02 42).","consejo":"It is best known for its snails, which many reviewers call the best in the area. Home cooking at good value. Weekend dinners fill up, so book. There is parking nearby.","extra":""},"fr":{"tipo":"Cuisine catalane maison.","horario":"Non publiés : appelez avant (937 63 02 42).","consejo":"Sa spécialité la plus connue, ce sont les escargots, que de nombreux avis jugent les meilleurs du coin. Cuisine maison au bon rapport qualité-prix. Les dîners du week-end sont vite complets : réservez. Parking à proximité.","extra":""},"sources":["https://gastroranking.es/r/la-vina-12_69346/","https://www.stcebria.cat/turisme/on-menjar","https://www.openstreetmap.org/node/8487301656"]},{"id":"sant-cebria-de-vallalta-comer-ca-l-adri-can-cona","town":"Sant Cebrià de Vallalta","cat":"comer","name":"Ca l'Adri – Can Cona","lat":41.613992,"lng":2.604884,"address":"Ctra. de Sant Pol de Mar a Sant Cebrià de Vallalta, 08396 Sant Cebrià de Vallalta","tel":"638 24 03 46","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Masía con cocina catalana y a la brasa.","horario":"No publicado: llama antes (638 24 03 46).","consejo":"Está en la carretera de Sant Pol, a la salida del pueblo, así que es mejor ir en coche. Pide conejo, escalivada a la brasa o canelones. Ambiente familiar; con buen tiempo se come fuera, bajo las moreras.","extra":""},"en":{"tipo":"Farmhouse restaurant with Catalan and chargrilled food.","horario":"Not published: ring ahead (638 24 03 46).","consejo":"It is on the Sant Pol road, just outside the village, so it's best to drive. Order the rabbit, the chargrilled escalivada or the cannelloni. Family atmosphere; in good weather you can eat outside under the mulberry trees.","extra":""},"fr":{"tipo":"Mas avec cuisine catalane et grillades à la braise.","horario":"Non publiés : appelez avant (638 24 03 46).","consejo":"Il se trouve sur la route de Sant Pol, à la sortie du village : mieux vaut y aller en voiture. Commandez le lapin, l'escalivada à la braise ou les cannellonis. Ambiance familiale ; quand il fait beau, on mange dehors, sous les mûriers.","extra":""},"sources":["https://gastroranking.es/r/ca-ladri-can-cona_57052/","https://www.stcebria.cat/turisme/on-menjar","https://www.openstreetmap.org/way/1138657432"]},{"id":"alella-comer-leandre-gastro-bar","town":"Alella","cat":"comer","name":"Leandre Gastro-bar","lat":41.493502,"lng":2.295441,"address":"Rambla d'Àngel Guimerà, 20, 08328 Alella","tel":"935 40 58 26","web":"https://leandregastrobar.com","guardia_url":"","season":"Todo el año","es":{"tipo":"Gastrobar con decoración retro.","horario":"De 13:00 a 15:30 y de 19:00 a 23:00 (los días de cierre no están publicados).","consejo":"Muy bien valorado en Google y Tripadvisor. En las reseñas destacan el tartar de ternera, las croquetas, el brioche de vieiras y los huevos estrellados. Reserva antes de ir (935 40 58 26 o desde su web).","extra":""},"en":{"tipo":"Gastro-bar with retro décor.","horario":"13:00–15:30 and 19:00–23:00 (closing days not published).","consejo":"Very highly rated on Google and Tripadvisor. Reviewers single out the beef tartare, the croquettes, the scallop brioche and the huevos estrellados (fried eggs over chips). Book before you go (935 40 58 26 or via its website).","extra":""},"fr":{"tipo":"Gastro-bar au décor rétro.","horario":"De 13:00 à 15:30 et de 19:00 à 23:00 (jours de fermeture non publiés).","consejo":"Très bien noté sur Google et Tripadvisor. Les avis citent le tartare de bœuf, les croquettes, la brioche aux Saint-Jacques et les huevos estrellados (œufs au plat sur frites). Réservez avant d'y aller (935 40 58 26 ou sur son site).","extra":""},"sources":["https://leandregastrobar.com/","https://gastroranking.es/r/leandre-gastro-bar_165372/","https://alella.cat/gastronomia"]},{"id":"alella-comer-1789","town":"Alella","cat":"comer","name":"Restaurant 1789","lat":41.492812,"lng":2.295068,"address":"Rambla d'Àngel Guimerà, 1, 08328 Alella","tel":"935 55 34 55","web":"https://www.restaurante1789.com/","guardia_url":"","season":"Todo el año (vacaciones a finales de agosto)","es":{"tipo":"Restaurante clásico en una antigua bodega de masía con techos de bóveda.","horario":"Comidas todos los días de 13:00 a 15:45. Cenas solo viernes y sábado de 20:30 a 22:45. En 2026 cerró por vacaciones del 24 de agosto al 2 de septiembre.","consejo":"Está en la antigua bodega de Can Lleonart y lo llevan los hermanos Aguilar desde 1978 (Francisco en la cocina y José Luís como sumiller). Reserva por TheFork, desde su web o al 935 55 34 55.","extra":""},"en":{"tipo":"Classic restaurant in an old farmhouse wine cellar with vaulted ceilings.","horario":"Lunch every day 13:00–15:45. Dinner Friday and Saturday only, 20:30–22:45. In 2026 it closed for holidays from 24 August to 2 September.","consejo":"It is in the old wine cellar of Can Lleonart and has been run by the Aguilar brothers since 1978 (Francisco in the kitchen, José Luís as sommelier). Book via TheFork, its website or on 935 55 34 55.","extra":""},"fr":{"tipo":"Restaurant classique dans l'ancien chai voûté d'un mas.","horario":"Déjeuner tous les jours de 13:00 à 15:45. Dîner uniquement vendredi et samedi de 20:30 à 22:45. En 2026, fermé pour congés du 24 août au 2 septembre.","consejo":"Il occupe l'ancien chai de Can Lleonart et les frères Aguilar le tiennent depuis 1978 (Francisco en cuisine, José Luís sommelier). Réservez via TheFork, sur son site ou au 935 55 34 55.","extra":""},"sources":["https://www.restaurante1789.com/","https://alella.cat/gastronomia"]},{"id":"alella-comer-can-duran","town":"Alella","cat":"comer","name":"Restaurant Can Duran","lat":41.493423,"lng":2.295407,"address":"Rambla d'Àngel Guimerà, 18, 08328 Alella","tel":"935 55 10 45","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Cocina catalana tradicional y menú del día.","horario":"No publicado: llama antes (935 55 10 45).","consejo":"Es un antiguo café del centro convertido en restaurante. Las reseñas destacan su menú del día por calidad y precio. Se llena, así que reserva. Va bien con niños.","extra":""},"en":{"tipo":"Traditional Catalan cooking and a set lunch menu.","horario":"Not published: ring ahead (935 55 10 45).","consejo":"A former café in the centre turned into a restaurant. Reviewers praise the set menu (menú del día) for quality and price. It fills up, so book. Good with children.","extra":""},"fr":{"tipo":"Cuisine catalane traditionnelle et menu du jour.","horario":"Non publiés : appelez avant (935 55 10 45).","consejo":"Un ancien café du centre transformé en restaurant. Les avis saluent son menu du jour pour sa qualité et son prix. Il est souvent complet : réservez. Adapté aux enfants.","extra":""},"sources":["https://alella.cat/gastronomia","https://gastroranking.es/r/can-duran-2_110647/","https://www.openstreetmap.org/node/6327683764"]},{"id":"sant-cebria-de-vallalta-iconico-esglesia-sant-cebria","town":"Sant Cebrià de Vallalta","cat":"iconico","name":"Església parroquial de Sant Cebrià","lat":41.619893,"lng":2.599713,"address":"Carrer de l'Església, 1, 08396 Sant Cebrià de Vallalta","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Iglesia parroquial con campanario gótico de 1577.","horario":"El exterior se puede ver siempre. Para visitar el interior, consulta el horario de misas en la parroquia.","consejo":"Su origen se remonta a 1019, cuando el obispo de Girona consagró la antigua ermita de Santa Maria como Sant Cebrià. Da para un paseo corto por el núcleo antiguo y un café en la plaza.","extra":""},"en":{"tipo":"Parish church with a Gothic bell tower dating from 1577.","horario":"You can see the outside at any time. To visit the inside, check Mass times with the parish.","consejo":"Its origins go back to 1019, when the Bishop of Girona consecrated the former hermitage of Santa Maria as Sant Cebrià. Worth a short stroll around the old core, followed by a coffee in the square.","extra":""},"fr":{"tipo":"Église paroissiale avec un clocher gothique de 1577.","horario":"L'extérieur se voit à tout moment. Pour l'intérieur, renseignez-vous sur les horaires des messes auprès de la paroisse.","consejo":"Ses origines remontent à 1019, quand l'évêque de Gérone consacra l'ancien ermitage de Santa Maria sous le nom de Sant Cebrià. Idéal pour une courte balade dans le vieux centre, suivie d'un café sur la place.","extra":""},"sources":["https://ca.wikipedia.org/wiki/Sant_Cebrià_de_Vallalta","https://www.openstreetmap.org/way/911038349"]},{"id":"alella-iconico-celler-marfil-alella-vinicola","town":"Alella","cat":"iconico","name":"Celler Marfil – Alella Vinícola (bodega modernista)","lat":41.494829,"lng":2.296143,"address":"Rambla d'Àngel Guimerà, 62 / Riera Coma Clara, 9, 08328 Alella","tel":"935 403 842","web":"https://www.cellermarfil.com/","guardia_url":"","season":"Todo el año","es":{"tipo":"Bodega modernista de 1906 de la DO Alella, todavía en activo.","horario":"Visitas y catas solo con reserva en su calendario online.","consejo":"La diseñó Jeroni Martorell, discípulo de Gaudí, y llaman la atención sus arcos catenarios. El edificio está protegido como bien de interés local. Reserva la visita con cata en cellermarfil.com; también organizan paseos por las viñas con cata de tres vinos.","extra":""},"en":{"tipo":"Modernista winery from 1906 in the DO Alella, still in production.","horario":"Tours and tastings by booking only, through its online calendar.","consejo":"It was designed by Jeroni Martorell, a disciple of Gaudí, and its catenary arches are striking. The building is protected as a site of local heritage interest. Book a tour with tasting at cellermarfil.com; they also run vineyard walks with a tasting of three wines.","extra":""},"fr":{"tipo":"Cave moderniste de 1906 de la DO Alella, toujours en activité.","horario":"Visites et dégustations uniquement sur réservation, via son calendrier en ligne.","consejo":"Elle a été conçue par Jeroni Martorell, disciple de Gaudí, et ses arcs caténaires impressionnent. Le bâtiment est protégé comme bien d'intérêt local. Réservez la visite avec dégustation sur cellermarfil.com ; ils proposent aussi des balades dans les vignes avec dégustation de trois vins.","extra":""},"sources":["https://alella.cat/14163","https://www.cellermarfil.com/"]},{"id":"alella-iconico-can-manye","town":"Alella","cat":"iconico","name":"Can Manyé – Espai d'Art i Creació","lat":41.493641,"lng":2.292119,"address":"Riera Fosca, 42, 08328 Alella","tel":"935 408 723","web":"https://alella.cat/artcanmanye","guardia_url":"","season":"Todo el año (cierra en vacaciones de verano, Navidad y Semana Santa)","es":{"tipo":"Espacio municipal de exposiciones de arte, de entrada gratuita.","horario":"Miércoles a viernes de 17:00 a 20:00. Sábado y domingo de 11:00 a 14:00. Cerrado en vacaciones de verano, Navidad y Semana Santa.","consejo":"La entrada es gratis y cada visita incluye una explicación de la exposición. Está en la Riera Fosca, a pocos minutos a pie de la Oficina de Turisme (Riera Fosca, 2).","extra":""},"en":{"tipo":"Municipal art exhibition space, free entry.","horario":"Wednesday to Friday 17:00–20:00. Saturday and Sunday 11:00–14:00. Closed during the summer holidays, Christmas and Easter week.","consejo":"Entry is free and every visit includes an explanation of the exhibition. It is on Riera Fosca, a few minutes' walk from the Tourist Office (Riera Fosca, 2).","extra":""},"fr":{"tipo":"Espace municipal d'expositions d'art, entrée gratuite.","horario":"Du mercredi au vendredi de 17:00 à 20:00. Samedi et dimanche de 11:00 à 14:00. Fermé pendant les vacances d'été, à Noël et pendant la Semaine sainte.","consejo":"L'entrée est gratuite et chaque visite comprend une présentation de l'exposition. Il se trouve sur la Riera Fosca, à quelques minutes à pied de l'Office de tourisme (Riera Fosca, 2).","extra":""},"sources":["https://alella.cat/artcanmanye","https://alella.cat/gastronomia"]},{"id":"alella-atardecer-turo-d-en-galzeran","town":"Alella","cat":"atardecer","name":"Mirador del Turó d'en Galzeran","lat":41.504626,"lng":2.266618,"address":"Parking: final del carrer del Rosselló (urb. Mas Coll), Alella","tel":"","web":"https://alella.cat/14611","guardia_url":"","season":"Todo el año (en verano, evita las horas de más sol)","es":{"tipo":"Mirador en una cima de 484 m con torre de vigilancia.","horario":"Acceso libre, a pie.","consejo":"Aparca al final del carrer del Rosselló (urb. Mas Coll) y sube unos 35 min andando; el pin marca la cima. Hacia el oeste se ve la plana del Vallès y Montserrat, y también Barcelona, la costa y el Montseny. Lleva frontal para bajar después de la puesta de sol, y prismáticos: es un buen sitio para ver rapaces (hay un panel para identificarlas).","extra":"Alternativa a pie: itinerario Alella Parc – Turó d'en Galzeran. 6,6 km · 2 h · dificultad moderada · desnivel 203 m · circular, desde el final del carrer Salvador Espriu (Alella Parc)."},"en":{"tipo":"Viewpoint on a 484 m summit with a watchtower.","horario":"Free access, on foot.","consejo":"Park at the end of Carrer del Rosselló (Mas Coll estate) and walk up for about 35 minutes; the pin marks the summit. To the west you can see the Vallès plain and Montserrat, as well as Barcelona, the coast and the Montseny. Bring a head torch for the walk down after sunset, and binoculars: it's a good spot for birds of prey (there is a panel to help identify them).","extra":"Walking alternative: the Alella Parc – Turó d'en Galzeran route. 6.6 km · 2 h · moderate · 203 m height difference · circular, from the end of Carrer Salvador Espriu (Alella Parc)."},"fr":{"tipo":"Belvédère sur un sommet de 484 m avec une tour de guet.","horario":"Accès libre, à pied.","consejo":"Garez-vous au bout du Carrer del Rosselló (lotissement Mas Coll) et montez environ 35 min à pied ; le repère indique le sommet. À l'ouest, on voit la plaine du Vallès et Montserrat, ainsi que Barcelone, la côte et le Montseny. Prenez une lampe frontale pour redescendre après le coucher du soleil, et des jumelles : c'est un bon endroit pour observer les rapaces (un panneau aide à les identifier).","extra":"Variante à pied : itinéraire Alella Parc – Turó d'en Galzeran. 6,6 km · 2 h · difficulté modérée · dénivelé 203 m · circulaire, depuis le bout du Carrer Salvador Espriu (Alella Parc)."},"sources":["https://alella.cat/14611","https://alella.cat/14573","https://www.openstreetmap.org/node/3168223047"]},{"id":"alella-ruta-itinerari-de-les-fonts","town":"Alella","cat":"ruta","name":"Itinerari de les Fonts d'Alella","lat":41.492776,"lng":2.29488,"address":"Salida: Can Lleonart (Plaça dels Germans Lleonart, 1), 08328 Alella","tel":"","web":"https://alella.cat/14543","guardia_url":"","season":"Todo el año","es":{"tipo":"Sendero local señalizado y circular entre fuentes, viñas y bosque.","horario":"Libre.","consejo":"Sale de Can Lleonart, en el centro. Para ahorrarte el tramo urbano, empieza en la urbanización Mas Coll (carrer Vallespir), a la que llegas en coche o en bus. Pasa por la Font de l'Esquerda, dentro de una galería excavada en la roca, la Font dels Eucaliptus y el Mirador dels Nou Pins, con vistas al mar. Está señalizado.","extra":"9,2 km · 3 h 15 min · dificultad media · desnivel 124 m · circular · apta para familias."},"en":{"tipo":"Waymarked circular local trail past springs, vineyards and woodland.","horario":"Open access.","consejo":"It starts at Can Lleonart, in the centre. To skip the urban stretch, start at the Mas Coll estate (Carrer Vallespir), which you can reach by car or bus. It passes the Font de l'Esquerda, set inside a gallery dug into the rock, the Font dels Eucaliptus and the Mirador dels Nou Pins, with views of the sea. The route is waymarked.","extra":"9.2 km · 3 h 15 min · medium difficulty · 124 m height difference · circular · family-friendly."},"fr":{"tipo":"Sentier local balisé et circulaire entre sources, vignes et forêt.","horario":"Accès libre.","consejo":"Départ de Can Lleonart, dans le centre. Pour éviter la partie urbaine, commencez au lotissement Mas Coll (Carrer Vallespir), accessible en voiture ou en bus. Il passe par la Font de l'Esquerda, nichée dans une galerie creusée dans la roche, la Font dels Eucaliptus et le Mirador dels Nou Pins, avec vue sur la mer. L'itinéraire est balisé.","extra":"9,2 km · 3 h 15 · difficulté moyenne · dénivelé 124 m · circulaire · adapté aux familles."},"sources":["https://alella.cat/14543","https://es.wikiloc.com/rutas-senderismo/itinerari-de-les-fonts-dalellal-sl-c-135-102906783"]},{"id":"sant-cebria-de-vallalta-urgencias-hospital-de-calella","town":"Sant Cebrià de Vallalta","cat":"urgencias","name":"Hospital Comarcal Sant Jaume de Calella (Urgencias 24 h)","lat":41.61518,"lng":2.657213,"address":"C/ Sant Jaume, 209-219, 08370 Calella","tel":"93 769 02 01 / Emergencias: 112","web":"https://salutms.cat/corporacio/els-nostres-centres/hospital-de-calella-2/","guardia_url":"","season":"Todo el año","es":{"tipo":"Hospital con Urgencias 24 horas (en Calella).","horario":"Urgencias abiertas las 24 h, todos los días.","consejo":"Urgencias tiene entrada propia, separada de la principal, y una parada de taxis al lado. Delante del hospital hay aparcamiento de pago (zona azul). Lleva DNI o pasaporte y la tarjeta sanitaria o la póliza del seguro. Para dudas de salud no urgentes, llama al 061 (CatSalut Respon, 24 h).","extra":""},"en":{"tipo":"Hospital with 24-hour A&E (in Calella).","horario":"A&E open 24 hours, every day.","consejo":"A&E has its own entrance, separate from the main one, with a taxi rank next to it. There is pay parking (blue zone) in front of the hospital. Bring your ID card or passport and your health card or insurance policy. For non-urgent health questions, call 061 (CatSalut Respon, 24 h).","extra":""},"fr":{"tipo":"Hôpital avec urgences 24 h/24 (à Calella).","horario":"Urgences ouvertes 24 h/24, tous les jours.","consejo":"Les urgences ont leur propre entrée, distincte de l'entrée principale, avec une station de taxis juste à côté. Stationnement payant (zone bleue) devant l'hôpital. Apportez votre pièce d'identité ou passeport et votre carte de santé ou votre police d'assurance. Pour un problème de santé non urgent, appelez le 061 (CatSalut Respon, 24 h/24).","extra":""},"sources":["https://salutms.cat/corporacio/els-nostres-centres/hospital-de-calella-2/","https://salutms.cat/ciutadania/informacio/anar-a-urgencies-8/"]},{"id":"blanes-farmacia-creixell-adell","town":"Blanes","cat":"farmacia","name":"Farmàcia Creixell-Adell","lat":41.674191,"lng":2.790225,"address":"C/ Muralla, 36, 17300 Blanes","tel":"972 330 491","web":"https://www.farmaciaadell.com","guardia_url":"https://www.cofgi.org/farmacies/farmacies-de-guardia","season":"Todo el año","es":{"tipo":"Farmacia de referencia en el centro (la de guardia cambia cada día).","horario":"Lunes a viernes 09:00–13:30 y 16:30–20:00; sábado 09:00–13:30. Julio y agosto: lunes a sábado 09:00–13:30 y 17:00–20:30.","consejo":"Fuera de horario, busca la farmacia de guardia del día en la web del Col·legi de Farmacèutics de Girona (elige Blanes y la fecha). Si la de guardia aparece con un icono de teléfono, es una guardia no presencial: llama antes de ir. Esta farmacia también atiende por WhatsApp (649 782 980).","extra":""},"en":{"tipo":"Central reference pharmacy (the duty pharmacy changes every day).","horario":"Monday to Friday 09:00–13:30 and 16:30–20:00; Saturday 09:00–13:30. July and August: Monday to Saturday 09:00–13:30 and 17:00–20:30.","consejo":"Outside these hours, look up the day's duty pharmacy on the Col·legi de Farmacèutics de Girona website (choose Blanes and the date). If the duty pharmacy shows a telephone icon, it is an on-call service: ring before you go. This pharmacy also answers on WhatsApp (649 782 980).","extra":""},"fr":{"tipo":"Pharmacie de référence en centre-ville (la pharmacie de garde change chaque jour).","horario":"Du lundi au vendredi 09:00–13:30 et 16:30–20:00 ; samedi 09:00–13:30. Juillet et août : du lundi au samedi 09:00–13:30 et 17:00–20:30.","consejo":"En dehors de ces horaires, cherchez la pharmacie de garde du jour sur le site du Col·legi de Farmacèutics de Girona (choisissez Blanes et la date). Si la pharmacie de garde affiche une icône de téléphone, c'est une garde à distance : appelez avant de vous déplacer. Cette pharmacie répond aussi sur WhatsApp (649 782 980).","extra":""},"sources":["https://www.farmaciaadell.com","https://www.cofgi.org/farmacies/farmacies-de-guardia"]},{"id":"tordera-farmacia-marcoval","town":"Tordera","cat":"farmacia","name":"Farmàcia Núria Marcoval Martí","lat":41.702111,"lng":2.719089,"address":"Plaça de l'Església, 7, 08490 Tordera","tel":"937 64 09 92","web":"","guardia_url":"https://www.farmaguia.net","season":"Todo el año","es":{"tipo":"Farmacia de referencia en el centro (la de guardia cambia cada día).","horario":"No verificado: llama antes de ir.","consejo":"Para saber la farmacia de guardia de hoy usa Farmaguia, el localizador oficial del Col·legi de Farmacèutics de Barcelona (web o app). Esta farmacia está en la Plaça de l'Església, en pleno centro.","extra":""},"en":{"tipo":"Central reference pharmacy (the duty pharmacy changes every day).","horario":"Not verified: ring before you go.","consejo":"To find today's duty pharmacy, use Farmaguia, the official locator of the Col·legi de Farmacèutics de Barcelona (website or app). This pharmacy is on the Plaça de l'Església, right in the centre.","extra":""},"fr":{"tipo":"Pharmacie de référence en centre-ville (la pharmacie de garde change chaque jour).","horario":"Non vérifié : appelez avant de vous déplacer.","consejo":"Pour connaître la pharmacie de garde du jour, utilisez Farmaguia, le localisateur officiel du Col·legi de Farmacèutics de Barcelona (site web ou appli). Cette pharmacie se trouve sur la Plaça de l'Església, en plein centre.","extra":""},"sources":["https://www.cofb.org/ca/que-oferim/ciutadans/farmacies-obertes/","https://www.farmaguia.net","OpenStreetMap node/7299760850"]},{"id":"blanes-super-tarde-condis-lleida","town":"Blanes","cat":"super_tarde","name":"Condis (C/ de Lleida)","lat":41.677397,"lng":2.786264,"address":"C/ de Lleida, s/n, 17300 Blanes","tel":"935 653 400","web":"https://www.condis.es/tiendas-condis","guardia_url":"","season":"Todo el año","es":{"tipo":"Supermercado que cierra tarde / Urgencia.","horario":"Todos los días de 09:00 a 22:00 (según el localizador de Condis).","consejo":"Es de los que más tarde cierran en Blanes y el localizador de Condis da el mismo horario también en domingo. En festivos puede cambiar: confírmalo si llegas un día de fiesta.","extra":""},"en":{"tipo":"Late-closing supermarket / Emergency shop.","horario":"Every day 09:00 to 22:00 (according to the Condis store locator).","consejo":"One of the latest-closing shops in Blanes, and the Condis locator gives the same hours on Sundays too. Hours may change on public holidays: check if you arrive on one.","extra":""},"fr":{"tipo":"Supermarché qui ferme tard / Dépannage.","horario":"Tous les jours de 09:00 à 22:00 (selon le localisateur de magasins Condis).","consejo":"C'est l'un des magasins qui ferment le plus tard à Blanes, et le localisateur Condis indique les mêmes horaires le dimanche. Les jours fériés, les horaires peuvent changer : vérifiez si vous arrivez un jour férié.","extra":""},"sources":["https://www.condis.es/wp-content/uploads/condis/stores-finder-es.json","https://www.condis.es/tiendas-condis"]},{"id":"blanes-super-tarde-condis-sant-antoni","town":"Blanes","cat":"super_tarde","name":"Condis El Teu Super (C/ Sant Antoni)","lat":41.673206,"lng":2.790347,"address":"C/ Sant Antoni, 3, 17300 Blanes","tel":"972 338 991","web":"https://www.condis.es/tiendas-condis","guardia_url":"","season":"Todo el año","es":{"tipo":"Supermercado de proximidad en el centro / Compra rápida.","horario":"Todos los días de 08:00 a 21:30 (según el localizador de Condis).","consejo":"En pleno centro, a pocos minutos a pie del paseo marítimo y de Sa Palomera. Perfecto para la compra rápida sin mover el coche.","extra":""},"en":{"tipo":"Neighbourhood supermarket in the centre / Quick shop.","horario":"Every day 08:00 to 21:30 (according to the Condis store locator).","consejo":"Right in the centre, a few minutes' walk from the seafront promenade and Sa Palomera. Perfect for a quick shop without moving the car.","extra":""},"fr":{"tipo":"Supérette de proximité en centre-ville / Courses rapides.","horario":"Tous les jours de 08:00 à 21:30 (selon le localisateur de magasins Condis).","consejo":"En plein centre, à quelques minutes à pied du front de mer et de Sa Palomera. Idéal pour des courses rapides sans reprendre la voiture.","extra":""},"sources":["https://www.condis.es/wp-content/uploads/condis/stores-finder-es.json"]},{"id":"tordera-super-tarde-condis-fogars","town":"Tordera","cat":"super_tarde","name":"Condis (Ctra. de Fogars)","lat":41.701212,"lng":2.714652,"address":"Ctra. de Fogars, Sector 11 (Parcel·la E), 08490 Tordera","tel":"938 559 123","web":"https://www.condis.es/tiendas-condis","guardia_url":"","season":"Todo el año","es":{"tipo":"Supermercado abierto todos los días / Urgencia.","horario":"Todos los días de 08:00 a 21:00 (según el localizador de Condis).","consejo":"Abre todos los días, también el domingo del mercado. Está en la Ctra. de Fogars, a unos 300 m de la zona del mercado dominical.","extra":""},"en":{"tipo":"Supermarket open every day / Emergency shop.","horario":"Every day 08:00 to 21:00 (according to the Condis store locator).","consejo":"Open every day, including market Sunday. It is on the Ctra. de Fogars, about 300 m from the Sunday market area.","extra":""},"fr":{"tipo":"Supermarché ouvert tous les jours / Dépannage.","horario":"Tous les jours de 08:00 à 21:00 (selon le localisateur de magasins Condis).","consejo":"Ouvert tous les jours, y compris le dimanche du marché. Il se trouve sur la Ctra. de Fogars, à environ 300 m de la zone du marché dominical.","extra":""},"sources":["https://www.condis.es/wp-content/uploads/condis/stores-finder-es.json"]},{"id":"blanes-g cat":"mercadillo","name":"Mercado semanal de los lunes (Mercat dels Teixits)","lat":41.673433,"lng":2.792438,"address":"Passeig de Mar (Passeig de Cortils i Vieta), 17300 Blanes","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Mercadillo semanal de ropa, calzado, complementos y bazar.","horario":"Lunes por la mañana, aprox. 09:00–14:00 (horario no oficial).","consejo":"Se monta en el paseo marítimo del centro (Passeig de Mar). Ve temprano y a pie, y combínalo con el mercado de fruta y verdura del Passeig de Dintre, justo al lado.","extra":"Lugar: Passeig de Mar (Passeig de Cortils i Vieta), frente a la playa de Blanes."},"en":{"tipo":"Weekly street market: clothes, shoes, accessories and household goods.","horario":"Monday mornings, approx. 09:00–14:00 (unofficial hours).","consejo":"Set up along the town-centre seafront (Passeig de Mar). Go early and on foot, and combine it with the fruit and vegetable market on the Passeig de Dintre, right next to it.","extra":"Location: Passeig de Mar (Passeig de Cortils i Vieta), facing Blanes beach."},"fr":{"tipo":"Marché hebdomadaire : vêtements, chaussures, accessoires et bazar.","horario":"Le lundi matin, env. 09:00–14:00 (horaires non officiels).","consejo":"Il s'installe sur le front de mer du centre (Passeig de Mar). Venez tôt et à pied, et combinez-le avec le marché de fruits et légumes du Passeig de Dintre, juste à côté.","extra":"Lieu : Passeig de Mar (Passeig de Cortils i Vieta), face à la plage de Blanes."},"sources":["https://blanes.cat/docweb/2021-02-01-recicl","https://bibgirona.cat/assets/documents/000/315/659/article.pdf","https://mercadillos.org/es/blanes/mercadillo-blanes"]},{"id":"blanes-mercadillo-fruita-dintre","town":"Blanes","cat":"mercadillo","name":"Mercat de fruita i verdura del Passeig de Dintre","lat":41.673613,"lng":2.79154,"address":"Passeig de Dintre, 17300 Blanes","tel":"972 379 377","web":"https://promocio.blanes.cat/mercats-de-blanes/","guardia_url":"","season":"Todo el año","es":{"tipo":"Mercado de payés al aire libre (fruta y verdura local).","horario":"De Semana Santa al 15 de octubre: lunes a sábado 08:00–15:00. Resto del año: lunes a viernes 08:00–13:00 (cierre como muy tarde a las 14:30) y sábado 08:00–15:00.","consejo":"33 puestos, sobre todo de payeses de la zona, en pleno centro. Ideal para la fruta de temporada del primer día; en invierno ve antes de las 13:00.","extra":"Lugar: Passeig de Dintre, centro de Blanes."},"en":{"tipo":"Open-air farmers' market (local fruit and vegetables).","horario":"Holy Week (Easter) to 15 October: Monday to Saturday 08:00–15:00. Rest of the year: Monday to Friday 08:00–13:00 (closing by 14:30 at the latest) and Saturday 08:00–15:00.","consejo":"33 stalls, mostly local growers, right in the centre. Ideal for seasonal fruit on your first day; in winter, go before 13:00.","extra":"Location: Passeig de Dintre, Blanes town centre."},"fr":{"tipo":"Marché de producteurs en plein air (fruits et légumes locaux).","horario":"De la Semaine sainte au 15 octobre : du lundi au samedi 08:00–15:00. Le reste de l'année : du lundi au vendredi 08:00–13:00 (fermeture au plus tard à 14:30) et samedi 08:00–15:00.","consejo":"33 étals, surtout de producteurs de la région, en plein centre. Idéal pour les fruits de saison du premier jour ; en hiver, venez avant 13:00.","extra":"Lieu : Passeig de Dintre, centre de Blanes."},"sources":["https://promocio.blanes.cat/mercats-de-blanes/"]},{"id":"tordera-mercadillo-diumenge","town":"Tordera","cat":"mercadillo","name":"Mercat de Tordera (domingos)","lat":41.702239,"lng":2.717972,"address":"Calles del centro urbano, 08490 Tordera","tel":"93 764 37 17","web":"https://www.tordera.cat/tordera/turisme-i-patrimoni/el-mercat-de-tordera","guardia_url":"","season":"Todo el año","es":{"tipo":"Gran mercado dominical con más de 170 años de historia.","horario":"Todos los domingos del año, de 07:00 a 14:00.","consejo":"Uno de los mercados más grandes de la zona: el Ayuntamiento habla de casi 300 paradas y unos 40.000 visitantes por semana (fruta y verdura, ropa, complementos, regalos, decoración). Hay varias zonas de aparcamiento para coches y autocares; llega temprano. Los comercios del pueblo también abren el domingo por la mañana.","extra":"Lugar: calles del centro urbano de Tordera."},"en":{"tipo":"Large Sunday market with more than 170 years of history.","horario":"Every Sunday of the year, 07:00 to 14:00.","consejo":"One of the biggest markets in the area: the town council speaks of almost 300 stalls and around 40,000 visitors a week (fruit and veg, clothes, accessories, gifts, homeware). There are several car and coach parks; arrive early. Local shops also open on Sunday mornings.","extra":"Location: streets of Tordera town centre."},"fr":{"tipo":"Grand marché du dimanche, plus de 170 ans d'histoire.","horario":"Tous les dimanches de l'année, de 07:00 à 14:00.","consejo":"L'un des plus grands marchés de la région : la mairie parle de près de 300 étals et d'environ 40 000 visiteurs par semaine (fruits et légumes, vêtements, accessoires, cadeaux, décoration). Plusieurs parkings pour voitures et autocars ; arrivez tôt. Les commerces du village ouvrent aussi le dimanche matin.","extra":"Lieu : rues du centre-ville de Tordera."},"sources":["https://www.tordera.cat/tordera/turisme-i-patrimoni/el-mercat-de-tordera","https://www.tordera.cat/actualitat/el-mercat-de-tordera-entra-dins-el-pla-director-de-mercats-de-la-diputacio-de-barcelona"]},{"id":"blanes-bar-terrassans","town":"Blanes","cat":"bar","name":"Cafè Terrassans","lat":41.674179,"lng":2.792161,"address":"Passeig de Dintre, 31, 17300 Blanes","tel":"972 33 00 81","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Bar-café clásico con terraza en el centro.","horario":"Todos los días, aprox. 07:30–24:00 (según la guía Bravissima; puede variar en temporada baja).","consejo":"Un clásico de Blanes con terraza en el Passeig de Dintre, junto al Ayuntamiento: ideal para ver el ambiente del centro con calma. Famoso por sus calamares a la romana. En horas punta se llena.","extra":""},"en":{"tipo":"Classic café-bar with a terrace in the centre.","horario":"Every day, approx. 07:30–24:00 (according to the Bravissima guide; may vary in low season).","consejo":"A Blanes classic with a terrace on the Passeig de Dintre, next to the town hall: ideal for soaking up the town-centre atmosphere at a relaxed pace. Famous for its calamari a la romana. It fills up at peak times.","extra":""},"fr":{"tipo":"Café-bar classique avec terrasse en centre-ville.","horario":"Tous les jours, env. 07:30–24:00 (selon le guide Bravissima ; peut varier en basse saison).","consejo":"Un classique de Blanes avec terrasse sur le Passeig de Dintre, à côté de la mairie : idéal pour profiter tranquillement de l'ambiance du centre. Célèbre pour ses calamars à la romaine. Il se remplit aux heures de pointe.","extra":""},"sources":["https://bravissima.cat/en/i/3868-cafe-terrassans","OpenStreetMap node/11732204397"]},{"id":"blanes-bar-ja-leo","town":"Blanes","cat":"bar","name":"Bar Ja.Leo","lat":41.668692,"lng":2.78714,"address":"Passeig de S'Abanell, 17300 Blanes","tel":"872 26 95 99","web":"","guardia_url":"","season":"No verificado","es":{"tipo":"Bar de tapas con terraza frente al mar.","horario":"No verificado: llama antes (872 26 95 99).","consejo":"Terraza en el paseo de S'Abanell con vistas a la roca de Sa Palomera. Tapas generosas y económicas (casi todas por menos de 10 €, según el diario Ara en 2025): pulpo a la gallega, bravas, mejillones y calamares a la andaluza.","extra":""},"en":{"tipo":"Tapas bar with a seafront terrace.","horario":"Not verified: ring first (872 26 95 99).","consejo":"Terrace on the S'Abanell promenade with views of Sa Palomera rock. Generous, inexpensive tapas (almost all under €10, according to the newspaper Ara in 2025): Galician-style octopus, patatas bravas, mussels and Andalusian-style fried squid.","extra":""},"fr":{"tipo":"Bar à tapas avec terrasse face à la mer.","horario":"Non vérifié : appelez avant (872 26 95 99).","consejo":"Terrasse sur la promenade de S'Abanell avec vue sur le rocher de Sa Palomera. Tapas copieuses et bon marché (presque toutes à moins de 10 €, selon le journal Ara en 2025) : poulpe à la galicienne, patatas bravas, moules et calmars frits à l'andalouse.","extra":""},"sources":["https://en.ara.cat/food/from-sea-to-table-9-terraces-with-views-to-enjoy-the-costa-brava_1_5469027.html","OpenStreetMap node/12677067012"]},{"id":"tordera-bar-la-sardana","town":"Tordera","cat":"bar","name":"Bar La Sardana","lat":41.702127,"lng":2.72166,"address":"C/ Pere Quart, 51, 08490 Tordera","tel":"629 962 044","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Bar familiar con terraza cubierta junto a un parque infantil.","horario":"No verificado (en OpenStreetMap: martes a domingo 09:00–01:00). Llama antes: 629 962 044.","consejo":"Gran terraza cubierta al lado del parque infantil: ideal si vas con niños. Pizzas, bocadillos grandes, nachos y platos combinados a buen precio.","extra":""},"en":{"tipo":"Family-friendly bar with a covered terrace next to a playground.","horario":"Not verified (OpenStreetMap: Tuesday to Sunday 09:00–01:00). Ring first: 629 962 044.","consejo":"Large covered terrace beside the playground: ideal if you have children with you. Pizzas, big sandwiches, nachos and combination plates at fair prices.","extra":""},"fr":{"tipo":"Bar familial avec terrasse couverte à côté d'une aire de jeux.","horario":"Non vérifié (OpenStreetMap : du mardi au dimanche 09:00–01:00). Appelez avant : 629 962 044.","consejo":"Grande terrasse couverte à côté de l'aire de jeux : idéal avec des enfants. Pizzas, grands sandwichs, nachos et assiettes combinées à prix raisonnables.","extra":""},"sources":["https://bravissima.cat/en/costa-brava/tordera/places-to-eat","OpenStreetMap node/6371267512"]},{"id":"tordera-bar-el-cenachero","town":"Tordera","cat":"bar","name":"Taverna Andalusa El Cenachero","lat":41.701278,"lng":2.715565,"address":"Ctra. de Fogars, 29, 08490 Tordera","tel":"931 381 242","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Taberna andaluza de tapas, ambiente cálido.","horario":"No verificado: llama antes (931 381 242).","consejo":"Tapas y, los fines de semana, arroces recién hechos. Está en la Ctra. de Fogars, a 2–3 min a pie de la zona del mercado del domingo.","extra":""},"en":{"tipo":"Andalusian tapas tavern with a warm atmosphere.","horario":"Not verified: ring first (931 381 242).","consejo":"Tapas and, at weekends, freshly made rice dishes. On the Ctra. de Fogars, a 2–3 minute walk from the Sunday market area.","extra":""},"fr":{"tipo":"Taverne andalouse à tapas, ambiance chaleureuse.","horario":"Non vérifié : appelez avant (931 381 242).","consejo":"Tapas et, le week-end, plats de riz préparés à la minute. Sur la Ctra. de Fogars, à 2–3 min à pied de la zone du marché du dimanche.","extra":""},"sources":["https://bravissima.cat/en/costa-brava/tordera/places-to-eat","https://gastroranking.es/r/taberna-andaluza-el-cenachero_72408/"]},{"id":"blanes-comer-la-gaviota","town":"Blanes","cat":"comer","name":"La Gaviota","lat":41.675742,"lng":2.800677,"address":"Explanada del Port, 13, 17300 Blanes","tel":"972 33 53 70","web":"","guardia_url":"","season":"No verificado","es":{"tipo":"Cocina marinera de proximidad a buen precio.","horario":"No verificado: las fuentes no coinciden. Llama antes al 972 33 53 70.","consejo":"Pide el pescado del día de la lonja de Blanes; las gambas y cigalas son lo más elogiado. Unos 40 € por persona. Está en el puerto: reserva si vas a mediodía.","extra":""},"en":{"tipo":"Local seafood cooking at fair prices.","horario":"Not verified: sources disagree. Ring first on 972 33 53 70.","consejo":"Order the catch of the day from the Blanes fish market; the prawns and langoustines get the most praise. Around €40 per person. It is at the harbour: book if you are going for lunch.","extra":""},"fr":{"tipo":"Cuisine de la mer de proximité à bon prix.","horario":"Non vérifié : les sources ne concordent pas. Appelez avant au 972 33 53 70.","consejo":"Demandez le poisson du jour de la criée de Blanes ; les crevettes et les langoustines sont les plus appréciées. Environ 40 € par personne. Il se trouve sur le port : réservez si vous y allez le midi.","extra":""},"sources":["https://es.ara.cat/comer/glamour-londres-orgullo-blanes_1_5500436.html","https://gastroranking.es/r/restaurant-la-gaviota_138534/"]},{"id":"blanes-comer-cala-bona","town":"Blanes","cat":"comer","name":"Restaurant Cala Bona","lat":41.678845,"lng":2.806698,"address":"Cala de Sant Francesc (Passeig Bitàcora), 17300 Blanes","tel":"972 33 49 13","web":"http://www.restaurantcalabona.com/restaurant-blanes/?lang=es","guardia_url":"","season":"Marzo–12 de octubre","es":{"tipo":"Desayunos de tenedor y marisco frente al mar.","horario":"Temporada de marzo al 12 de octubre: desayunos en dos turnos (08:00 y 10:00) y comidas; cerrado por la noche.","consejo":"Ahora (noviembre) está cerrado: abre de marzo al 12 de octubre. El desayuno más completo cuesta 80 € para dos (cigalas, langosta con huevos, patatas y pimientos de Padrón, postre, vino y café); hay menús de desayuno de 17,50 € y 19,90 €. Las mesas están en primera línea de la cala: conviene reservar turno.","extra":""},"en":{"tipo":"Hearty 'fork' breakfasts and seafood by the sea.","horario":"Season from March to 12 October: breakfast in two sittings (08:00 and 10:00) and lunch; closed in the evening.","consejo":"Closed now (November): open from March to 12 October. The most complete breakfast costs €80 for two (langoustines, lobster with eggs, potatoes and Padrón peppers, dessert, wine and coffee); there are breakfast set menus at €17.50 and €19.90. Tables are right on the cove: booking a sitting is advisable.","extra":""},"fr":{"tipo":"Petits-déjeuners copieux « à la fourchette » et fruits de mer face à la mer.","horario":"Saison de mars au 12 octobre : petits-déjeuners en deux services (08:00 et 10:00) et déjeuners ; fermé le soir.","consejo":"Fermé en ce moment (novembre) : ouvert de mars au 12 octobre. Le petit-déjeuner le plus complet coûte 80 € pour deux (langoustines, langouste aux œufs, pommes de terre et piments de Padrón, dessert, vin et café) ; menus petit-déjeuner à 17,50 € et 19,90 €. Les tables sont en bord de crique : mieux vaut réserver un service.","extra":""},"sources":["https://en.ara.cat/food/lobster-cava-and-xuixo-for-breakfast-at-the-first-beach-of-the-costa-brava_1_5860374.html","http://www.restaurantcalabona.com/restaurant-blanes/?lang=es"]},{"id":"tordera-comer-can-casellas","town":"Tordera","cat":"comer","name":"Can Casellas","lat":41.691511,"lng":2.713255,"address":"Veïnat Sant Jaume, 6, 08490 Tordera","tel":"608 352 717","web":"https://www.cancasellas.com","guardia_url":"","season":"Todo el año","es":{"tipo":"Masía de cocina catalana de temporada.","horario":"Comidas: lunes a domingo 13:00–16:00. Cenas: viernes y sábado 20:00–23:00.","consejo":"Usan verduras de su propio huerto (calçots en temporada); cazuelitas, pescado de mercado, arroces y brasa. Los viernes por la noche hay música en directo. Reserva online o por teléfono.","extra":""},"en":{"tipo":"Farmhouse restaurant serving seasonal Catalan food.","horario":"Lunch: Monday to Sunday 13:00–16:00. Dinner: Friday and Saturday 20:00–23:00.","consejo":"Vegetables come from their own kitchen garden (calçots in season); small seasonal stews, market fish, rice dishes and chargrilled food. Live music on Friday nights. Book online or by phone.","extra":""},"fr":{"tipo":"Mas (ferme catalane) proposant une cuisine catalane de saison.","horario":"Déjeuner : du lundi au dimanche 13:00–16:00. Dîner : vendredi et samedi 20:00–23:00.","consejo":"Légumes de leur propre potager (calçots en saison) ; petites cassolettes, poisson du marché, riz et grillades. Musique live le vendredi soir. Réservez en ligne ou par téléphone.","extra":""},"sources":["https://www.cancasellas.com","https://bravissima.cat/en/costa-brava/tordera/places-to-eat"]},{"id":"tordera-comer-les-ferreres","town":"Tordera","cat":"comer","name":"Restaurant Les Ferreres","lat":41.686077,"lng":2.668263,"address":"Av. de Les Ferreres (Ctra. d'Hortsavinyà), 08490 Tordera","tel":"937 64 06 07","web":"","guardia_url":"","season":"Todo el año (no verificado)","es":{"tipo":"Masía de cocina catalana casera, ambiente familiar.","horario":"No verificado: llama antes al 937 64 06 07.","consejo":"Está fuera del pueblo, a los pies del Montnegre (carretera de Hortsavinyà): ve en coche y reserva el fin de semana. Según reseñas de 2026, el menú de fin de semana cuesta 28 € (niños 13 €). Tiene piscina y zona de juegos para niños: muy familiar.","extra":""},"en":{"tipo":"Farmhouse restaurant with home-style Catalan cooking and a family atmosphere.","horario":"Not verified: ring first on 937 64 06 07.","consejo":"Outside the town, at the foot of the Montnegre hills (Hortsavinyà road): go by car and book at weekends. According to 2026 reviews, the weekend set menu costs €28 (children €13). It has a swimming pool and a children's play area: very family-friendly.","extra":""},"fr":{"tipo":"Mas à la cuisine catalane maison, ambiance familiale.","horario":"Non vérifié : appelez avant au 937 64 06 07.","consejo":"En dehors du village, au pied du Montnegre (route d'Hortsavinyà) : venez en voiture et réservez le week-end. Selon des avis de 2026, le menu du week-end coûte 28 € (enfants 13 €). Piscine et aire de jeux pour enfants : très familial.","extra":""},"sources":["https://gastroranking.es/r/restaurant-les-ferreres_63020/"]},{"id":"blanes-iconico-marimurtra","town":"Blanes","cat":"iconico","name":"Jardí Botànic Marimurtra","lat":41.676802,"lng":2.801711,"address":"Passeig de Carles Faust, 9, 17300 Blanes","tel":"972 33 08 26","web":"https://marimurtra.cat/","guardia_url":"","season":"Todo el año (horario reducido en invierno)","es":{"tipo":"Jardín botánico sobre los acantilados.
