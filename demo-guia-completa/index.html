","horario":"Del 26 de octubre al 31 de diciembre de 2026: lunes a viernes 10:00–15:00; sábados y domingos 10:00–16:00. Festivos y resto del año, otro horario: consulta la web.","consejo":"Entrada de pago: cómprala en tickets.marimurtra.cat. Hay tarifa de tarde con acceso desde las 14:00. En invierno cierra pronto: ve por la mañana.","extra":""},"en":{"tipo":"Botanical garden on the clifftops.","horario":"26 October to 31 December 2026: Monday to Friday 10:00–15:00; Saturday and Sunday 10:00–16:00. Public holidays and the rest of the year: different hours, check the website.","consejo":"Paid entry: buy tickets at tickets.marimurtra.cat. There is an afternoon rate with entry from 14:00. It closes early in winter: go in the morning.","extra":""},"fr":{"tipo":"Jardin botanique au sommet des falaises.","horario":"Du 26 octobre au 31 décembre 2026 : du lundi au vendredi 10:00–15:00 ; samedi et dimanche 10:00–16:00. Jours fériés et reste de l'année : autres horaires, consultez le site.","consejo":"Entrée payante : achetez-la sur tickets.marimurtra.cat. Il existe un tarif de l'après-midi avec accès à partir de 14:00. En hiver, il ferme tôt : allez-y le matin.","extra":""},"sources":["https://marimurtra.cat/","https://marimurtra.cat/contacte/","https://whichmuseum.com/museum/marimurtra-botanical-garden-blanes-41299/opening-hours"]},{"id":"blanes-iconico-sa-palomera","town":"Blanes","cat":"iconico","name":"Roca de Sa Palomera","lat":41.670639,"lng":2.791829,"address":"Final del paseo marítimo de Blanes, 17300 Blanes","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Roca emblemática: inicio de la Costa Brava.","horario":"Acceso libre.","consejo":"Sube a lo alto de la roca para ver toda la bahía de Blanes. Al lado está el monumento Portal de la Costa Brava. Aparca fuera del centro y ve a pie por el paseo.","extra":""},"en":{"tipo":"Iconic rock marking the start of the Costa Brava.","horario":"Free access.","consejo":"Climb to the top of the rock for a view over the whole bay of Blanes. The Portal de la Costa Brava monument is right next to it. Park outside the centre and walk along the promenade.","extra":""},"fr":{"tipo":"Rocher emblématique : début de la Costa Brava.","horario":"Accès libre.","consejo":"Montez au sommet du rocher pour voir toute la baie de Blanes. Juste à côté se trouve le monument Portal de la Costa Brava. Garez-vous hors du centre et venez à pied par la promenade.","extra":""},"sources":["https://blanes.cat/docweb/esports.blanesairelliure","OpenStreetMap node/4324788642","OpenStreetMap node/492046757"]},{"id":"tordera-iconico-castell-valltordera","town":"Tordera","cat":"iconico","name":"Castell de Valltordera (Castell Medieval Comte de Valltordera)","lat":41.691605,"lng":2.71835,"address":"C/ de Vallmanya, s/n, 08490 Tordera","tel":"","web":"","guardia_url":"","season":"Abril–octubre (según operadores; 2026 no verificado)","es":{"tipo":"Castillo de estilo medieval con cena-espectáculo.","horario":"No se visita por libre: solo con la cena-espectáculo reservada. Según los operadores, de abril a octubre, miércoles y sábados (fechas de 2026 no verificadas).","consejo":"Es una construcción moderna de estilo medieval, no una fortaleza original. Lo especial es el espectáculo: torneo a caballo durante la cena, flamenco en el intermedio y baile con orquesta. Se reserva como excursión, normalmente con autocar desde Lloret, Blanes, Malgrat, Santa Susanna, Pineda o Calella.","extra":""},"en":{"tipo":"Medieval-style castle with a dinner show.","horario":"No independent visits: only with a booked dinner show. According to tour operators, April to October, Wednesdays and Saturdays (2026 dates not verified).","consejo":"It is a modern building in medieval style, not an original fortress. The draw is the show: a horseback tournament during dinner, flamenco in the interval and dancing to a live band. It is booked as an excursion, usually with a coach from Lloret, Blanes, Malgrat, Santa Susanna, Pineda or Calella.","extra":""},"fr":{"tipo":"Château de style médiéval avec dîner-spectacle.","horario":"Pas de visite libre : uniquement avec le dîner-spectacle réservé. Selon les voyagistes, d'avril à octobre, le mercredi et le samedi (dates 2026 non vérifiées).","consejo":"C'est une construction moderne de style médiéval, pas une forteresse d'origine. Le clou, c'est le spectacle : tournoi à cheval pendant le dîner, flamenco à l'entracte et bal avec orchestre. Il se réserve comme une excursion, généralement avec un autocar depuis Lloret, Blanes, Malgrat, Santa Susanna, Pineda ou Calella.","extra":""},"sources":["https://isango.com/lloret-de-mar/night-show-and-dinner-at-castle-of-valltordera_4992","https://www.komoot.com/guide/3819080/castles-around-tordera"]},{"id":"tordera-iconico-pont-de-ferro","town":"Tordera","cat":"iconico","name":"El Pont de Ferro","lat":41.702595,"lng":2.718443,"address":"C/ de Puigverd, junto a la iglesia, 08490 Tordera","tel":"93 764 37 17","web":"https://www.tordera.cat/tordera/turisme-i-patrimoni/llocs-dinteres/el-pont-de-ferro.html","guardia_url":"","season":"Todo el año","es":{"tipo":"Patrimonio local: la historia del puente sobre el río Tordera.","horario":"Acceso libre.","consejo":"Junto a la iglesia, en la C/ de Puigverd, un panel recuerda el histórico Pont de Ferro: inaugurado en 1897, una riada lo derribó ese mismo año; el segundo puente (1899) cayó en 1969 y no hubo uno nuevo hasta 2007. Paseo corto desde la Plaça de l'Església.","extra":""},"en":{"tipo":"Local heritage: the story of the bridge over the river Tordera.","horario":"Free access.","consejo":"Next to the church, on C/ de Puigverd, an information panel recalls the historic Pont de Ferro (Iron Bridge): opened in 1897, it was swept away by a flood that same year; the second bridge (1899) fell in 1969 and no new bridge was built until 2007. A short stroll from the Plaça de l'Església.","extra":""},"fr":{"tipo":"Patrimoine local : l'histoire du pont sur la rivière Tordera.","horario":"Accès libre.","consejo":"À côté de l'église, dans la C/ de Puigverd, un panneau rappelle l'histoire du Pont de Ferro (pont de fer) : inauguré en 1897, il fut emporté par une crue la même année ; le deuxième pont (1899) s'effondra en 1969 et il n'y eut pas de nouveau pont avant 2007. Petite promenade depuis la Plaça de l'Església.","extra":""},"sources":["https://www.tordera.cat/tordera/turisme-i-patrimoni/llocs-dinteres/el-pont-de-ferro.html","OpenStreetMap node/11255612237"]},{"id":"blanes-atardecer-castell-sant-joan","town":"Blanes","cat":"atardecer","name":"Castell de Sant Joan (mirador)","lat":41.678943,"lng":2.798305,"address":"Turó de Sant Joan, 17300 Blanes","tel":"","web":"https://blanes.cat/docweb/esports.blanesairelliure","guardia_url":"","season":"Todo el año","es":{"tipo":"Mirador elevado (173 m) para ver la puesta de sol.","horario":"Recinto exterior de acceso libre.","consejo":"La costa de Blanes mira al sureste, así que aquí el sol no se pone sobre el mar de enfrente: desde lo alto lo ves caer hacia el oeste, sobre la bahía, el delta de la Tordera y las sierras del interior. Sube a pie por el Itinerari C (1,3 km) y lleva linterna para bajar.","extra":""},"en":{"tipo":"Elevated viewpoint (173 m) for watching the sunset.","horario":"Outer grounds: free access.","consejo":"The Blanes coast faces south-east, so the sun does not set over the sea in front of you: from up here you watch it go down in the west, over the bay, the Tordera delta and the inland hills. Walk up via Itinerari C (1.3 km) and bring a torch for the way down.","extra":""},"fr":{"tipo":"Belvédère en hauteur (173 m) pour le coucher de soleil.","horario":"Enceinte extérieure en accès libre.","consejo":"La côte de Blanes est orientée au sud-est : le soleil ne se couche donc pas sur la mer en face. D'ici, vous le voyez descendre à l'ouest, au-dessus de la baie, du delta de la Tordera et des reliefs de l'intérieur. Montez à pied par l'Itinerari C (1,3 km) et prenez une lampe pour redescendre.","extra":""},"sources":["https://www.enciclopedia.cat/catalunya-romanica/castell-blanes","https://blanes.cat/docweb/esports.blanesairelliure","OpenStreetMap way/41817535"]},{"id":"blanes-ruta-itinerari-c-sant-joan","town":"Blanes","cat":"ruta","name":"Itinerari C: del mirador al Castell de Sant Joan","lat":null,"lng":null,"address":"Inicio: primer desvío a la izquierda del camino a la Cala de Sant Francesc, Blanes","tel":"","web":"https://blanes.cat/docweb/esports.blanesairelliure","guardia_url":"","season":"Todo el año","es":{"tipo":"Sendero corto municipal hasta el Castell de Sant Joan.","horario":"Acceso libre.","consejo":"Es el camino a pie para subir al castillo al atardecer. Empieza en el primer desvío a la izquierda del camino que lleva a la Cala de Sant Francesc. Calzado cómodo y linterna para bajar.","extra":"1,3 km (solo ida) · unos 25–30 min (estimado) · con subida"},"en":{"tipo":"Short municipal walking route up to the Castell de Sant Joan.","horario":"Free access.","consejo":"This is the footpath up to the castle for sunset. It starts at the first turning on the left off the path to the Cala de Sant Francesc. Wear comfortable shoes and bring a torch for the way down.","extra":"1.3 km (one way) · about 25–30 min (estimate) · uphill"},"fr":{"tipo":"Court itinéraire municipal jusqu'au Castell de Sant Joan.","horario":"Accès libre.","consejo":"C'est le chemin à pied pour monter au château au coucher du soleil. Il commence au premier embranchement à gauche du chemin qui mène à la Cala de Sant Francesc. Chaussures confortables et lampe pour redescendre.","extra":"1,3 km (aller simple) · environ 25–30 min (estimation) · en montée"},"sources":["https://blanes.cat/docweb/esports.blanesairelliure"]},{"id":"tordera-ruta-hortsavinya","town":"Tordera","cat":"ruta","name":"Hortsavinyà: Plaça de la Comarca, ermita de l'Erola y Turó de l'Hostal","lat":41.668497,"lng":2.629479,"address":"Inicio: Collet del Vent, junto al Centro de Información de Hortsavinyà (Parc del Montnegre i el Corredor), Tordera","tel":"93 764 37 17","web":"https://www.tordera.cat/tordera/turisme-i-patrimoni/itineraris/excursions-senyalitzades/hortsavinya-la-placa-de-la-comarca-lermita-de-lerola-i-el-turo-de-lhostal.html","guardia_url":"","season":"Todo el año","es":{"tipo":"Ruta corta señalizada en el Parc del Montnegre.","horario":"Acceso libre.","consejo":"Camino ancho, sombreado y casi llano, con dos repechos cortos. Desde el Turó de l'Hostal (+80 m) hay vistas al este y al oeste; en días claros se ven las Alberes y, en invierno, el Canigó. Lleva agua.","extra":"≈2 km · 45 min–1 h (estimado) · fácil, apta para todos"},"en":{"tipo":"Short waymarked walk in the Parc del Montnegre.","horario":"Free access.","consejo":"Wide, shaded, mostly flat track with two short steep stretches. From the Turó de l'Hostal (+80 m) there are views east and west; on clear days you can see the Alberes and, in winter, the Canigó. Take water.","extra":"≈2 km · 45 min–1 h (estimate) · easy, suitable for everyone"},"fr":{"tipo":"Courte balade balisée dans le Parc del Montnegre.","horario":"Accès libre.","consejo":"Chemin large, ombragé et presque plat, avec deux courtes montées raides. Depuis le Turó de l'Hostal (+80 m), vue à l'est et à l'ouest ; par temps clair on aperçoit les Alberes et, en hiver, le Canigó. Emportez de l'eau.","extra":"≈2 km · 45 min–1 h (estimation) · facile, pour tous"},"sources":["https://www.tordera.cat/tordera/turisme-i-patrimoni/itineraris/excursions-senyalitzades/hortsavinya-la-placa-de-la-comarca-lermita-de-lerola-i-el-turo-de-lhostal.html"]},{"id":"blanes-urgencias-hospital","town":"Blanes","cat":"urgencias","name":"Hospital de Blanes (Hospital Comarcal de la Selva)","lat":41.687335,"lng":2.802138,"address":"Accés Cala Sant Francesc, 5, 17300 Blanes","tel":"972 35 32 64 / Emergencias: 112","web":"https://salutms.cat/hospital-de-blanes/","guardia_url":"","season":"Todo el año","es":{"tipo":"Hospital con Urgencias 24 horas.","horario":"Urgencias 24 h, los 365 días.","consejo":"Las urgencias tienen una entrada propia, separada de la principal. Aparcamiento gratuito delante del hospital. Buses interurbanos 1 y 69 (Pujol) y 622 y 625 (Sagalés). Si no es urgente, llama al 061 (CatSalut Respon, 24 h).","extra":""},"en":{"tipo":"Hospital with 24-hour A&E.","horario":"A&E open 24 h, 365 days a year.","consejo":"A&E has its own entrance, separate from the main one. Free parking in front of the hospital. Intercity buses 1 and 69 (Pujol) and 622 and 625 (Sagalés). If it is not urgent, call 061 (CatSalut Respon, 24 h).","extra":""},"fr":{"tipo":"Hôpital avec urgences 24 h/24.","horario":"Urgences 24 h/24, 365 jours par an.","consejo":"Les urgences ont leur propre entrée, distincte de l'entrée principale. Parking gratuit devant l'hôpital. Bus interurbains 1 et 69 (Pujol) et 622 et 625 (Sagalés). Si ce n'est pas urgent, appelez le 061 (CatSalut Respon, 24 h/24).","extra":""},"sources":["https://salutms.cat/hospital-de-blanes/","https://salutms.cat/ciutadania/informacio/anar-a-urgencies-8/"]},{"id":"blanes-tren-estacio","town":"Blanes","cat":"tren","name":"Estació de Blanes (Rodalies R1)","lat":41.673336,"lng":2.769008,"address":"Av. de l'Estació, 17300 Blanes","tel":"","web":"https://rodalies.gencat.cat/ca/sobre-rodalies/linies-i-estacions/servei_rodalia_barcelona/r1/","guardia_url":"","season":"Todo el año","es":{"tipo":"Estación de tren Rodalies R1 (también paran regionales RG1).","horario":"Laborables: a Barcelona, primer tren 06:03 y último 21:53 (horario Renfe del 25/11/2026).","consejo":"La estación está a las afueras, a unos 2 km del centro y la playa (unos 25 min a pie). Mira el horario del día en la web o la app de Rodalies/Renfe antes de salir.","extra":"Destinos directos: Mataró (37 min), Barcelona-Plaça de Catalunya (1 h 20 min), Barcelona-Sants (1 h 25 min), Tordera (5 min), Maçanet-Massanes (14 min, enlace hacia Girona). Frecuencia: a Barcelona, cada 30 min en laborables; hacia Maçanet, 1 tren por hora."},"en":{"tipo":"Rodalies R1 railway station (RG1 regional trains also stop).","horario":"Weekdays: to Barcelona, first train 06:03 and last 21:53 (Renfe timetable for 25/11/2026).","consejo":"The station is on the outskirts, about 2 km from the centre and the beach (around 25 min on foot). Check the day's timetable on the Rodalies/Renfe website or app before you set off.","extra":"Direct destinations: Mataró (37 min), Barcelona-Plaça de Catalunya (1 h 20 min), Barcelona-Sants (1 h 25 min), Tordera (5 min), Maçanet-Massanes (14 min, connection towards Girona). Frequency: to Barcelona, every 30 min on weekdays; towards Maçanet, 1 train an hour."},"fr":{"tipo":"Gare Rodalies R1 (les trains régionaux RG1 s'y arrêtent aussi).","horario":"En semaine : vers Barcelone, premier train à 06:03 et dernier à 21:53 (horaires Renfe du 25/11/2026).","consejo":"La gare est en périphérie, à environ 2 km du centre et de la plage (environ 25 min à pied). Consultez les horaires du jour sur le site ou l'appli Rodalies/Renfe avant de partir.","extra":"Destinations directes : Mataró (37 min), Barcelona-Plaça de Catalunya (1 h 20 min), Barcelona-Sants (1 h 25 min), Tordera (5 min), Maçanet-Massanes (14 min, correspondance vers Girona). Fréquence : vers Barcelone, toutes les 30 min en semaine ; vers Maçanet, 1 train par heure."},"sources":["https://horarios.renfe.com/cer/hjcer310.jsp?nucleo=50&i=s&cp=NO&o=79606&d=78805&df=20261125&ho=00&hd=26&TXTInfo=","https://horarios.renfe.com/cer/hjcer310.jsp?nucleo=50&i=s&cp=NO&o=79606&d=79200&df=20261125&ho=00&hd=26&TXTInfo=","https://rodalies.gencat.cat/ca/sobre-rodalies/linies-i-estacions/servei_rodalia_barcelona/r1/","https://rodalies.gencat.cat/ca/sobre-rodalies/linies-i-estacions/servei_regionals/rg1/"]},{"id":"tordera-tren-estacio","town":"Tordera","cat":"tren","name":"Estació de Tordera (Rodalies R1)","lat":41.707079,"lng":2.719574,"address":"Sant Pere, 08490 Tordera","tel":"","web":"https://rodalies.gencat.cat/ca/sobre-rodalies/linies-i-estacions/servei_rodalia_barcelona/r1/","guardia_url":"","season":"Todo el año","es":{"tipo":"Estación de tren Rodalies R1.","horario":"Laborables: a Barcelona, primer tren 06:16 y último 21:16 (horario Renfe del 25/11/2026).","consejo":"Pasan pocos trenes: mira la hora del siguiente antes de ir. La estación está a unos 600 m al norte del centro; justo al lado está la gasolinera 24 h La Farinera.","extra":"Destinos directos: Blanes (5 min), Mataró (44 min), Barcelona-Plaça de Catalunya (1 h 27 min), Maçanet-Massanes (9 min). Frecuencia: alrededor de 1 tren por hora en cada sentido."},"en":{"tipo":"Rodalies R1 railway station.","horario":"Weekdays: to Barcelona, first train 06:16 and last 21:16 (Renfe timetable for 25/11/2026).","consejo":"Trains are infrequent: check when the next one leaves before you go. The station is about 600 m north of the centre; the 24-hour La Farinera petrol station is right next to it.","extra":"Direct destinations: Blanes (5 min), Mataró (44 min), Barcelona-Plaça de Catalunya (1 h 27 min), Maçanet-Massanes (9 min). Frequency: about 1 train an hour in each direction."},"fr":{"tipo":"Gare Rodalies R1.","horario":"En semaine : vers Barcelone, premier train à 06:16 et dernier à 21:16 (horaires Renfe du 25/11/2026).","consejo":"Les trains sont peu fréquents : vérifiez l'heure du prochain avant de partir. La gare est à environ 600 m au nord du centre ; la station-service 24 h/24 La Farinera est juste à côté.","extra":"Destinations directes : Blanes (5 min), Mataró (44 min), Barcelona-Plaça de Catalunya (1 h 27 min), Maçanet-Massanes (9 min). Fréquence : environ 1 train par heure dans chaque sens."},"sources":["https://horarios.renfe.com/cer/hjcer310.jsp?nucleo=50&i=s&cp=NO&o=79607&d=78805&df=20261125&ho=00&hd=26&TXTInfo=","https://horarios.renfe.com/cer/hjcer310.jsp?nucleo=50&i=s&cp=NO&o=79607&d=79200&df=20261125&ho=00&hd=26&TXTInfo="]},{"id":"calella-farmacia-farmacia-noe","town":"Calella","cat":"farmacia","name":"Farmàcia Noé","lat":41.614404,"lng":2.661337,"address":"Carrer de l'Església, 116, 08370 Calella","tel":"937 690 791","web":"","guardia_url":"https://www.farmaguia.net","season":"Todo el año","es":{"tipo":"Farmacia de referencia en el centro (la farmacia de guardia cambia cada día).","horario":"Horario no verificado. Consulta en Farmaguia (Col·legi de Farmacèutics de Barcelona) qué farmacias están abiertas ahora y cuál está de guardia.","consejo":"Está en la calle peatonal de l'Església, en pleno centro. De noche o en festivo, abre Farmaguia, busca Calella y ve a la farmacia que aparezca como abierta.","extra":"En Calella hay 6 farmacias. Para una urgencia médica, el Hospital de Calella atiende 24 h."},"en":{"tipo":"Central reference pharmacy (the duty pharmacy changes every day).","horario":"Opening hours not verified. Check Farmaguia (Barcelona College of Pharmacists) to see which pharmacies are open now and which one is on duty.","consejo":"It's on the pedestrianised Carrer de l'Església, right in the centre. At night or on a public holiday, open Farmaguia, search for Calella and go to the pharmacy shown as open.","extra":"Calella has 6 pharmacies. For a medical emergency, Hospital de Calella is open 24 hours."},"fr":{"tipo":"Pharmacie de référence en centre-ville (la pharmacie de garde change chaque jour).","horario":"Horaires non vérifiés. Consultez Farmaguia (Ordre des pharmaciens de Barcelone) pour savoir quelles pharmacies sont ouvertes et laquelle est de garde.","consejo":"Elle se trouve dans la rue piétonne Carrer de l'Església, en plein centre. La nuit ou un jour férié, ouvrez Farmaguia, cherchez Calella et rendez-vous à la pharmacie indiquée comme ouverte.","extra":"Calella compte 6 pharmacies. En cas d'urgence médicale, l'Hospital de Calella est ouvert 24 h/24."},"sources":["https://analisi.transparenciacatalunya.cat/resource/nrmq-ytje.json?tipus_establiment_codi=F&municipi_nom=CALELLA","https://www.farmaguia.net/desktop/","https://www.cofb.org/ca/que-oferim/ciutadans/farmacies-obertes/"]},{"id":"calella-super-tarde-mercadona-riera-capaspre","town":"Calella","cat":"super_tarde","name":"Mercadona Calella","lat":41.614894,"lng":2.652141,"address":"Av. de la Riera de Capaspre, 08370 Calella","tel":"938 235 977","web":"https://info.mercadona.es/es/supermercados","guardia_url":"","season":"Todo el año (en verano el horario puede ampliarse)","es":{"tipo":"Supermercado para la compra grande.","horario":"Lunes a sábado de 09:00 a 21:00. Domingos y festivos, cerrado. (Horario de noviembre de 2026.)","consejo":"Tiene parking para clientes. Es la opción más completa para la compra del primer día; cierra a las 21:00, así que no lo dejes para el último momento. Si llegas en domingo, el Bonpreu de Calella abre por la mañana.","extra":""},"en":{"tipo":"Supermarket for a big shop.","horario":"Monday to Saturday 09:00 to 21:00. Closed on Sundays and public holidays. (Hours as of November 2026.)","consejo":"It has customer parking. It's the most complete option for your first-day shop; it closes at 21:00, so don't leave it to the last minute. If you arrive on a Sunday, the Bonpreu in Calella opens in the morning.","extra":""},"fr":{"tipo":"Supermarché pour les grosses courses.","horario":"Du lundi au samedi de 09:00 à 21:00. Fermé le dimanche et les jours fériés. (Horaires de novembre 2026.)","consejo":"Parking clients. C'est l'option la plus complète pour les courses du premier jour ; il ferme à 21:00, ne vous y prenez pas au dernier moment. Si vous arrivez un dimanche, le Bonpreu de Calella ouvre le matin.","extra":""},"sources":["https://info.mercadona.es/es/supermercados?s=Calella.%20Barcelona"]},{"id":"calella-super-tarde-bonpreu-bruguera","town":"Calella","cat":"super_tarde","name":"Bonpreu Calella","lat":41.616122,"lng":2.664031,"address":"C. Bruguera, 205, 08370 Calella","tel":"938 253 127","web":"https://www.bonpreuesclat.cat/ca/bonpreu-calella","guardia_url":"","season":"Todo el año","es":{"tipo":"Supermercado mediano: compras del día y domingos por la mañana.","horario":"Lunes a sábado de 09:00 a 21:00. Domingos y festivos de 09:00 a 14:30 en las fechas que publica su web (confírmalo allí).","consejo":"Es la opción para el domingo por la mañana, cuando Mercadona cierra. Está a unos 300 m de la estación, en el lado norte del centro. No tiene parking propio.","extra":""},"en":{"tipo":"Mid-sized supermarket: everyday shopping and Sunday mornings.","horario":"Monday to Saturday 09:00 to 21:00. Sundays and public holidays 09:00 to 14:30 on the dates listed on its website (check there).","consejo":"This is your option on a Sunday morning, when Mercadona is closed. It's about 300 m from the station, on the north side of the centre. No car park of its own.","extra":""},"fr":{"tipo":"Supermarché de taille moyenne : courses du quotidien et dimanche matin.","horario":"Du lundi au samedi de 09:00 à 21:00. Dimanches et jours fériés de 09:00 à 14:30 aux dates publiées sur son site (vérifiez-le).","consejo":"C'est la solution du dimanche matin, quand Mercadona est fermé. À environ 300 m de la gare, côté nord du centre. Pas de parking propre.","extra":""},"sources":["https://www.bonpreuesclat.cat/ca/bonpreu-calella","https://www.bonpreuesclat.cat/ca/cercador-d-establiments"]},{"id":"calella-mercadillo-mercat-setmanal-dissabte","town":"Calella","cat":"mercadillo","name":"Mercado semanal de los sábados","lat":41.616134,"lng":2.660221,"address":"Junto al Mercat Municipal (Pl. 1 d'Octubre de 2017, C. de Sant Jaume), 08370 Calella","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Mercadillo semanal: fruta, especias, salazones y ropa.","horario":"Sábados de 08:00 a 14:00 (según mercadillos.org; el Ajuntament no publica el horario).","consejo":"Tiene unos 70 puestos alrededor del mercado municipal cubierto, que el sábado también abre (de 06:00 a 16:00). Ve a primera hora y, si quieres asegurarte, pregunta en la Oficina de Turisme.","extra":"Lugar: alrededor del Mercat Municipal, junto a la parada de bus Sant Jaume-Mercat."},"en":{"tipo":"Weekly street market: fruit, spices, salted fish and clothes.","horario":"Saturdays 08:00 to 14:00 (according to mercadillos.org; the town hall does not publish the times).","consejo":"Around 70 stalls surround the covered municipal market, which is also open on Saturdays (06:00 to 16:00). Go early, and if you want to be sure, ask at the Tourist Office.","extra":"Where: around the Mercat Municipal, by the Sant Jaume-Mercat bus stop."},"fr":{"tipo":"Marché hebdomadaire : fruits, épices, salaisons et vêtements.","horario":"Le samedi de 08:00 à 14:00 (selon mercadillos.org ; la mairie ne publie pas les horaires).","consejo":"Environ 70 étals autour du marché municipal couvert, lui aussi ouvert le samedi (de 06:00 à 16:00). Venez tôt et, pour en être sûr, renseignez-vous à l'Office de tourisme.","extra":"Lieu : autour du Mercat Municipal, près de l'arrêt de bus Sant Jaume-Mercat."},"sources":["https://mercadillos.org/es/calella/mercadillo-calella","https://www.calella.cat/ajuntament-seu-electronica/govern-municipal/arees/area-de-promocio-economica-comerc-i-consum.html","https://www.calella.cat/ciutat/guia-del-municipi/equipaments/mercat-municipal.html"]},{"id":"calella-bar-nui-beach","town":"Calella","cat":"bar","name":"Nui Beach","lat":41.614982,"lng":2.670279,"address":"Platja Gran de Calella","tel":"+34 646 905 567","web":"https://nuibeachcalella.com","guardia_url":"","season":"Todo el año","es":{"tipo":"Chiringuito-restaurante sobre la arena: tumbonas, cócteles, tapas y terraza.","horario":"Todos los días de 08:00 a 01:00, según Turisme de Calella. Abre todo el año; en invierno llama antes para confirmar el horario.","consejo":"Ven al final de la tarde y pide un cóctel en la zona lounge: desde aquí el sol se pone detrás del faro de Calella. Para reservar mesa: +34 646 905 567.","extra":""},"en":{"tipo":"Beach bar-restaurant right on the sand: loungers, cocktails, tapas and a terrace.","horario":"Daily 08:00 to 01:00, according to Calella Tourism. Open all year; in winter, ring ahead to check the hours.","consejo":"Come in the late afternoon and order a cocktail in the lounge area: from here the sun sets behind Calella lighthouse. To book a table: +34 646 905 567.","extra":""},"fr":{"tipo":"Restaurant de plage les pieds dans le sable : transats, cocktails, tapas et terrasse.","horario":"Tous les jours de 08:00 à 01:00, selon l'office de tourisme de Calella. Ouvert toute l'année ; en hiver, appelez avant pour vérifier les horaires.","consejo":"Venez en fin d'après-midi et commandez un cocktail dans l'espace lounge : d'ici, le soleil se couche derrière le phare de Calella. Réservations : +34 646 905 567.","extra":""},"sources":["https://www.calellabarcelona.com/planifica/on-menjar/guinguetes-platja/","http://www.calellabarcelona.com/planifica/on-menjar/guinguetes-platja/Nui-Beach/","https://pc.nuibeachcalella.com/"]},{"id":"calella-bar-bodega-azor","town":"Calella","cat":"bar","name":"Bodega Azor","lat":41.613776,"lng":2.659578,"address":"C. de les Creus, 37, 08370 Calella","tel":"93 769 06 59","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Bodega de vinos y tapas en el casco antiguo, ambiente tranquilo y acogedor.","horario":"Todos los días de 19:30 a 00:30, excepto los miércoles (cerrado).","consejo":"Solo abre por la noche. Buen plan para tomar vino con tapas sin gastar mucho (10-20 € por persona según Turisme de Calella). Llega pronto si quieres mesa.","extra":""},"en":{"tipo":"Wine and tapas bodega in the old town, with a quiet, cosy feel.","horario":"Daily 19:30 to 00:30, except Wednesdays (closed).","consejo":"Evenings only. A good, inexpensive plan for wine and tapas (€10-20 per person, according to Calella Tourism). Arrive early if you want a table.","extra":""},"fr":{"tipo":"Bodega à vins et tapas dans la vieille ville, ambiance calme et chaleureuse.","horario":"Tous les jours de 19:30 à 00:30, sauf le mercredi (fermé).","consejo":"Ouvert uniquement le soir. Une bonne adresse pour du vin et des tapas sans se ruiner (10-20 € par personne selon l'office de tourisme de Calella). Arrivez tôt pour avoir une table.","extra":""},"sources":["https://www.calellabarcelona.com/planifica/on-menjar/tapes-i-tavernes/"]},{"id":"calella-comer-el-hogar-gallego","town":"Calella","cat":"comer","name":"El Hogar Gallego","lat":41.616123,"lng":2.662882,"address":"Carrer de les Ànimes, 73-75, 08370 Calella","tel":"+34 937 66 20 27","web":"https://elhogargallego.cat","guardia_url":"","season":"Todo el año","es":{"tipo":"Marisquería clásica: pescado y marisco del Atlántico y del Mediterráneo.","horario":"Martes y miércoles de 09:00 a 16:00. Jueves a sábado de 09:00 a 16:00 y de 20:00 a 22:30. Domingo de 09:00 a 16:00. Lunes cerrado. Desde el 17 de junio también abre martes y miércoles por la noche.","consejo":"Tiene parking privado. Es un sitio para darse un homenaje (unos 60 € por persona sin bebidas, según Macarfi): reserva por teléfono y elige el pescado o el marisco del día, que se expone en la sala.","extra":"Seleccionado en la Guía Michelin, que lo define como «un clásico»."},"en":{"tipo":"Classic seafood restaurant: fish and shellfish from the Atlantic and the Mediterranean.","horario":"Tuesday and Wednesday 09:00 to 16:00. Thursday to Saturday 09:00 to 16:00 and 20:00 to 22:30. Sunday 09:00 to 16:00. Closed Monday. From 17 June it also opens on Tuesday and Wednesday evenings.","consejo":"It has private parking. This is a place for a treat (around €60 per person without drinks, according to Macarfi): book by phone and choose the catch of the day, which is displayed in the dining room.","extra":"Listed in the Michelin Guide, which calls it 'a classic'."},"fr":{"tipo":"Restaurant de fruits de mer classique : poissons et fruits de mer de l'Atlantique et de la Méditerranée.","horario":"Mardi et mercredi de 09:00 à 16:00. Du jeudi au samedi de 09:00 à 16:00 et de 20:00 à 22:30. Dimanche de 09:00 à 16:00. Fermé le lundi. À partir du 17 juin, ouvert aussi le mardi et le mercredi soir.","consejo":"Parking privé. C'est une adresse pour se faire plaisir (environ 60 € par personne hors boissons, selon Macarfi) : réservez par téléphone et choisissez le poisson ou les fruits de mer du jour, exposés en salle.","extra":"Sélectionné par le Guide Michelin, qui le qualifie de « classique »."},"sources":["https://elhogargallego.cat","https://guide.michelin.com/es/es/catalunya/calella/restaurante/el-hogar-gallego","https://macarfi.com/en/bcn/restaurant-card/el-hogar-gallego","https://www.calellabarcelona.com/planifica/on-menjar/peix-i-marisc/"]},{"id":"calella-iconico-far-de-calella","town":"Calella","cat":"iconico","name":"Far de Calella (Centre d'Interpretació)","lat":41.60818,"lng":2.646317,"address":"Carretera N-II, km 666, 08370 Calella","tel":"937 695 102","web":"https://www.calella.cat/ciutat/guia-del-municipi/equipaments/centre-dinterpretacio-del-far-de-calella.html","guardia_url":"","season":"Todo el año (horario de invierno y de verano)","es":{"tipo":"Faro con centro de interpretación y mirador.","horario":"Del 1 de octubre al 30 de junio: sábados, domingos y festivos de 10:00 a 14:00. Del 1 de julio al 30 de septiembre: martes a domingo y festivos de 17:00 a 21:00. Cerrado el 1 de enero y el 25 y 26 de diciembre.","consejo":"Entrada 2 € (reducida 1 €), gratis el primer domingo de cada mes y para menores de 16 años. Desde fuera hay un mirador excelente sobre Calella, el mar y el Montnegre. La entrada combinada con el Museu del Turisme, el Museu-Arxiu y el refugio antiaéreo cuesta 3,50 €.","extra":""},"en":{"tipo":"Lighthouse with an interpretation centre and viewpoint.","horario":"1 October to 30 June: Saturdays, Sundays and public holidays 10:00 to 14:00. 1 July to 30 September: Tuesday to Sunday and public holidays 17:00 to 21:00. Closed 1 January and 25 and 26 December.","consejo":"Admission €2 (reduced €1); free on the first Sunday of every month and for under-16s. Outside there's an excellent viewpoint over Calella, the sea and the Montnegre hills. A combined ticket with the Museu del Turisme, the Museu-Arxiu and the air-raid shelter costs €3.50.","extra":""},"fr":{"tipo":"Phare avec centre d'interprétation et belvédère.","horario":"Du 1er octobre au 30 juin : samedis, dimanches et jours fériés de 10:00 à 14:00. Du 1er juillet au 30 septembre : du mardi au dimanche et jours fériés de 17:00 à 21:00. Fermé le 1er janvier et les 25 et 26 décembre.","consejo":"Entrée 2 € (réduit 1 €), gratuite le premier dimanche du mois et pour les moins de 16 ans. À l'extérieur, un superbe belvédère sur Calella, la mer et le massif du Montnegre. Le billet combiné avec le Museu del Turisme, le Museu-Arxiu et l'abri antiaérien coûte 3,50 €.","extra":""},"sources":["https://www.calella.cat/ciutat/guia-del-municipi/equipaments/centre-dinterpretacio-del-far-de-calella.html","https://www.calella.cat/temes/museus-de-calella/planifica-la-teva-visita"]},{"id":"calella-iconico-museu-del-turisme","town":"Calella","cat":"iconico","name":"Museu del Turisme (MUTUR)","lat":41.617198,"lng":2.661398,"address":"C. Sant Pere, 122-140, 08370 Calella","tel":"937 695 102","web":"https://www.calella.cat/ciutat/guia-del-municipi/equipaments/museu-del-turisme.html","guardia_url":"","season":"Todo el año","es":{"tipo":"Museo sobre la historia del turismo, en la antigua fábrica Llobet-Guri (1930).","horario":"Del 15 de octubre al 30 de abril: sábado de 17:00 a 20:00; domingo y festivos de 11:00 a 18:00. Del 1 de mayo al 14 de octubre: martes a sábado de 17:00 a 21:00; domingo y festivos de 11:00 a 14:00 y de 17:00 a 21:00. Cerrado el 1 de enero y el 25 y 26 de diciembre.","consejo":"Entrada 2 € (reducida 1 €), o 3,50 € con la entrada combinada (Far, Museu-Arxiu y refugio antiaéreo). Gratis el primer domingo de cada mes. Buen plan para un fin de semana de lluvia en invierno.","extra":""},"en":{"tipo":"Museum of the history of tourism, in the former Llobet-Guri factory (1930).","horario":"15 October to 30 April: Saturday 17:00 to 20:00; Sunday and public holidays 11:00 to 18:00. 1 May to 14 October: Tuesday to Saturday 17:00 to 21:00; Sunday and public holidays 11:00 to 14:00 and 17:00 to 21:00. Closed 1 January and 25 and 26 December.","consejo":"Admission €2 (reduced €1), or €3.50 with the combined ticket (lighthouse, Museu-Arxiu and air-raid shelter). Free on the first Sunday of every month. A good plan for a rainy winter weekend.","extra":""},"fr":{"tipo":"Musée de l'histoire du tourisme, dans l'ancienne usine Llobet-Guri (1930).","horario":"Du 15 octobre au 30 avril : samedi de 17:00 à 20:00 ; dimanche et jours fériés de 11:00 à 18:00. Du 1er mai au 14 octobre : du mardi au samedi de 17:00 à 21:00 ; dimanche et jours fériés de 11:00 à 14:00 et de 17:00 à 21:00. Fermé le 1er janvier et les 25 et 26 décembre.","consejo":"Entrée 2 € (réduit 1 €), ou 3,50 € avec le billet combiné (phare, Museu-Arxiu et abri antiaérien). Gratuit le premier dimanche du mois. Une bonne idée pour un week-end pluvieux en hiver.","extra":""},"sources":["https://www.calella.cat/ciutat/guia-del-municipi/equipaments/museu-del-turisme.html","https://www.calella.cat/temes/museus-de-calella/planifica-la-teva-visita"]},{"id":"calella-atardecer-les-torretes","town":"Calella","cat":"atardecer","name":"Mirador de Les Torretes","lat":41.607842,"lng":2.641913,"address":"Les Torretes, junto al Far de Calella (N-II, km 666)","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Mirador sobre el acantilado, junto a las torres de telegrafía óptica.","horario":"Exterior, acceso libre.","consejo":"La costa mira al sureste: aquí no verás el sol caer en el mar, pero sí la luz del atardecer sobre Calella, Sant Pol y el Montnegre. Puedes subir a pie desde la playa por la Ruta del Corb Marí (señales azules).","extra":"Ruta del Corb Marí: 3 km · 1 h 30 min · dificultad baja-media · sale del puente de madera de la Riera Capaspre."},"en":{"tipo":"Clifftop viewpoint beside the old optical telegraph towers.","horario":"Outdoors, free access.","consejo":"The coast faces south-east, so you won't see the sun drop into the sea here, but you will see the evening light over Calella, Sant Pol and the Montnegre hills. You can walk up from the beach on the Ruta del Corb Marí (blue waymarks).","extra":"Ruta del Corb Marí: 3 km · 1 h 30 min · easy to moderate · starts at the wooden footbridge over the Riera Capaspre."},"fr":{"tipo":"Belvédère sur la falaise, à côté des tours de télégraphie optique.","horario":"En plein air, accès libre.","consejo":"La côte est orientée au sud-est : vous ne verrez pas le soleil plonger dans la mer, mais la lumière du couchant sur Calella, Sant Pol et le Montnegre. Vous pouvez monter à pied depuis la plage par la Ruta del Corb Marí (balisage bleu).","extra":"Ruta del Corb Marí : 3 km · 1 h 30 · facile à moyenne · départ de la passerelle en bois de la Riera Capaspre."},"sources":["https://www.calella.cat/ciutat/guia-del-municipi/equipaments/centre-dinterpretacio-del-far-de-calella.html","https://femturisme.cat/es/rutas/ruta-del-cormoran-por-calella"]},{"id":"calella-ruta-ruta-de-la-guilla","town":"Calella","cat":"ruta","name":"Ruta de la Guilla","lat":41.611287,"lng":2.655108,"address":"Salida: puente de madera de la Riera Capaspre, Calella","tel":"","web":"https://femturisme.cat/es/rutas/ruta-del-zorro-por-calella","guardia_url":"","season":"Todo el año","es":{"tipo":"Ruta de naturaleza señalizada (amarillo) por la Serra de les Guilles.","horario":"Siempre accesible; hazla con luz de día.","consejo":"Sale del puente de madera de la Riera Capaspre, junto al mar. Sigue el Passeig de Garbí, cruza la N-II por un paso inferior, pasa bajo el puente de la C-32 y sube al Coll de l'Era de Mora entre alcornoques y brezos. Descarga el GPX antes de salir.","extra":"10 km · 2 h 30 min · dificultad media-alta · circular"},"en":{"tipo":"Waymarked nature trail (yellow) through the Serra de les Guilles.","horario":"Always open; walk it in daylight.","consejo":"It starts at the wooden footbridge over the Riera Capaspre, by the sea. Follow the Passeig de Garbí, cross under the N-II through an underpass, go beneath the C-32 motorway bridge and climb to the Coll de l'Era de Mora through cork oaks and heather. Download the GPX before you set off.","extra":"10 km · 2 h 30 min · moderate to hard · circular"},"fr":{"tipo":"Sentier nature balisé (jaune) dans la Serra de les Guilles.","horario":"Toujours accessible ; à faire de jour.","consejo":"Départ de la passerelle en bois de la Riera Capaspre, au bord de la mer. Suivez le Passeig de Garbí, passez sous la N-II par un passage souterrain, puis sous le pont de la C-32, et montez au Coll de l'Era de Mora entre chênes-lièges et bruyères. Téléchargez le GPX avant de partir.","extra":"10 km · 2 h 30 · difficulté moyenne à élevée · circulaire"},"sources":["https://femturisme.cat/es/rutas/ruta-del-zorro-por-calella","https://femturisme.cat/mapes/rutes/tracks/ruta-de-la-guilla.gpx","https://www.calellabarcelona.com/planifica/que-fer/rutes-de-natura/"]},{"id":"calella-urgencias-hospital-de-calella","town":"Calella","cat":"urgencias","name":"Hospital de Calella (Hospital Comarcal Sant Jaume)","lat":41.615166,"lng":2.657216,"address":"C. Sant Jaume, 209-219, 08370 Calella","tel":"93 769 02 01 / Emergencias: 112","web":"https://salutms.cat/corporacio/els-nostres-centres/hospital-de-calella-2/","guardia_url":"","season":"Todo el año","es":{"tipo":"Hospital con Urgencias 24 horas (también atiende a Sant Pol de Mar).","horario":"Urgencias 24 horas, 365 días.","consejo":"Urgencias tiene entrada propia, distinta de la principal, con una parada de taxis al lado. Delante hay zona azul y parking de pago. Si no es grave, llama al 061 (CatSalut Respon, 24 h).","extra":""},"en":{"tipo":"Hospital with a 24-hour A&E department (it also covers Sant Pol de Mar).","horario":"A&E open 24 hours, 365 days a year.","consejo":"A&E has its own entrance, separate from the main one, with a taxi rank next to it. In front there's blue-zone street parking and a pay car park. If it isn't serious, call 061 (CatSalut Respon, 24 h).","extra":""},"fr":{"tipo":"Hôpital avec service des urgences 24 h/24 (il dessert aussi Sant Pol de Mar).","horario":"Urgences 24 h/24, 365 jours par an.","consejo":"Les urgences ont leur propre entrée, distincte de l'entrée principale, avec une station de taxis à côté. Devant l'hôpital : stationnement en zone bleue et parking payant. Si ce n'est pas grave, appelez le 061 (CatSalut Respon, 24 h/24).","extra":""},"sources":["https://salutms.cat/corporacio/els-nostres-centres/hospital-de-calella-2/","https://salutms.cat/ciutadania/informacio/anar-a-urgencies-8/","https://governobert.santpol.cat/ARXIUS/antics/adjunts/informacio_recursos_medics.pdf"]},{"id":"calella-tren-estacio-calella","town":"Calella","cat":"tren","name":"Estación de Calella (Rodalies R1)","lat":41.614708,"lng":2.666574,"address":"Estació de Calella, junto a la Platja Gran","tel":"","web":"https://rodalies.gencat.cat/ca/sobre-rodalies/linies-i-estacions/servei_rodalia_barcelona/r1/","guardia_url":"","season":"Todo el año","es":{"tipo":"Estación de tren Rodalies R1.","horario":"","consejo":"Desde el 29/09/2026 algunos trenes de la R1 terminan en Mataró: mira el destino en la pantalla antes de subir. Los fines de semana el horario cambia.","extra":"Destinos directos: Barcelona-Pl. Catalunya (1 h 08 min), Barcelona-Sants (1 h 13 min), Mataró (25 min), Blanes (15 min); Girona con la línea RG1. Frecuencia: un tren cada 30 min aprox. en día laborable (más en hora punta)."},"en":{"tipo":"Rodalies R1 railway station.","horario":"","consejo":"Since 29/09/2026 some R1 trains terminate at Mataró, so check the destination on the screen before boarding. The timetable is different at weekends.","extra":"Direct trains: Barcelona-Pl. Catalunya (1 h 08 min), Barcelona-Sants (1 h 13 min), Mataró (25 min), Blanes (15 min); Girona on the RG1 line. Frequency: roughly one train every 30 min on weekdays (more at peak times)."},"fr":{"tipo":"Gare Rodalies R1.","horario":"","consejo":"Depuis le 29/09/2026, certains trains de la R1 s'arrêtent à Mataró : vérifiez la destination sur l'écran avant de monter. Les horaires changent le week-end.","extra":"Trains directs : Barcelona-Pl. Catalunya (1 h 08 min), Barcelona-Sants (1 h 13 min), Mataró (25 min), Blanes (15 min) ; Girona avec la ligne RG1. Fréquence : environ un train toutes les 30 min en semaine (plus aux heures de pointe)."},"sources":["https://rodalies.gencat.cat/web/.content/02_Horaris/horaris/R1.pdf","https://rodalies.gencat.cat/ca/sobre-rodalies/linies-i-estacions/servei_rodalia_barcelona/r1/","https://www.calellabarcelona.com/faqs/"]},{"id":"sant-pol-de-mar-farmacia-lapoteca-alegre","town":"Sant Pol de Mar","cat":"farmacia","name":"Farmàcia L'Apoteca Alegre (Alegre Ribalta)","lat":41.603213,"lng":2.625631,"address":"C. Pau Simó, 30-32, 08395 Sant Pol de Mar","tel":"937 601 241","web":"","guardia_url":"https://www.farmaguia.net","season":"Todo el año","es":{"tipo":"Farmacia de referencia (la farmacia de guardia cambia cada día).","horario":"Horario no verificado. Consulta en Farmaguia (Col·legi de Farmacèutics de Barcelona) qué farmacias están abiertas ahora y cuál está de guardia.","consejo":"Está a unos 3 min a pie de la estación. Si la encuentras cerrada, mira en Farmaguia qué farmacia de la zona está abierta o de guardia antes de coger el coche.","extra":"En Sant Pol hay 2 farmacias; la otra está en el C. Nou, 37."},"en":{"tipo":"Reference pharmacy (the duty pharmacy changes every day).","horario":"Opening hours not verified. Check Farmaguia (Barcelona College of Pharmacists) to see which pharmacies are open now and which one is on duty.","consejo":"It's about a 3-minute walk from the station. If it's closed, check Farmaguia for an open or duty pharmacy nearby before you get in the car.","extra":"Sant Pol has 2 pharmacies; the other one is at C. Nou, 37."},"fr":{"tipo":"Pharmacie de référence (la pharmacie de garde change chaque jour).","horario":"Horaires non vérifiés. Consultez Farmaguia (Ordre des pharmaciens de Barcelone) pour savoir quelles pharmacies sont ouvertes et laquelle est de garde.","consejo":"Elle est à environ 3 min à pied de la gare. Si elle est fermée, regardez sur Farmaguia quelle pharmacie des environs est ouverte ou de garde avant de prendre la voiture.","extra":"Sant Pol compte 2 pharmacies ; l'autre se trouve C. Nou, 37."},"sources":["https://analisi.transparenciacatalunya.cat/resource/nrmq-ytje.json?tipus_establiment_codi=F&municipi_nom=SANT%20POL%20DE%20MAR","https://governobert.santpol.cat/ARXIUS/antics/adjunts/informacio_recursos_medics.pdf","https://www.farmaguia.net/desktop/"]},{"id":"sant-pol-de-mar-super-tarde-sorli","town":"Sant Pol de Mar","cat":"super_tarde","name":"Sorli Sant Pol de Mar","lat":41.604706,"lng":2.623385,"address":"C. de la Sénia, 1, 08395 Sant Pol de Mar","tel":"935 610 371","web":"https://www.sorli.com/ca/stores/sant-pol/","guardia_url":"","season":"Todo el año","es":{"tipo":"Supermercado mediano con carnicería, pescadería y panadería.","horario":"Lunes a sábado de 09:00 a 21:00, según la web de Sorli. Domingo: no publicado.","consejo":"Está en la parte alta del pueblo, a unos 5 min a pie de la estación (cuesta arriba). Según Sorli, tiene parking.","extra":""},"en":{"tipo":"Mid-sized supermarket with butcher, fishmonger and bakery counters.","horario":"Monday to Saturday 09:00 to 21:00, according to Sorli's website. Sunday: not published.","consejo":"It's in the upper part of the village, about a 5-minute (uphill) walk from the station. According to Sorli, it has a car park.","extra":""},"fr":{"tipo":"Supermarché de taille moyenne avec boucherie, poissonnerie et boulangerie.","horario":"Du lundi au samedi de 09:00 à 21:00, selon le site de Sorli. Dimanche : non communiqué.","consejo":"Il se trouve dans le haut du village, à environ 5 min à pied de la gare (en montée). Selon Sorli, il dispose d'un parking.","extra":""},"sources":["https://www.sorli.com/ca/stores/sant-pol/","https://www.sorli.com/wp-json/wp/v2/stores?search=pol"]},{"id":"sant-pol-de-mar-mercadillo-mercat-divendres","town":"Sant Pol de Mar","cat":"mercadillo","name":"Mercado semanal de los viernes","lat":41.604517,"lng":2.624538,"address":"Plaça d'Anselm Clavé, 08395 Sant Pol de Mar","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Mercadillo pequeño de barrio (unas 10 paradas): fruta y verdura, ropa y calzado.","horario":"Viernes de 08:00 a 14:00.","consejo":"Es pequeño y con ambiente local. Está a unos 5 min a pie de la estación, así que puedes combinarlo con un paseo por el casco antiguo. Si llegas muy pronto, puede que algunas paradas aún estén montando.","extra":"Lugar: Plaça d'Anselm Clavé (zona conocida como L'Hotel)."},"en":{"tipo":"Small neighbourhood market (about 10 stalls): fruit and veg, clothes and shoes.","horario":"Fridays 08:00 to 14:00.","consejo":"It's small with a local feel. It's about a 5-minute walk from the station, so you can combine it with a stroll around the old town. If you arrive very early, some stalls may still be setting up.","extra":"Where: Plaça d'Anselm Clavé (the area known as L'Hotel)."},"fr":{"tipo":"Petit marché de quartier (une dizaine d'étals) : fruits et légumes, vêtements et chaussures.","horario":"Le vendredi de 08:00 à 14:00.","consejo":"Petit marché à l'ambiance locale, à environ 5 min à pied de la gare : combinez-le avec une balade dans la vieille ville. Si vous arrivez très tôt, certains étals seront peut-être encore en cours d'installation.","extra":"Lieu : Plaça d'Anselm Clavé (le quartier appelé L'Hotel)."},"sources":["https://www.santpol.cat/ARXIUS/2026/PromoEco/Esborrany_ordenanA_a_mercat_setmana_StPol_26.pdf","https://mercadillos.org/es/sant-pol-de-mar/mercadillo-de-sant-pol-de-mar"]},{"id":"sant-pol-de-mar-bar-el-jardi-del-sant-pau","town":"Sant Pol de Mar","cat":"bar","name":"El Jardí del Sant Pau","lat":41.601436,"lng":2.623063,"address":"C. Nou, 8, 08395 Sant Pol de Mar","tel":"93 760 24 88","web":"https://www.eljardidelsantpau.com/","guardia_url":"","season":"Todo el año","es":{"tipo":"Bar con jardín frente al mar: pica-pica, bocadillos y cócteles.","horario":"Miércoles a domingo de 09:00 a 14:00 y de 19:00 a 23:00. Lunes y martes, cerrado.","consejo":"Ideal para un café por la mañana o un cóctel tranquilo al anochecer en el jardín, mirando al mar. La cocina cierra antes que el bar (a las 13:30 al mediodía).","extra":""},"en":{"tipo":"Bar with a garden facing the sea: sharing plates, sandwiches and cocktails.","horario":"Wednesday to Sunday 09:00 to 14:00 and 19:00 to 23:00. Closed Monday and Tuesday.","consejo":"Perfect for a morning coffee or a relaxed cocktail at dusk in the garden, looking out to sea. The kitchen closes before the bar (at 13:30 at lunchtime).","extra":""},"fr":{"tipo":"Bar avec jardin face à la mer : petites assiettes à partager, sandwichs et cocktails.","horario":"Du mercredi au dimanche de 09:00 à 14:00 et de 19:00 à 23:00. Fermé le lundi et le mardi.","consejo":"Idéal pour un café le matin ou un cocktail tranquille à la tombée du jour dans le jardin, face à la mer. La cuisine ferme avant le bar (à 13:30 le midi).","extra":""},"sources":["https://www.eljardidelsantpau.com/","https://www.santpol.cat/bars-i-cafeteries"]},{"id":"sant-pol-de-mar-bar-octopus-garden","town":"Sant Pol de Mar","cat":"bar","name":"Octopus Garden","lat":41.599312,"lng":2.618395,"address":"Parc del Litoral, s/n (C. Riera), 08395 Sant Pol de Mar","tel":"677 44 69 61","web":"https://www.octopusgarden.es/","guardia_url":"","season":"Temporada y horario no publicados (más actividad en verano)","es":{"tipo":"Bar-terraza familiar en un parque junto a la playa: tapas, hamburguesas, cerveza artesana y vermut.","horario":"Horario no publicado. En verano hay música y conciertos en directo por la noche.","consejo":"Muy cómodo con niños: juegan en los columpios y toboganes del parque mientras tú estás en la terraza, a pocos pasos de la playa. Fuera de temporada, llama antes (677 44 69 61).","extra":"El pin marca el Parc del Litoral; el bar está dentro del parque."},"en":{"tipo":"Family-friendly terrace bar in a park by the beach: tapas, burgers, craft beer and vermouth.","horario":"Opening hours not published. In summer there's music and live gigs in the evening.","consejo":"Great with children: they play on the park's swings and slides while you sit on the terrace, a few steps from the beach. Out of season, ring ahead (677 44 69 61).","extra":"The pin marks the Parc del Litoral; the bar is inside the park."},"fr":{"tipo":"Bar-terrasse familial dans un parc près de la plage : tapas, burgers, bière artisanale et vermouth.","horario":"Horaires non communiqués. En été, musique et concerts live le soir.","consejo":"Très pratique avec des enfants : ils jouent sur les balançoires et les toboggans du parc pendant que vous êtes en terrasse, à deux pas de la plage. Hors saison, appelez avant (677 44 69 61).","extra":"Le repère indique le Parc del Litoral ; le bar se trouve dans le parc."},"sources":["https://www.octopusgarden.es/","https://www.santpol.cat/bars-i-cafeteries"]},{"id":"sant-pol-de-mar-comer-cuina-sant-pau","town":"Sant Pol de Mar","cat":"comer","name":"Cuina Sant Pau","lat":41.601464,"lng":2.623135,"address":"C. Nou, 10, 08395 Sant Pol de Mar","tel":"+34 937 60 09 50","web":"https://www.cuina-santpau.cat/","guardia_url":"","season":"Todo el año","es":{"tipo":"Bistró mediterráneo en el antiguo Sant Pau de Carme Ruscalleda.","horario":"Miércoles a sábado de 13:00 a 15:30 y de 20:00 a 22:30. Domingo de 13:00 a 15:30. Lunes y martes, cerrado.","consejo":"Lo llevan Raül Balam Ruscalleda y Murilo Rodrigues Alves: cocina catalana de temporada con toques brasileños, pensada para compartir. Prueba la moqueca (rape en leche de coco y lima). Reserva, sobre todo el fin de semana.","extra":"Seleccionado en la Guía Michelin (€€). Precio orientativo según el Ajuntament: desde 60 €."},"en":{"tipo":"Mediterranean bistro in Carme Ruscalleda's former Sant Pau restaurant.","horario":"Wednesday to Saturday 13:00 to 15:30 and 20:00 to 22:30. Sunday 13:00 to 15:30. Closed Monday and Tuesday.","consejo":"Run by Raül Balam Ruscalleda and Murilo Rodrigues Alves: seasonal Catalan cooking with Brazilian touches, made for sharing. Try the moqueca (monkfish in coconut milk and lime). Book ahead, especially at weekends.","extra":"Listed in the Michelin Guide (€€). Guide price according to the town hall: from €60."},"fr":{"tipo":"Bistrot méditerranéen dans l'ancien Sant Pau de Carme Ruscalleda.","horario":"Du mercredi au samedi de 13:00 à 15:30 et de 20:00 à 22:30. Dimanche de 13:00 à 15:30. Fermé le lundi et le mardi.","consejo":"Tenu par Raül Balam Ruscalleda et Murilo Rodrigues Alves : cuisine catalane de saison aux touches brésiliennes, à partager. Goûtez la moqueca (lotte au lait de coco et citron vert). Réservez, surtout le week-end.","extra":"Sélectionné par le Guide Michelin (€€). Prix indicatif selon la mairie : à partir de 60 €."},"sources":["https://guide.michelin.com/es/es/catalunya/sant-pol-de-mar/restaurante/cuina-sant-pau","https://www.cuina-santpau.cat/","https://www.santpol.cat/restaurants"]},{"id":"sant-pol-de-mar-comer-lermita","town":"Sant Pol de Mar","cat":"comer","name":"L'Ermita (Hotel-Escola de Sant Pol)","lat":41.602197,"lng":2.627279,"address":"Carretera N-II, km 664, 08395 Sant Pol de Mar","tel":"937 600 051","web":"https://www.lermitarestaurant.com/","guardia_url":"","season":"Todo el año (365 días)","es":{"tipo":"Restaurante del Hotel-Escola de Sant Pol: cocina mediterránea de mercado.","horario":"Todos los días de 13:30 a 15:30 y de 20:30 a 22:30 (abre los 365 días del año).","consejo":"Está en el Hotel-Escola de Sant Pol, centro de formación en hostelería, con jardín, vistas al mar y parking gratuito. Como abre todos los días, es un buen recurso para un lunes o martes, cuando muchos restaurantes cierran. Carta desde unos 30 €.","extra":""},"en":{"tipo":"Restaurant at the Hotel-Escola de Sant Pol: Mediterranean, market-led cooking.","horario":"Daily 13:30 to 15:30 and 20:30 to 22:30 (open 365 days a year).","consejo":"It's part of the Hotel-Escola de Sant Pol, a hospitality training centre, with a garden, sea views and free parking. As it opens every day, it's a handy option on a Monday or Tuesday, when many restaurants are closed. À la carte from about €30.","extra":""},"fr":{"tipo":"Restaurant de l'Hotel-Escola de Sant Pol : cuisine méditerranéenne du marché.","horario":"Tous les jours de 13:30 à 15:30 et de 20:30 à 22:30 (ouvert 365 jours par an).","consejo":"Il fait partie de l'Hotel-Escola de Sant Pol, centre de formation hôtelière, avec jardin, vue sur la mer et parking gratuit. Ouvert tous les jours, c'est une bonne solution le lundi ou le mardi, quand beaucoup de restaurants ferment. À la carte à partir d'environ 30 €.","extra":""},"sources":["https://www.lermitarestaurant.com/","https://www.santpol.cat/restaurants"]},{"id":"sant-pol-de-mar-iconico-esglesia-sant-jaume","town":"Sant Pol de Mar","cat":"iconico","name":"Església de Sant Jaume","lat":41.600149,"lng":2.620434,"address":"C. Abat Deàs, 47, 08395 Sant Pol de Mar","tel":"","web":"https://www.santpol.cat/10242","guardia_url":"","season":"Todo el año","es":{"tipo":"Iglesia gótica tardía (1590) con una torre de vigía del siglo XVI como campanario.","horario":"Exterior, siempre. Interior, solo en horario de misa.","consejo":"El campanario era una torre de vigía del siglo XVI, con muros de más de 2 m de grosor. Dentro hay una Pietat atribuida a Juan Martínez Montañés. Está en el casco antiguo, a pocos pasos del Museu de Pintura.","extra":""},"en":{"tipo":"Late Gothic church (1590) whose bell tower was a 16th-century watchtower.","horario":"Exterior: any time. Interior: only during Mass times.","consejo":"The bell tower started life as a 16th-century watchtower, with walls over 2 m thick. Inside is a Pietà attributed to Juan Martínez Montañés. It's in the old town, a few steps from the Museu de Pintura.","extra":""},"fr":{"tipo":"Église gothique tardive (1590) dont le clocher est une tour de guet du XVIe siècle.","horario":"Extérieur : à tout moment. Intérieur : uniquement aux heures de messe.","consejo":"Le clocher était une tour de guet du XVIe siècle, aux murs de plus de 2 m d'épaisseur. À l'intérieur, une Pietà attribuée à Juan Martínez Montañés. Elle se trouve dans la vieille ville, à quelques pas du Museu de Pintura.","extra":""},"sources":["https://www.santpol.cat/10242"]},{"id":"sant-pol-de-mar-iconico-museu-de-pintura","town":"Sant Pol de Mar","cat":"iconico","name":"Museu de Pintura de Sant Pol de Mar","lat":41.600208,"lng":2.621266,"address":"Plaça de la Vila, 1, 08395 Sant Pol de Mar","tel":"937 60 08 46","web":"https://museusantpol.cat/","guardia_url":"","season":"Todo el año (cierra entre exposiciones)","es":{"tipo":"Museo de pintura local con exposiciones temporales.","horario":"Invierno: sábados de 18:00 a 20:00 y domingos de 11:00 a 14:00. Julio y agosto: viernes a domingo de 18:00 a 21:00. Entre exposiciones solo abre en actividades programadas.","consejo":"Lo gestiona la asociación Amics de les Arts y organiza conciertos y visitas guiadas. Combínalo con la iglesia de Sant Jaume, al lado.","extra":""},"en":{"tipo":"Local painting museum with temporary exhibitions.","horario":"Winter: Saturdays 18:00 to 20:00 and Sundays 11:00 to 14:00. July and August: Friday to Sunday 18:00 to 21:00. Between exhibitions it only opens for scheduled events.","consejo":"It's run by the Amics de les Arts association, which organises concerts and guided tours. Combine it with the church of Sant Jaume next door.","extra":""},"fr":{"tipo":"Musée de peinture local avec expositions temporaires.","horario":"Hiver : samedi de 18:00 à 20:00 et dimanche de 11:00 à 14:00. Juillet et août : du vendredi au dimanche de 18:00 à 21:00. Entre deux expositions, il n'ouvre que pour les activités programmées.","consejo":"Géré par l'association Amics de les Arts, qui organise concerts et visites guidées. À combiner avec l'église de Sant Jaume, juste à côté.","extra":""},"sources":["https://museusantpol.cat/"]},{"id":"sant-pol-de-mar-atardecer-mirador-ermita-sant-pau","town":"Sant Pol de Mar","cat":"atardecer","name":"Mirador de l'Ermita de Sant Pau","lat":41.601976,"lng":2.625697,"address":"Plaça de Sant Pau, s/n, 08395 Sant Pol de Mar","tel":"93 760 07 60","web":"https://www.santpol.cat/10241","guardia_url":"","season":"Todo el año","es":{"tipo":"Mirador en lo alto de la colina de la ermita (monumento BCIN).","horario":"Exterior siempre accesible. El interior de la ermita solo se abre con reserva previa.","consejo":"Desde arriba ves la costa hacia Barcelona (y Montjuïc en días claros), que es por donde se pone el sol en invierno. La ermita se abre con cita (parroquia 93 760 07 60 o Turisme) y hay misa el último miércoles de cada mes a las 10:00.","extra":""},"en":{"tipo":"Hilltop viewpoint by the hermitage (a listed national monument).","horario":"Outside: always open. The inside of the hermitage opens by appointment only.","consejo":"From the top you look down the coast towards Barcelona (and Montjuïc on clear days), which is where the sun sets in winter. The hermitage opens by appointment (parish 93 760 07 60 or the Tourist Office), and there's Mass on the last Wednesday of each month at 10:00.","extra":""},"fr":{"tipo":"Belvédère au sommet de la colline de l'ermitage (monument classé BCIN).","horario":"Extérieur toujours accessible. L'intérieur de l'ermitage ne se visite que sur rendez-vous.","consejo":"D'en haut, la vue file le long de la côte vers Barcelone (et Montjuïc par temps clair), là où le soleil se couche en hiver. L'ermitage ouvre sur rendez-vous (paroisse 93 760 07 60 ou Office de tourisme) ; messe le dernier mercredi de chaque mois à 10:00.","extra":""},"sources":["https://www.santpol.cat/10241"]},{"id":"sant-pol-de-mar-ruta-ruta-de-les-torretes","town":"Sant Pol de Mar","cat":"ruta","name":"Ruta de Les Torretes","lat":41.601911,"lng":2.624446,"address":"Salida y llegada: Plaça de l'Estació, Sant Pol de Mar","tel":"","web":"https://www.santpol.cat/document.php?id=20870","guardia_url":"","season":"Todo el año","es":{"tipo":"Ruta señalizada por la cresta entre Sant Pol y Calella.","horario":"Siempre accesible; hazla con luz de día.","consejo":"Va hacia Calella y pasa por el Far y Les Torretes, con vistas al Montnegre, a la costa y a las playas de Sant Pol y Calella. Si te cansas, vuelve en tren desde Calella (5 min).","extra":"8,4 km · tiempo no publicado · dificultad baja · circular"},"en":{"tipo":"Waymarked ridge walk between Sant Pol and Calella.","horario":"Always open; walk it in daylight.","consejo":"It heads towards Calella past the lighthouse and Les Torretes, with views of the Montnegre hills, the coast and the beaches of Sant Pol and Calella. If you get tired, take the train back from Calella (5 min).","extra":"8.4 km · time not published · easy · circular"},"fr":{"tipo":"Itinéraire balisé sur la crête entre Sant Pol et Calella.","horario":"Toujours accessible ; à faire de jour.","consejo":"Il part vers Calella en passant par le phare et Les Torretes, avec vue sur le Montnegre, la côte et les plages de Sant Pol et de Calella. Si vous êtes fatigué, rentrez en train depuis Calella (5 min).","extra":"8,4 km · durée non communiquée · facile · circulaire"},"sources":["https://www.santpol.cat/document.php?id=20870"]},{"id":"sant-pol-de-mar-tren-estacio-sant-pol","town":"Sant Pol de Mar","cat":"tren","name":"Estación de Sant Pol de Mar (Rodalies R1)","lat":41.601631,"lng":2.624646,"address":"Plaça de l'Estació, 08395 Sant Pol de Mar","tel":"","web":"https://rodalies.gencat.cat/ca/sobre-rodalies/linies-i-estacions/servei_rodalia_barcelona/r1/","guardia_url":"","season":"Todo el año","es":{"tipo":"Estación de tren Rodalies R1.","horario":"","consejo":"La estación está a pie de playa y en pleno centro, y de aquí sale la Ruta de Les Torretes. Desde el 29/09/2026 algunos trenes terminan en Mataró: mira el destino en la pantalla.","extra":"Destinos directos: Barcelona-Pl. Catalunya (1 h 03 min), Barcelona-Sants (1 h 08 min), Mataró (20 min), Calella (5 min), Blanes (20 min). Frecuencia: un tren cada 30 min aprox. en día laborable (más en hora punta)."},"en":{"tipo":"Rodalies R1 railway station.","horario":"","consejo":"The station is right by the beach and in the centre of the village, and the Ruta de Les Torretes starts here. Since 29/09/2026 some trains terminate at Mataró, so check the destination on the screen.","extra":"Direct trains: Barcelona-Pl. Catalunya (1 h 03 min), Barcelona-Sants (1 h 08 min), Mataró (20 min), Calella (5 min), Blanes (20 min). Frequency: roughly one train every 30 min on weekdays (more at peak times)."},"fr":{"tipo":"Gare Rodalies R1.","horario":"","consejo":"La gare est au bord de la plage, en plein centre, et la Ruta de Les Torretes part d'ici. Depuis le 29/09/2026, certains trains s'arrêtent à Mataró : vérifiez la destination sur l'écran.","extra":"Trains directs : Barcelona-Pl. Catalunya (1 h 03 min), Barcelona-Sants (1 h 08 min), Mataró (20 min), Calella (5 min), Blanes (20 min). Fréquence : environ un train toutes les 30 min en semaine (plus aux heures de pointe)."},"sources":["https://rodalies.gencat.cat/web/.content/02_Horaris/horaris/R1.pdf","https://rodalies.gencat.cat/ca/sobre-rodalies/linies-i-estacions/servei_rodalia_barcelona/r1/"]},{"id":"santa-susanna-farmacia-av-del-mar","town":"Santa Susanna","cat":"farmacia","name":"Farmacia de Santa Susanna (Av. del Mar)","lat":41.63608,"lng":2.725666,"address":"Av. del Mar, 24 (Edifici Libra), 08398 Santa Susanna","tel":"937 678 493","web":"","guardia_url":"https://www.farmaguia.net","season":"Todo el año","es":{"tipo":"Farmacia de referencia (la de guardia cambia cada día). Es la única farmacia del municipio.","horario":"Horario no publicado en fuentes oficiales; llama antes al 937 678 493.","consejo":"Está en la zona hotelera, en la Av. del Mar (edificio Libra). De noche o en festivo, busca la farmacia de guardia del día en farmaguia.net, el localizador oficial del Col·legi de Farmacèutics de Barcelona.","extra":""},"en":{"tipo":"Reference pharmacy (the duty pharmacy changes every day). It is the only pharmacy in the town.","horario":"Opening hours are not published by official sources; ring 937 678 493 before you go.","consejo":"It is in the hotel area, on Av. del Mar (Edifici Libra). At night or on a bank holiday, find the day's duty pharmacy on farmaguia.net, the official locator of the Col·legi de Farmacèutics de Barcelona.","extra":""},"fr":{"tipo":"Pharmacie de référence (la pharmacie de garde change chaque jour). C'est la seule pharmacie de la commune.","horario":"Horaires non publiés par les sources officielles ; appelez avant au 937 678 493.","consejo":"Elle se trouve dans la zone hôtelière, sur l'Av. del Mar (Edifici Libra). La nuit ou un jour férié, cherchez la pharmacie de garde du jour sur farmaguia.net, l'outil officiel du Col·legi de Farmacèutics de Barcelona.","extra":""},"sources":["https://www.cofb.org/ca/qui-som/el-collegi/cercador-de-farmacies/","https://www.cofb.org/ca/que-oferim/ciutadans/farmacies-obertes/","https://www.openstreetmap.org/node/2309368608"]},{"id":"pineda-de-mar-farmacia-badia-12h","town":"Pineda de Mar","cat":"farmacia","name":"Farmàcia Badia 12h","lat":41.629441,"lng":2.692796,"address":"C/ Santiago Rusiñol, 93-99, 08397 Pineda de Mar","tel":"937 626 979","web":"","guardia_url":"https://www.farmaguia.net","season":"Todo el año","es":{"tipo":"Farmacia de referencia con horario ampliado (la de guardia cambia cada día).","horario":"Lunes a sábado 09:00–21:00; domingo 10:00–14:00 (según su ficha pública; confírmalo por teléfono).","consejo":"Está al lado del Carrefour Market de la calle Santiago Rusiñol. Fuera de este horario, consulta la farmacia de guardia del día en farmaguia.net (Col·legi de Farmacèutics de Barcelona).","extra":""},"en":{"tipo":"Reference pharmacy with extended hours (the duty pharmacy changes every day).","horario":"Monday to Saturday 09:00–21:00; Sunday 10:00–14:00 (according to its public listing; confirm by phone).","consejo":"It is next to the Carrefour Market on Carrer de Santiago Rusiñol. Outside these hours, check the day's duty pharmacy on farmaguia.net (Col·legi de Farmacèutics de Barcelona).","extra":""},"fr":{"tipo":"Pharmacie de référence aux horaires élargis (la pharmacie de garde change chaque jour).","horario":"Du lundi au samedi 09:00–21:00 ; dimanche 10:00–14:00 (selon sa fiche publique ; vérifiez par téléphone).","consejo":"Elle se trouve à côté du Carrefour Market de la rue Santiago Rusiñol. En dehors de ces horaires, consultez la pharmacie de garde du jour sur farmaguia.net (Col·legi de Farmacèutics de Barcelona).","extra":""},"sources":["https://www.cofb.org/ca/qui-som/el-collegi/cercador-de-farmacies/","https://www.topdoctors.es/farmacia/farmacia-badia-12","https://www.cofb.org/ca/que-oferim/ciutadans/farmacies-obertes/"]},{"id":"santa-susanna-super-tarde-carrefour","town":"Santa Susanna","cat":"super_tarde","name":"Carrefour Santa Susanna (hipermercado)","lat":41.636743,"lng":2.717438,"address":"Ctra. N-II, km 673, 08398 Santa Susanna","tel":"","web":"https://www.carrefour.es/tiendas-carrefour/hipermercados/carrefour/santa_susanna.aspx","guardia_url":"","season":"Todo el año","es":{"tipo":"Hipermercado para la compra grande.","horario":"Lunes a sábado de 09:00 a 22:00. Algunos domingos y festivos también abre de 09:00 a 22:00 (consulta los festivos en su web).","consejo":"Está dentro del parque comercial Espais Susanna, con aparcamiento. Es de los súper que cierran más tarde de la zona: ideal para la compra del primer día. La gasolinera Carrefour 24 h está a unos 450 m, junto al Lidl.","extra":""},"en":{"tipo":"Hypermarket for a big shop.","horario":"Monday to Saturday 09:00 to 22:00. Also opens on some Sundays and bank holidays, 09:00 to 22:00 (check the holiday dates on its website).","consejo":"It is inside the Espais Susanna retail park, with parking. It is one of the latest-closing supermarkets in the area: ideal for your first-day shop. The 24-hour Carrefour petrol station is about 450 m away, next to Lidl.","extra":""},"fr":{"tipo":"Hypermarché pour les grosses courses.","horario":"Du lundi au samedi de 09:00 à 22:00. Ouvert aussi certains dimanches et jours fériés de 09:00 à 22:00 (consultez les dates sur son site).","consejo":"Il se trouve dans le parc commercial Espais Susanna, avec parking. C'est l'un des supermarchés qui ferment le plus tard dans le secteur : idéal pour les courses du premier jour. La station-service Carrefour 24 h est à environ 450 m, à côté du Lidl.","extra":""},"sources":["https://www.carrefour.es/tiendas-carrefour/hipermercados/carrefour/santa_susanna.aspx","https://www.espaissusanna.cat/","https://www.openstreetmap.org/node/5660831206"]},{"id":"santa-susanna-super-tarde-lidl","town":"Santa Susanna","cat":"super_tarde","name":"Lidl Santa Susanna","lat":41.635158,"lng":2.711968,"address":"Ctra. N-II, km 673, 08398 Santa Susanna","tel":"","web":"https://www.lidl.es/s/es-ES/tiendas/santa-susanna/ctra-n-ii-km-673/","guardia_url":"","season":"Todo el año","es":{"tipo":"Supermercado para la compra grande; abre todos los días.","horario":"Lunes a domingo de 09:00 a 21:30.","consejo":"Abre también los domingos. Tiene parking, cajas de autopago, wifi gratis y panadería. La gasolinera Carrefour 24 h está justo al lado.","extra":""},"en":{"tipo":"Supermarket for a big shop; open every day.","horario":"Monday to Sunday 09:00 to 21:30.","consejo":"Also open on Sundays. It has a car park, self-checkouts, free wifi and a bakery. The 24-hour Carrefour petrol station is right next door.","extra":""},"fr":{"tipo":"Supermarché pour les grosses courses ; ouvert tous les jours.","horario":"Du lundi au dimanche de 09:00 à 21:30.","consejo":"Ouvert aussi le dimanche. Parking, caisses automatiques, wifi gratuit et boulangerie. La station-service Carrefour 24 h est juste à côté.","extra":""},"sources":["https://www.lidl.es/s/es-ES/tiendas/santa-susanna/ctra-n-ii-km-673/","https://www.openstreetmap.org/way/589909011"]},{"id":"pineda-de-mar-super-tarde-carrefour-express","town":"Pineda de Mar","cat":"super_tarde","name":"Carrefour Express C/ Doctor Bertomeu 15","lat":41.623595,"lng":2.690838,"address":"C/ Doctor Bertomeu, 15, 08397 Pineda de Mar","tel":"","web":"https://www.carrefour.es/tiendas-carrefour/supermercados/carrefour-express/doctor-bertomeu-pineda-mar-s.aspx","guardia_url":"","season":"Todo el año","es":{"tipo":"Supermercado de proximidad / compra rápida en el centro.","horario":"Lunes a sábado de 09:00 a 21:30. Algunos festivos abre de 09:00 a 21:30.","consejo":"En pleno centro, a unos 300 m de la estación de tren: práctico para una compra rápida. Para una compra grande, el Carrefour de Santa Susanna abre hasta las 22:00.","extra":""},"en":{"tipo":"Convenience supermarket / quick shop in the town centre.","horario":"Monday to Saturday 09:00 to 21:30. Opens 09:00 to 21:30 on some bank holidays.","consejo":"Right in the centre, about 300 m from the train station: handy for a quick shop. For a big shop, the Carrefour in Santa Susanna is open until 22:00.","extra":""},"fr":{"tipo":"Supérette de proximité / courses rapides en centre-ville.","horario":"Du lundi au samedi de 09:00 à 21:30. Ouvert certains jours fériés de 09:00 à 21:30.","consejo":"En plein centre, à environ 300 m de la gare : pratique pour des courses rapides. Pour de grosses courses, le Carrefour de Santa Susanna est ouvert jusqu'à 22:00.","extra":""},"sources":["https://www.carrefour.es/tiendas-carrefour/supermercados/carrefour-express/doctor-bertomeu-pineda-mar-s.aspx","https://www.openstreetmap.org/node/13758992369"]},{"id":"pineda-de-mar-super-tarde-aldi","town":"Pineda de Mar","cat":"super_tarde","name":"ALDI Pineda de Mar","lat":41.634281,"lng":2.691689,"address":"C/ Nonell, 31, 08397 Pineda de Mar","tel":"","web":"https://www.aldi.es/supermercados/encuentra-tu-supermercado.html/l/pineda-de-mar/carrer-illes-canaries-106/3604364","guardia_url":"","season":"Todo el año","es":{"tipo":"Supermercado para la compra grande; abre todos los días.","horario":"Lunes a domingo de 09:00 a 21:00. Navidad: 24 y 31 de diciembre y 5 de enero hasta las 19:00; 26 de diciembre de 09:00 a 14:00; cerrado 25 de diciembre, 1 y 6 de enero.","consejo":"Útil si llegas en domingo: abre los 7 días de la semana. Está en la parte norte del pueblo, hacia el interior (barrio de Pinemar).","extra":""},"en":{"tipo":"Supermarket for a big shop; open every day.","horario":"Monday to Sunday 09:00 to 21:00. Christmas: 24 and 31 December and 5 January until 19:00; 26 December 09:00 to 14:00; closed 25 December, 1 and 6 January.","consejo":"Handy if you arrive on a Sunday: it opens 7 days a week. It is in the northern, inland part of town (Pinemar area).","extra":""},"fr":{"tipo":"Supermarché pour les grosses courses ; ouvert tous les jours.","horario":"Du lundi au dimanche de 09:00 à 21:00. Noël : 24 et 31 décembre et 5 janvier jusqu'à 19:00 ; 26 décembre de 09:00 à 14:00 ; fermé les 25 décembre, 1er et 6 janvier.","consejo":"Pratique si vous arrivez un dimanche : ouvert 7 jours sur 7. Il se trouve dans la partie nord de la ville, côté intérieur (quartier de Pinemar).","extra":""},"sources":["https://www.aldi.es/supermercados/encuentra-tu-supermercado.html/l/pineda-de-mar/carrer-illes-canaries-106/3604364","https://eines.icgc.cat/geocodificador/cerca?text=Carrer%20Nonell%2031%2C%20Pineda%20de%20Mar"]},{"id":"santa-susanna-gasolinera-24h-carrefour","town":"Santa Susanna","cat":"gasolinera_24h","name":"Gasolinera Carrefour Santa Susanna","lat":41.635349,"lng":2.71244,"address":"Polígon 1 de la Riera, parcel·les FR6-FR7, 08398 Santa Susanna","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Gasolinera 24 horas.","horario":"Abierta 24 h, de lunes a domingo.","consejo":"Está al lado del Lidl y a unos 450 m del hipermercado Carrefour (Espais Susanna): puedes repostar y hacer la compra en el mismo viaje.","extra":""},"en":{"tipo":"24-hour petrol station.","horario":"Open 24 hours, Monday to Sunday.","consejo":"It is next to Lidl and about 450 m from the Carrefour hypermarket (Espais Susanna): you can fill up and do your shopping in one trip.","extra":""},"fr":{"tipo":"Station-service 24 h/24.","horario":"Ouverte 24 h/24, du lundi au dimanche.","consejo":"Elle se trouve à côté du Lidl et à environ 450 m de l'hypermarché Carrefour (Espais Susanna) : vous pouvez faire le plein et les courses en un seul trajet.","extra":""},"sources":["https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroMunicipio/1126","https://geoportalgasolineras.es"]},{"id":"santa-susanna-gasolinera-24h-petroprix","town":"Santa Susanna","cat":"gasolinera_24h","name":"Petroprix Santa Susanna","lat":41.633961,"lng":2.707359,"address":"Camí de Perafita, s/n, 08398 Santa Susanna","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Gasolinera de bajo coste, abierta 24 horas.","horario":"Abierta 24 h, de lunes a domingo.","consejo":"Está en el Camí de Perafita, a unos 150 m de la iglesia de Santa Susanna. Compara precios en geoportalgasolineras.es antes de repostar.","extra":""},"en":{"tipo":"Low-cost petrol station, open 24 hours.","horario":"Open 24 hours, Monday to Sunday.","consejo":"It is on Camí de Perafita, about 150 m from Santa Susanna church. Compare prices on geoportalgasolineras.es before filling up.","extra":""},"fr":{"tipo":"Station-service low cost, ouverte 24 h/24.","horario":"Ouverte 24 h/24, du lundi au dimanche.","consejo":"Elle se trouve sur le Camí de Perafita, à environ 150 m de l'église de Santa Susanna. Comparez les prix sur geoportalgasolineras.es avant de faire le plein.","extra":""},"sources":["https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroMunicipio/1126","https://geoportalgasolineras.es"]},{"id":"pineda-de-mar-gasolinera-24h-es-pineda-n2","town":"Pineda de Mar","cat":"gasolinera_24h","name":"E.S. Pineda de Mar (N-II)","lat":41.629417,"lng":2.689915,"address":"Ctra. N-II, km 671, 08397 Pineda de Mar","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Gasolinera 24 horas en el centro.","horario":"Abierta 24 h, de lunes a domingo.","consejo":"Está en la N-II, en pleno centro, al lado de la iglesia de Santa Maria y de la masía Can Jalpí: fácil de encontrar al llegar o al salir de Pineda.","extra":""},"en":{"tipo":"24-hour petrol station in the town centre.","horario":"Open 24 hours, Monday to Sunday.","consejo":"It is on the N-II, right in the centre, next to Santa Maria church and the Can Jalpí farmhouse: easy to find as you arrive in or leave Pineda.","extra":""},"fr":{"tipo":"Station-service 24 h/24 en centre-ville.","horario":"Ouverte 24 h/24, du lundi au dimanche.","consejo":"Elle se trouve sur la N-II, en plein centre, à côté de l'église Santa Maria et du mas Can Jalpí : facile à trouver en arrivant à Pineda ou en repartant.","extra":""},"sources":["https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroMunicipio/1028","https://geoportalgasolineras.es","https://patrimonicultural.diba.cat/element/mas-coll-can-jalpi"]},{"id":"pineda-de-mar-gasolinera-24h-tamoil","town":"Pineda de Mar","cat":"gasolinera_24h","name":"Tamoil Pineda (C/ Garbí)","lat":41.623146,"lng":2.672396,"address":"C/ Garbí, 190-194, 08397 Pineda de Mar","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Gasolinera 24 horas.","horario":"Abierta 24 h, de lunes a domingo.","consejo":"Es la más cómoda si te alojas en el barrio del Poblenou o vienes de Calella.","extra":""},"en":{"tipo":"24-hour petrol station.","horario":"Open 24 hours, Monday to Sunday.","consejo":"The most convenient one if you are staying in the Poblenou area or coming from Calella.","extra":""},"fr":{"tipo":"Station-service 24 h/24.","horario":"Ouverte 24 h/24, du lundi au dimanche.","consejo":"La plus pratique si vous logez dans le quartier du Poblenou ou si vous venez de Calella.","extra":""},"sources":["https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroMunicipio/1028","https://geoportalgasolineras.es"]},{"id":"santa-susanna-centro-comercial-espais-susanna","town":"Santa Susanna","cat":"centro_comercial","name":"Espais Susanna","lat":41.636861,"lng":2.717312,"address":"Ctra. N-II, km 673, 08398 Santa Susanna","tel":"+34 636 118 805","web":"https://www.espaissusanna.cat/","guardia_url":"","season":"Todo el año","es":{"tipo":"Parque comercial con hipermercado Carrefour, tiendas y restauración.","horario":"Centro: lunes a domingo de 09:00 a 23:00 (cada tienda tiene su propio horario).","consejo":"Abre todo el año. Los domingos por la mañana se monta al lado el mercado semanal de Santa Susanna. Está a unos 10 min a pie de la estación de tren.","extra":""},"en":{"tipo":"Retail park with a Carrefour hypermarket, shops and places to eat.","horario":"Centre: Monday to Sunday 09:00 to 23:00 (each shop sets its own hours).","consejo":"Open all year round. On Sunday mornings Santa Susanna's weekly market is held right next to it. It is about a 10-minute walk from the train station.","extra":""},"fr":{"tipo":"Parc commercial avec hypermarché Carrefour, boutiques et restauration.","horario":"Centre : du lundi au dimanche de 09:00 à 23:00 (chaque boutique a ses propres horaires).","consejo":"Ouvert toute l'année. Le dimanche matin, le marché hebdomadaire de Santa Susanna s'installe juste à côté. À environ 10 min à pied de la gare.","extra":""},"sources":["https://www.espaissusanna.cat/contacte/","https://www.espaissusanna.cat/","https://www.stasusanna.cat/ca/temes/mercats-comerc-i-consum/santa-susanna-vila-de-mercats"]},{"id":"santa-susanna-mercadillo-domingo-mercafira","town":
