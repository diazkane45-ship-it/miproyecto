"Santa Susanna","cat":"mercadillo","name":"Mercat setmanal – Mercafira (domingo)","lat":41.636861,"lng":2.717312,"address":"Explanada junto al Carrefour (Espais Susanna), Ctra. N-II km 673, 08398 Santa Susanna","tel":"","web":"https://www.stasusanna.cat/ca/temes/mercats-comerc-i-consum/santa-susanna-vila-de-mercats","guardia_url":"","season":"Todo el año","es":{"tipo":"Mercadillo semanal (ropa, alimentación y más).","horario":"Domingos por la mañana, todo el año (el Ayuntamiento no publica la hora exacta).","consejo":"Se monta en la explanada al lado del Carrefour: aparca en Espais Susanna y ve temprano. El pin marca el centro comercial; el mercado está justo al lado.","extra":"Otros mercados: antigüedades los viernes por la mañana y el 1.º y 4.º domingo de mes en la Rambla Onze de Setembre (junto a la N-II)."},"en":{"tipo":"Weekly street market (clothes, food and more).","horario":"Sunday mornings, all year round (the town hall does not publish exact times).","consejo":"It is set up on the open ground next to Carrefour: park at Espais Susanna and go early. The pin marks the shopping centre; the market is right beside it.","extra":"Other markets: antiques on Friday mornings and on the 1st and 4th Sunday of the month on Rambla Onze de Setembre (next to the N-II)."},"fr":{"tipo":"Marché hebdomadaire (vêtements, alimentation et plus).","horario":"Le dimanche matin, toute l'année (la mairie ne publie pas d'horaires exacts).","consejo":"Il s'installe sur l'esplanade à côté du Carrefour : garez-vous à Espais Susanna et venez tôt. Le repère indique le centre commercial ; le marché est juste à côté.","extra":"Autres marchés : antiquités le vendredi matin et les 1er et 4e dimanches du mois sur la Rambla Onze de Setembre (à côté de la N-II)."},"sources":["https://www.stasusanna.cat/ca/temes/mercats-comerc-i-consum/santa-susanna-vila-de-mercats","https://www.espaissusanna.cat/"]},{"id":"santa-susanna-mercadillo-sabado-proximitat","town":"Santa Susanna","cat":"mercadillo","name":"Mercat de productes de proximitat (sábado)","lat":41.636142,"lng":2.709283,"address":"Rambla dels Països Catalans, 08398 Santa Susanna","tel":"","web":"https://www.stasusanna.cat/ca/temes/mercats-comerc-i-consum/santa-susanna-vila-de-mercats","guardia_url":"","season":"Todo el año (mercados de verano: abril–octubre)","es":{"tipo":"Mercado de alimentación con productos de proximidad.","horario":"Sábados por la mañana, todo el año (sin hora exacta publicada).","consejo":"Está en el centro del pueblo, a unos pasos de la plaza Catalunya (Ayuntamiento): buen sitio para comprar producto local.","extra":"En temporada: martes por la mañana, mercado de verano de ropa y complementos en la Av. del Mar / Passeig Marítim (1 de abril–30 de octubre), y cada tarde mercado de productos artesanales en la Av. del Mar (1 de junio–15 de octubre)."},"en":{"tipo":"Food market with local produce.","horario":"Saturday mornings, all year round (no exact times published).","consejo":"It is in the village centre, a short walk from Plaça Catalunya (town hall): a good place to buy local produce.","extra":"In season: on Tuesday mornings, a summer market for clothes and accessories on Av. del Mar / Passeig Marítim (1 April–30 October), and every afternoon a craft market on Av. del Mar (1 June–15 October)."},"fr":{"tipo":"Marché alimentaire de produits locaux.","horario":"Le samedi matin, toute l'année (pas d'horaires exacts publiés).","consejo":"Il se trouve au centre du village, à quelques pas de la plaça Catalunya (mairie) : une bonne adresse pour acheter des produits locaux.","extra":"En saison : le mardi matin, marché d'été de vêtements et accessoires sur l'Av. del Mar / Passeig Marítim (1er avril–30 octobre), et tous les après-midi, marché artisanal sur l'Av. del Mar (1er juin–15 octobre)."},"sources":["https://www.stasusanna.cat/ca/temes/mercats-comerc-i-consum/santa-susanna-vila-de-mercats"]},{"id":"pineda-de-mar-mercadillo-viernes-centre","town":"Pineda de Mar","cat":"mercadillo","name":"Mercat Centre Pineda (viernes)","lat":41.621741,"lng":2.69132,"address":"Passeig Marítim, Pineda de Mar (Pineda Centre)","tel":"","web":"https://visitpineda.com/descobrir-pineda/mercats/","guardia_url":"","season":"Todo el año","es":{"tipo":"Mercadillo semanal (alimentación, ropa y más).","horario":"Viernes de 08:00 a 14:00, todo el año.","consejo":"Se monta en el Passeig Marítim del centro. Ve a primera hora y, si puedes, a pie o en tren: la estación de Pineda está en el mismo frente marítimo.","extra":"Lugar: Passeig Marítim (Pineda Centre)."},"en":{"tipo":"Weekly street market (food, clothes and more).","horario":"Fridays 08:00 to 14:00, all year round.","consejo":"It is held on the Passeig Marítim in the town centre. Go early and, if you can, on foot or by train: Pineda station is on the same seafront.","extra":"Location: Passeig Marítim (Pineda Centre)."},"fr":{"tipo":"Marché hebdomadaire (alimentation, vêtements et plus).","horario":"Le vendredi de 08:00 à 14:00, toute l'année.","consejo":"Il s'installe sur le Passeig Marítim du centre-ville. Venez tôt et, si possible, à pied ou en train : la gare de Pineda est sur le même front de mer.","extra":"Lieu : Passeig Marítim (Pineda Centre)."},"sources":["https://visitpineda.com/descobrir-pineda/mercats/"]},{"id":"pineda-de-mar-mercadillo-miercoles-poblenou","town":"Pineda de Mar","cat":"mercadillo","name":"Mercat Poblenou (miércoles)","lat":41.617806,"lng":2.670947,"address":"Avinguda de l'Hispanitat, barrio del Poblenou, Pineda de Mar","tel":"","web":"https://visitpineda.com/descobrir-pineda/mercats/","guardia_url":"","season":"Todo el año","es":{"tipo":"Mercadillo semanal (alimentación, ropa y más).","horario":"Miércoles de 08:00 a 14:00, todo el año.","consejo":"Si te alojas en el Poblenou o cerca de Calella, es el mercadillo más cómodo.","extra":"Lugar: Avinguda de l'Hispanitat (Poblenou)."},"en":{"tipo":"Weekly street market (food, clothes and more).","horario":"Wednesdays 08:00 to 14:00, all year round.","consejo":"If you are staying in Poblenou or near Calella, this is the most convenient market.","extra":"Location: Avinguda de l'Hispanitat (Poblenou)."},"fr":{"tipo":"Marché hebdomadaire (alimentation, vêtements et plus).","horario":"Le mercredi de 08:00 à 14:00, toute l'année.","consejo":"Si vous logez au Poblenou ou près de Calella, c'est le marché le plus pratique.","extra":"Lieu : Avinguda de l'Hispanitat (Poblenou)."},"sources":["https://visitpineda.com/descobrir-pineda/mercats/"]},{"id":"santa-susanna-bar-the-drunken-duck","town":"Santa Susanna","cat":"bar","name":"The Drunken Duck","lat":41.636926,"lng":2.72465,"address":"Plaça d'Europa, local 2, Zona Hotelera, 08398 Santa Susanna","tel":"","web":"","guardia_url":"","season":"Temporada turística (confirma si abre en invierno)","es":{"tipo":"Pub de estilo británico, apto para familias.","horario":"Horario no publicado; en temporada baja confirma antes de ir.","consejo":"De los mejor valorados de Santa Susanna en Google y Tripadvisor. Comida de pub (curry, hamburguesas, asados) por menos de 20 € por persona, con terraza; ponen partidos en la tele. Se llena: reserva si vais en grupo. Está en la zona hotelera, a unos 500 m de la playa.","extra":""},"en":{"tipo":"British-style pub, family-friendly.","horario":"Opening hours not published; in low season, check before you go.","consejo":"One of the best-rated places in Santa Susanna on Google and Tripadvisor. Pub food (curry, burgers, roasts) for under €20 a head, with a terrace; they show matches on TV. It gets busy: book if you are a group. It is in the hotel area, about 500 m from the beach.","extra":""},"fr":{"tipo":"Pub de style britannique, adapté aux familles.","horario":"Horaires non publiés ; en basse saison, vérifiez avant d'y aller.","consejo":"L'un des établissements les mieux notés de Santa Susanna sur Google et Tripadvisor. Cuisine de pub (curry, burgers, rôtis) pour moins de 20 € par personne, avec terrasse ; les matchs passent à la télé. C'est souvent plein : réservez si vous êtes en groupe. Il se trouve dans la zone hôtelière, à environ 500 m de la plage.","extra":""},"sources":["https://gastroranking.es/r/the-drunken-duck_18275/","https://www.tripadvisor.es/Restaurant_Review-g635892-d1516731-Reviews-The_Drunken_Duck-Santa_Susanna_Catalonia.html"]},{"id":"pineda-de-mar-bar-nuckys-by-st-jordi","town":"Pineda de Mar","cat":"bar","name":"Nucky's by St. Jordi","lat":41.625528,"lng":2.689501,"address":"Plaça de les Mèlies, 25, 08397 Pineda de Mar","tel":"627 33 13 69","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Bar de tapas en una plaza del centro, ambiente familiar.","horario":"Horario no publicado; llama antes (627 33 13 69).","consejo":"Carta variada: tapas, hamburguesas, pizzas y cócteles. Terraza grande en la plaza de les Mèlies, cómoda si vas con niños. Las cenas del fin de semana se llenan: reserva.","extra":""},"en":{"tipo":"Tapas bar on a town-centre square, family atmosphere.","horario":"Opening hours not published; ring first (627 33 13 69).","consejo":"Varied menu: tapas, burgers, pizzas and cocktails. Large terrace on Plaça de les Mèlies, comfortable if you have children with you. Weekend dinners get full: book ahead.","extra":""},"fr":{"tipo":"Bar à tapas sur une place du centre, ambiance familiale.","horario":"Horaires non publiés ; appelez avant (627 33 13 69).","consejo":"Carte variée : tapas, burgers, pizzas et cocktails. Grande terrasse sur la plaça de les Mèlies, pratique avec des enfants. Les dîners du week-end affichent complet : réservez.","extra":""},"sources":["https://gastroranking.es/r/nuckys-by-st-jordi_111658/","https://gastroranking.es/restaurantes/barcelona/pineda-de-mar/"]},{"id":"pineda-de-mar-bar-miramar","town":"Pineda de Mar","cat":"bar","name":"Bar y restaurante Miramar","lat":41.619834,"lng":2.684169,"address":"Passeig Marítim, 32, 08397 Pineda de Mar","tel":"691 83 05 33","web":"","guardia_url":"","season":"Todo el año (confirma en invierno)","es":{"tipo":"Bar-restaurante del paseo marítimo, ambiente familiar.","horario":"Horario no publicado; llama antes (691 83 05 33).","consejo":"A un paso de la playa. Los clientes destacan las croquetas, el bocadillo de entraña, las milanesas y las empanadas, y el trato amable. Tiene futbolín y dardos. Pregunta el precio de los cócteles antes de pedir.","extra":""},"en":{"tipo":"Seafront bar-restaurant with a family atmosphere.","horario":"Opening hours not published; ring first (691 83 05 33).","consejo":"A stone's throw from the beach. Customers praise the croquettes, the skirt steak sandwich, the milanesas and the empanadas, as well as the friendly service. There is table football and darts. Ask the price of cocktails before ordering.","extra":""},"fr":{"tipo":"Bar-restaurant du front de mer, ambiance familiale.","horario":"Horaires non publiés ; appelez avant (691 83 05 33).","consejo":"À deux pas de la plage. Les clients apprécient les croquetas, le sandwich à l'entraña (bavette), les milanesas, les empanadas et l'accueil chaleureux. Baby-foot et fléchettes. Demandez le prix des cocktails avant de commander.","extra":""},"sources":["https://gastroranking.es/r/bar-y-restaurante-miramar_56358/","https://gastroranking.es/restaurantes/barcelona/pineda-de-mar/"]},{"id":"pineda-de-mar-comer-diagonal","town":"Pineda de Mar","cat":"comer","name":"Restaurant Diagonal","lat":41.623372,"lng":2.690581,"address":"Av. de la Mare de Déu de Montserrat, 19, 08397 Pineda de Mar","tel":"937 67 15 02","web":"http://www.restaurantdiagonal.com/","guardia_url":"","season":"Todo el año","es":{"tipo":"Restaurante familiar de cocina mediterránea y catalana: arroces, pescado y carnes.","horario":"Invierno: mediodías de 13:00 a 15:45; martes cerrado; domingo y lunes por la noche cerrado. Verano: 13:00–15:45 y 19:30–22:45; cerrado lunes noche y martes.","consejo":"Lo lleva la misma familia desde 1968 (ya van por la 4.ª generación). Se llena: reserva, sobre todo en fin de semana (937 67 15 02).","extra":""},"en":{"tipo":"Family restaurant serving Mediterranean and Catalan food: rice dishes, fish and meat.","horario":"Winter: lunch 13:00 to 15:45; closed on Tuesdays and on Sunday and Monday evenings. Summer: 13:00–15:45 and 19:30–22:45; closed Monday evening and Tuesday.","consejo":"Run by the same family since 1968 (now in its 4th generation). It fills up: book, especially at weekends (937 67 15 02).","extra":""},"fr":{"tipo":"Restaurant familial de cuisine méditerranéenne et catalane : riz, poissons et viandes.","horario":"Hiver : le midi de 13:00 à 15:45 ; fermé le mardi et les dimanche et lundi soir. Été : 13:00–15:45 et 19:30–22:45 ; fermé le lundi soir et le mardi.","consejo":"Tenu par la même famille depuis 1968 (déjà la 4e génération). Il est vite complet : réservez, surtout le week-end (937 67 15 02).","extra":""},"sources":["http://www.restaurantdiagonal.com/","https://gastroranking.es/r/diagonal_424/","https://gastroranking.es/restaurantes/barcelona/pineda-de-mar/"]},{"id":"pineda-de-mar-comer-domestic","town":"Pineda de Mar","cat":"comer","name":"Restaurant Marisqueria Domèstic","lat":41.617115,"lng":2.672782,"address":"Passeig d'Europa, 2, 08397 Pineda de Mar (Poblenou)","tel":"93 766 40 89","web":"https://www.domestic-pineda.com","guardia_url":"","season":"Todo el año","es":{"tipo":"Marisquería familiar: arroces, pescado y marisco.","horario":"Invierno: martes a jueves 13:00–16:00; viernes y sábado 13:00–16:00 y 20:00–23:00; domingo 13:00–16:00; lunes cerrado.","consejo":"La guía Macarfi lo llama 'un clásico de la zona' (unos 40 € por persona sin bebida). Destacan el calamar a la romana y los arroces; el marisco viene de sus propios viveros. Hay menú del día, también en fin de semana. Reservas solo por teléfono (93 766 40 89). Fácil de aparcar.","extra":""},"en":{"tipo":"Family-run seafood restaurant: rice dishes, fish and shellfish.","horario":"Winter: Tuesday to Thursday 13:00–16:00; Friday and Saturday 13:00–16:00 and 20:00–23:00; Sunday 13:00–16:00; closed on Mondays.","consejo":"The Macarfi guide calls it 'a classic in the area' (about €40 a head without drinks). Its battered squid and rice dishes stand out; the shellfish comes from its own tanks. There is a set menu, at weekends too. Bookings by phone only (93 766 40 89). Easy parking.","extra":""},"fr":{"tipo":"Restaurant familial de fruits de mer : riz, poissons et crustacés.","horario":"Hiver : du mardi au jeudi 13:00–16:00 ; vendredi et samedi 13:00–16:00 et 20:00–23:00 ; dimanche 13:00–16:00 ; fermé le lundi.","consejo":"Le guide Macarfi le qualifie de « classique du coin » (environ 40 € par personne hors boissons). On y recommande le calamar à la romaine et les riz ; les fruits de mer viennent de ses propres viviers. Menu du jour, y compris le week-end. Réservations uniquement par téléphone (93 766 40 89). Stationnement facile.","extra":""},"sources":["https://macarfi.com/en/bcn/restaurant-card/domestic","https://www.domestic-pineda.com","https://gastroranking.es/r/restaurante-marisqueria-domestic_249320/"]},{"id":"santa-susanna-iconico-can-rates","town":"Santa Susanna","cat":"iconico","name":"Can Ratés y su torre de vigía (1584)","lat":41.64022,"lng":2.70855,"address":"C/ Montseny, s/n, 08398 Santa Susanna","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Masía fortificada del s. XVI con torre de vigía de 1584; hoy es un equipamiento municipal para actos culturales.","horario":"El exterior se ve siempre; el interior solo abre cuando hay actos o exposiciones.","consejo":"Bajo la ventana del primer piso de la torre hay una inscripción con el año de construcción, 1584 (la levantó Bartomeu Poch). Mira la agenda del Ayuntamiento por si hay alguna actividad.","extra":""},"en":{"tipo":"16th-century fortified farmhouse with a 1584 watchtower; today a municipal venue for cultural events.","horario":"The outside can be seen at any time; the inside only opens for events or exhibitions.","consejo":"Below the first-floor window of the tower, an inscription records the year it was built, 1584 (by Bartomeu Poch). Check the town hall's events listings in case something is on.","extra":""},"fr":{"tipo":"Mas fortifié du XVIe siècle avec une tour de guet de 1584 ; aujourd'hui lieu municipal d'activités culturelles.","horario":"L'extérieur est visible à tout moment ; l'intérieur n'ouvre que lors d'activités ou d'expositions.","consejo":"Sous la fenêtre du premier étage de la tour, une inscription rappelle l'année de construction, 1584 (par Bartomeu Poch). Consultez l'agenda de la mairie au cas où une activité serait prévue.","extra":""},"sources":["https://patrimonicultural.diba.cat/element/torre-de-can-rates","https://patrimonicultural.diba.cat/element/can-rates"]},{"id":"santa-susanna-iconico-torre-can-torrent-de-mar","town":"Santa Susanna","cat":"iconico","name":"Torre de Can Torrent de Mar (Torre de la Plana)","lat":41.62999,"lng":2.71587,"address":"Passeig Marítim, s/n (estación de Rodalies), 08398 Santa Susanna","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Torre de vigía del s. XVI en primera línea de mar.","horario":"Exterior, siempre visible y gratis.","consejo":"Curiosidad: según el inventario de patrimonio, en su planta baja están las dependencias de la estación de tren y la máquina de billetes. Está junto a la playa, ideal para verla de paso.","extra":""},"en":{"tipo":"16th-century watchtower on the seafront.","horario":"Exterior always visible, free.","consejo":"Fun fact: according to the heritage inventory, its ground floor houses the train station facilities and the ticket machine. It is right by the beach, ideal to see in passing.","extra":""},"fr":{"tipo":"Tour de guet du XVIe siècle en bord de mer.","horario":"Extérieur visible à tout moment, gratuit.","consejo":"Anecdote : selon l'inventaire du patrimoine, son rez-de-chaussée abrite les locaux de la gare et le distributeur de billets. Elle est au bord de la plage, idéale à voir en passant.","extra":""},"sources":["https://patrimonicultural.diba.cat/element/torre-de-can-torrent-de-mar"]},{"id":"pineda-de-mar-iconico-esglesia-santa-maria","town":"Pineda de Mar","cat":"iconico","name":"Iglesia de Santa Maria de Pineda","lat":41.628762,"lng":2.689832,"address":"C/ Reverend Antoni Doltra, s/n (junto a la N-II y Can Jalpí), 08397 Pineda de Mar","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Iglesia de aspecto fortificado (reformas del s. XVI), con portal renacentista y campanario octogonal.","horario":"La fachada se ve siempre; el horario de visita del interior no está publicado.","consejo":"Fíjate en la puerta renacentista: el dintel recuerda el ataque de las galeras turcas del corsario Dragut del 1 de agosto de 1545. Justo al lado está la masía Can Jalpí, de donde sale la ruta a la ermita de Gràcia.","extra":""},"en":{"tipo":"Fortified-looking church (16th-century alterations) with a Renaissance doorway and an octagonal bell tower.","horario":"The façade can be seen at any time; visiting hours for the interior are not published.","consejo":"Look at the Renaissance doorway: the lintel recalls the attack by the Turkish galleys of the corsair Dragut on 1 August 1545. Right next door is the Can Jalpí farmhouse, where the walk to the Ermita de Gràcia starts.","extra":""},"fr":{"tipo":"Église d'aspect fortifié (transformations du XVIe siècle), avec portail Renaissance et clocher octogonal.","horario":"La façade est visible à tout moment ; les horaires de visite de l'intérieur ne sont pas publiés.","consejo":"Observez le portail Renaissance : le linteau rappelle l'attaque des galères turques du corsaire Dragut le 1er août 1545. Juste à côté se trouve le mas Can Jalpí, point de départ de la balade vers l'ermitage de Gràcia.","extra":""},"sources":["https://patrimonicultural.diba.cat/element/esglesia-parroquial-de-santa-maria-3","https://visitpineda.com/experiencia/ermita-gracia-turo-guardia/"]},{"id":"pineda-de-mar-iconico-aqueducte-can-cua","town":"Pineda de Mar","cat":"iconico","name":"Acueducto romano de Can Cua","lat":41.641379,"lng":2.681307,"address":"Can Cua, junto a la carretera BV-5116 (Pineda–Hortsavinyà), Pineda de Mar","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Restos de un acueducto romano (s. II–III d. C.).","horario":"Al aire libre; sin horario ni entrada.","consejo":"Quedan 4 arcos, de hasta 5 m de alto. Subiendo por la carretera BV-5116 de Pineda a Hortsavinyà se ven a la derecha, unos 400 m antes de la C-32. A pie, la Ruta de la Font del Ferro (marcas naranjas) sale de la iglesia de Pineda y pasa por el acueducto.","extra":""},"en":{"tipo":"Remains of a Roman aqueduct (2nd–3rd century AD).","horario":"Open air; no opening hours or entry fee.","consejo":"Four arches survive, up to 5 m high. Driving up the BV-5116 from Pineda towards Hortsavinyà, you can see them on the right about 400 m before the C-32. On foot, the Font del Ferro walk (orange waymarks) starts at Pineda church and passes the aqueduct.","extra":""},"fr":{"tipo":"Vestiges d'un aqueduc romain (IIe–IIIe siècle apr. J.-C.).","horario":"En plein air ; sans horaires ni entrée.","consejo":"Il reste 4 arches, jusqu'à 5 m de haut. En montant par la route BV-5116 de Pineda vers Hortsavinyà, on les voit sur la droite environ 400 m avant la C-32. À pied, la Ruta de la Font del Ferro (balisage orange) part de l'église de Pineda et passe par l'aqueduc.","extra":""},"sources":["https://patrimonicultural.diba.cat/element/aqueducte-de-can-cua","https://visitpineda.com/experiencia/ruta-saludable/"]},{"id":"pineda-de-mar-iconico-castell-de-montpalau","town":"Pineda de Mar","cat":"iconico","name":"Castell de Montpalau","lat":41.642179,"lng":2.670359,"address":"Turó de Montpalau, s/n, Pineda de Mar","tel":"","web":"","guardia_url":"","season":"Todo el año","es":{"tipo":"Ruinas de un castillo medieval (s. XI–XVIII) en lo alto del Turó de Montpalau.","horario":"Sin horario: ruinas en terreno privado; solo se llega a pie y el acceso es difícil.","consejo":"Visit Pineda propone el Circuit del Turó de Montpalau, su ruta más corta, por la montaña más emblemática de Pineda: lleva calzado de montaña. Varios muros y la torre del homenaje se han derrumbado y la finca es privada: mira las ruinas desde fuera.","extra":""},"en":{"tipo":"Ruins of a medieval castle (11th–18th century) on top of Turó de Montpalau.","horario":"No opening hours: ruins on private land; reachable on foot only, difficult access.","consejo":"Visit Pineda suggests the Circuit del Turó de Montpalau, its shortest walk, on Pineda's most emblematic hill: wear walking boots. Several walls and the keep have collapsed and the land is private: view the ruins from outside.","extra":""},"fr":{"tipo":"Ruines d'un château médiéval (XIe–XVIIIe siècle) au sommet du Turó de Montpalau.","horario":"Sans horaires : ruines sur un terrain privé ; accès uniquement à pied et difficile.","consejo":"Visit Pineda propose le Circuit del Turó de Montpalau, sa balade la plus courte, sur la colline la plus emblématique de Pineda : prévoyez des chaussures de randonnée. Plusieurs murs et le donjon se sont effondrés et le terrain est privé : regardez les ruines de l'extérieur.","extra":""},"sources":["https://patrimonicultural.diba.cat/element/castell-de-montpalau","https://visitpineda.com/experiencia/circuit-turo-montpalau/"]},{"id":"santa-susanna-atardecer-turo-de-la-guardia","town":"Santa Susanna","cat":"atardecer","name":"Turó de la Guàrdia","lat":41.645034,"lng":2.685743,"address":"Serra de la Guàrdia, entre Santa Susanna y Pineda de Mar","tel":"","web":"https://visitpineda.com/experiencia/ermita-gracia-turo-guardia/","guardia_url":"","season":"Todo el año","es":{"tipo":"Cima con zona de despegue de parapente; antigua atalaya sobre la costa.","horario":"Acceso libre a pie por pistas y senderos.","consejo":"Es el punto más alto del circuito Ermita de Gràcia – Turó de la Guàrdia: unos 50 min a pie desde Can Jalpí (Pineda). Era un punto de vigía que dominaba la costa del faro de Calella al río Tordera; con el día claro se ven las Agudes del Montseny. En invierno anochece hacia las 17:30: baja con frontal.","extra":""},"en":{"tipo":"Summit with a paragliding take-off area; a former lookout over the coast.","horario":"Free access on foot along tracks and paths.","consejo":"It is the highest point of the Ermita de Gràcia – Turó de la Guàrdia circuit: about 50 minutes' walk from Can Jalpí (Pineda). It was a lookout post commanding the coast from Calella lighthouse to the Tordera river; on a clear day you can see Les Agudes in the Montseny. In winter it gets dark around 17:30: bring a head torch for the way down.","extra":""},"fr":{"tipo":"Sommet avec aire de décollage de parapente ; ancien poste de guet sur la côte.","horario":"Accès libre à pied par des pistes et des sentiers.","consejo":"C'est le point culminant du circuit Ermita de Gràcia – Turó de la Guàrdia : environ 50 min à pied depuis Can Jalpí (Pineda). Ancien poste de guet qui dominait la côte du phare de Calella jusqu'au fleuve Tordera ; par temps clair, on voit les Agudes du Montseny. En hiver, la nuit tombe vers 17:30 : prévoyez une lampe frontale pour la descente.","extra":""},"sources":["https://visitpineda.com/experiencia/ermita-gracia-turo-guardia/","https://www.openstreetmap.org/node/1249943922"]},{"id":"pineda-de-mar-atardecer-ermita-de-gracia","town":"Pineda de Mar","cat":"atardecer","name":"Ermita de la Mare de Déu de Gràcia","lat":41.63389,"lng":2.69813,"address":"Turó de la Mare de Déu de Gràcia, entre Pineda de Mar y Santa Susanna","tel":"","web":"https://visitpineda.com/experiencia/ermita-gracia-turo-guardia/","guardia_url":"","season":"Todo el año","es":{"tipo":"Mirador junto a una ermita marinera de 1715, en un cerro de 77 m.","horario":"Acceso libre al exterior.","consejo":"Desde arriba se ve la llanura, Pineda y, al fondo, Calella y su faro, hacia el suroeste, por donde se pone el sol en invierno. Se sube a pie en unos 20 min desde Can Jalpí, junto a la iglesia de Pineda. La ermita está en el término de Santa Susanna, pero es propiedad de Pineda.","extra":""},"en":{"tipo":"Viewpoint beside a sailors' chapel from 1715, on a 77 m hill.","horario":"Free access to the outside.","consejo":"From the top you can see the plain, Pineda and, beyond, Calella and its lighthouse to the south-west, where the sun sets in winter. It is about a 20-minute walk up from Can Jalpí, next to Pineda church. The chapel stands within Santa Susanna's boundaries but belongs to Pineda.","extra":""},"fr":{"tipo":"Belvédère à côté d'un ermitage de marins de 1715, sur une colline de 77 m.","horario":"Accès libre à l'extérieur.","consejo":"D'en haut, on voit la plaine, Pineda et, au loin, Calella et son phare, vers le sud-ouest, là où le soleil se couche en hiver. On y monte à pied en 20 min environ depuis Can Jalpí, à côté de l'église de Pineda. L'ermitage se trouve sur la commune de Santa Susanna mais appartient à Pineda.","extra":""},"sources":["https://patrimonicultural.diba.cat/element/turo-de-la-mare-de-deu-de-gracia","https://patrimonicultural.diba.cat/element/mare-de-deu-de-gracia-1","https://visitpineda.com/experiencia/ermita-gracia-turo-guardia/"]},{"id":"santa-susanna-ruta-ermita-gracia-turo-guardia","town":"Santa Susanna","cat":"ruta","name":"Circuito Ermita de Gràcia – Turó de la Guàrdia","lat":41.629537,"lng":2.689396,"address":"Salida: Can Jalpí (C/ Sant Joan, s/n), junto a la N-II y frente a la iglesia de Pineda de Mar","tel":"","web":"https://visitpineda.com/experiencia/ermita-gracia-turo-guardia/","guardia_url":"","season":"Todo el año","es":{"tipo":"Ruta circular por los cerros entre Pineda y Santa Susanna.","horario":"Todo el año; mejor con luz de día.","consejo":"Sale de Can Jalpí, una masía junto a la N-II, frente a la iglesia de Pineda y al lado de una gasolinera, a unos 1,7 km del centro de Santa Susanna. Pasa por la ermita de Gràcia (20 min), los Pins del Poeta, el Turó de la Guàrdia (50 min) y la iglesia románica de Sant Pere de Riu, y cruza un arco del acueducto romano.","extra":"8 km · unas 2 h · dificultad media (unos 200 m de desnivel) · circular"},"en":{"tipo":"Circular walk over the hills between Pineda and Santa Susanna.","horario":"All year round; best in daylight.","consejo":"It starts at Can Jalpí, a farmhouse by the N-II, opposite Pineda church and next to a petrol station, about 1.7 km from the centre of Santa Susanna. It passes the Ermita de Gràcia (20 min), the Pins del Poeta, Turó de la Guàrdia (50 min) and the Romanesque church of Sant Pere de Riu, and crosses an arch of the Roman aqueduct.","extra":"8 km · about 2 h · moderate (about 200 m of ascent) · circular"},"fr":{"tipo":"Boucle à pied sur les collines entre Pineda et Santa Susanna.","horario":"Toute l'année ; de préférence de jour.","consejo":"Départ de Can Jalpí, un mas au bord de la N-II, face à l'église de Pineda et à côté d'une station-service, à environ 1,7 km du centre de Santa Susanna. Elle passe par l'ermitage de Gràcia (20 min), les Pins del Poeta, le Turó de la Guàrdia (50 min) et l'église romane de Sant Pere de Riu, et franchit une arche de l'aqueduc romain.","extra":"8 km · environ 2 h · difficulté moyenne (environ 200 m de dénivelé) · boucle"},"sources":["https://visitpineda.com/experiencia/ermita-gracia-turo-guardia/","https://patrimonicultural.diba.cat/element/mas-coll-can-jalpi"]},{"id":"pineda-de-mar-ruta-font-del-ferro","town":"Pineda de Mar","cat":"ruta","name":"Ruta a la Font del Ferro","lat":41.628762,"lng":2.689832,"address":"Salida y llegada: iglesia de Santa Maria, Pineda de Mar","tel":"","web":"https://visitpineda.com/experiencia/ruta-saludable/","guardia_url":"","season":"Todo el año","es":{"tipo":"Ruta circular de naturaleza y patrimonio por la montaña de Pineda.","horario":"Todo el año; mejor con luz de día.","consejo":"Sigue las marcas naranjas. Pasa por un mirador, el acueducto romano, la Font del Ferro, un molino harinero, el Pont del Diable y el pino monumental de Can Cànoves. Ten cuidado en el tramo junto a la carretera d'Hortsavinyà y lleva agua.","extra":"6,5 km · 1 h 30 min · moderada (apta para niños) · circular"},"en":{"tipo":"Circular nature and heritage walk in the hills above Pineda.","horario":"All year round; best in daylight.","consejo":"Follow the orange waymarks. It passes a viewpoint, the Roman aqueduct, the Font del Ferro spring, a flour mill, the Pont del Diable and the monumental pine of Can Cànoves. Take care on the stretch beside the Hortsavinyà road and bring water.","extra":"6.5 km · 1 h 30 min · moderate (suitable for children) · circular"},"fr":{"tipo":"Boucle nature et patrimoine dans la montagne de Pineda.","horario":"Toute l'année ; de préférence de jour.","consejo":"Suivez le balisage orange. Elle passe par un belvédère, l'aqueduc romain, la Font del Ferro, un moulin à farine, le Pont del Diable et le pin monumental de Can Cànoves. Soyez prudent sur le tronçon le long de la route d'Hortsavinyà et emportez de l'eau.","extra":"6,5 km · 1 h 30 · modérée (adaptée aux enfants) · boucle"},"sources":["https://visitpineda.com/experiencia/ruta-saludable/"]},{"id":"calella-urgencias-hospital-sant-jaume","town":"Calella","cat":"urgencias","name":"Hospital Comarcal Sant Jaume de Calella","lat":41.61518,"lng":2.657213,"address":"C/ Sant Jaume, 209-219, 08370 Calella","tel":"93 769 02 01 / Emergencias: 112","web":"https://salutms.cat/corporacio/els-nostres-centres/hospital-de-calella-2/","guardia_url":"","season":"Todo el año","es":{"tipo":"Hospital con urgencias 24 horas.","horario":"Urgencias 24 h, todos los días.","consejo":"Es el hospital con urgencias más cercano: a unos 3 km de Pineda y 5 km de Santa Susanna. Hay parking de pago delante. También se llega con Rodalies R1 (estación de Calella) o con los buses 622 y 625. Emergencias: 112.","extra":""},"en":{"tipo":"Hospital with 24-hour A&E.","horario":"A&E open 24 hours, every day.","consejo":"The nearest hospital with A&E: about 3 km from Pineda and 5 km from Santa Su
